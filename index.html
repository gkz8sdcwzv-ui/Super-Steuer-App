 id:'est-14', topic:'est', title:'Gewinnermittlung: Betriebsvermögensvergleich und EÜR', diff:1, points:3, exam:true,
 source:'Klausur 2019, Aufgabe 2 (3 Punkte); Skript 2.2.1',
 text:`<p>a) Ein Einzelkaufmann (bilanzierungspflichtig) weist aus: Eigenkapital zum 31.12.08: 550.000 €, zum 31.12.07: 300.000 €, Privatentnahmen 08: 100.000 €, Geldeinlage vom privaten Sparbuch in 08: 150.000 €.</p>
 <p>b) Eine freiberufliche Grafikerin (EÜR) hat 2026 Betriebseinnahmen von 80.000 € und Betriebsausgaben von 50.000 €. Außerdem hat sie ein Bankdarlehen von 20.000 € aufgenommen und 2.000 € davon privat entnommen.</p>`,
 parts:[
  {type:'num', q:'a) Der steuerliche Gewinn 08 beträgt (€)', answer:200000, tol:1},
  {type:'num', q:'b) Der Gewinn der Grafikerin 2026 beträgt (€)', answer:30000, tol:1},
  {type:'single', q:'Welche Gewinnermittlungsart MUSS ein Gewerbetreibender anwenden, der im Handelsregister eingetragen ist?', options:['Einnahmen-Überschuss-Rechnung (§ 4 Abs. 3 EStG)','Betriebsvermögensvergleich (§ 4 Abs. 1 i.V.m. § 5 EStG) wegen handelsrechtlicher Buchführungspflicht','Er hat ein freies Wahlrecht.'], correct:[1]}
 ],
 solution:`<table class="calc">
 <tr><td>Betriebsvermögen (EK) 31.12.08</td><td class="n">550.000</td><td class="ref">§ 4 Abs. 1 S. 1 EStG</td></tr>
 <tr><td>./. Betriebsvermögen 31.12.07</td><td class="n">− 300.000</td><td class="ref"></td></tr>
 <tr><td>+ Entnahmen</td><td class="n">+ 100.000</td><td class="ref">§ 4 Abs. 1 S. 2 EStG</td></tr>
 <tr><td>./. Einlagen</td><td class="n">− 150.000</td><td class="ref">§ 4 Abs. 1 S. 8 EStG</td></tr>
 <tr class="sum"><td>Gewinn 08</td><td class="n">200.000 €</td><td class="ref"></td></tr></table>
 <p><b>b)</b> Gewinn = Betriebseinnahmen − Betriebsausgaben = 80.000 − 50.000 = <b>30.000 €</b>. Die Darlehensaufnahme ist keine Betriebseinnahme (reiner Geldzufluss, Verbindlichkeit), die Entnahme ist bei der EÜR irrelevant (§ 4 Abs. 3 EStG, Zufluss-/Abflussprinzip § 11 EStG). Freiberufler dürfen die EÜR wählen, weil sie nicht buchführungspflichtig sind (§ 18 EStG, § 141 AO gilt nur für Gewerbetreibende und Land-/Forstwirte).</p>
 <p><b>c)</b> Kaufleute (§§ 1, 238 HGB) sind handelsrechtlich buchführungspflichtig; über § 140 AO wird das zur steuerlichen Pflicht → Bilanzierung nach § 5 EStG.</p>`,
 laws:['§ 4 Abs. 1 EStG – Betriebsvermögensvergleich (EK-Differenz + Entnahmen − Einlagen)','§ 5 EStG – Bilanzierung bei Buchführungspflicht (Maßgeblichkeit der Handelsbilanz)','§ 4 Abs. 3 EStG – Einnahmen-Überschuss-Rechnung','§ 11 EStG – Zufluss-/Abflussprinzip','§ 140, § 141 AO – derivative und originäre Buchführungspflicht (Umsatz > 800.000 € oder Gewinn > 80.000 €)','§ 238 HGB – Buchführungspflicht des Kaufmanns'],
 example:`<p>Der Betriebsvermögensvergleich funktioniert wie das Nachrechnen deines Kontos: Du hattest 300, jetzt hast du 550 – also 250 mehr. Aber du hast zwischendurch 150 von einem anderen Konto überwiesen bekommen (Einlage, kein Gewinn) und 100 abgehoben (Entnahme, war trotzdem verdient). Echter Gewinn: 250 + 100 − 150 = 200.</p>`,
 traps:['Einlagen abziehen, Entnahmen hinzurechnen – nicht umgekehrt (häufiger Vorzeichenfehler, 2019 wurde oft 150.000 angekreuzt).','Darlehen sind bei der EÜR keine Betriebseinnahmen.']
},

 <tr><td>Geldbuße</td><td class="n">0</td><td class="ref">§ 4 Abs. 5 S. 1 Nr. 8 EStG</td></tr></table>
 <p>Weitere Nicht-Abzugsposten: Gewerbesteuer (§ 4 Abs. 5b EStG), Jagd/Jacht (Nr. 4), unangemessene Repräsentation wie der Ferrari (Nr. 7), Geldstrafen (§ 12 Nr. 4 EStG), 50 % der Aufsichtsratsvergütung bei Kapitalgesellschaften (§ 10 Nr. 4 KStG).</p>`,
 laws:['§ 4 Abs. 4 EStG – Betriebsausgaben = durch den Betrieb veranlasste Aufwendungen','§ 4 Abs. 5 S. 1 Nr. 1 EStG – Geschenke an Nicht-Arbeitnehmer: Freigrenze 50 € je Empfänger und Jahr','§ 4 Abs. 5 S. 1 Nr. 2 EStG – Bewirtung: 70 % der angemessenen Kosten','§ 4 Abs. 5 S. 1 Nr. 8 EStG – Geldbußen, Ordnungs- und Verwarnungsgelder','§ 4 Abs. 5b EStG – Gewerbesteuer keine Betriebsausgabe','§ 4 Abs. 7 EStG – gesonderte Aufzeichnungspflicht für Geschenke/Bewirtung','§ 37b EStG – Pauschalierung 30 % bei Sachzuwendungen'],
 example:`<p><b>Freigrenze vs. Freibetrag – der wichtigste Unterschied im ganzen Steuerrecht:</b> Ein <b>Freibetrag</b> ist wie ein Gutschein: 50 € sind immer frei, nur der Rest zählt. Eine <b>Freigrenze</b> ist wie eine Türschwelle: Solange du darunter bleibst, ist alles okay; trittst du einen Cent drüber, fällt ALLES weg. Die 50 € bei Geschenken sind eine Freigrenze: 50,00 € → voll abziehbar, 50,01 € → nichts. Deshalb verschenken Firmen Präsente für 49,99 €.</p><p>Bei der Bewirtung gibt es dagegen zwei Hürden: erst „angemessen?“ (Champagner-Dinner für 300 € ist es vielleicht nicht), dann 70 % davon.</p>`,
 traps:['50 € ist eine FREIGRENZE (alles oder nichts), kein Freibetrag.','Mehrere kleine Geschenke an denselben Kunden werden im Jahr addiert.','Geschenke an eigene Arbeitnehmer sind immer voll abziehbar (Lohnaufwand).','Bewirtung: 70 % vom angemessenen Teil, nicht vom Gesamtbetrag. Die 30 % Kürzung ist bei KSt-Aufgaben außerbilanziell hinzuzurechnen.','Geldbuße (behördlich) UND Geldstrafe (Gericht) sind nie abziehbar.']
},
{
 id:'est-16', topic:'est', title:'Teileinkünfteverfahren beim Einzelkaufmann', diff:2, points:5, exam:true,
 source:'Klausur 2019, Aufgabe 5 (5 Punkte); 2010, Aufgaben 8/9',
 text:`<p>Ein Einzelkaufmann hat zutreffend Aktien in der Bilanz aktiviert. Er erhielt eine Dividende nach Abzug von Kapitalertragsteuer (Soli vernachlässigt) von 7.500 €. Den Erwerb der Aktien hatte er mit Kredit finanziert; insoweit sind 2.000 € Kreditzinsen angefallen.</p>`,
 parts:[
  {type:'num', q:'Die (steuerrechtlichen) Einnahmen betragen (€ brutto)', answer:10000, tol:1},
  {type:'num', q:'Die sich daraus ergebenden steuerpflichtigen Einkünfte betragen (€)', answer:4800, tol:1},
  {type:'num', q:'Zusatz: Wie hoch wäre der Auszahlungsbetrag MIT Solidaritätszuschlag gewesen (€)?', answer:7362.5, tol:0.5}
 ],
 solution:`<table class="calc">
 <tr><td>Nettodividende 7.500 = 75 % → Bruttodividende</td><td class="n">10.000</td><td class="ref">§ 43a Abs. 1 Nr. 1 EStG (25 % KapESt)</td></tr>
 <tr><td>Aktien im Betriebsvermögen → keine Abgeltung, Teileinkünfteverfahren: 40 % steuerfrei</td><td class="n">− 4.000</td><td class="ref">§ 3 Nr. 40 S. 1 Buchst. d, S. 2 EStG; § 20 Abs. 8 EStG</td></tr>
 <tr><td>Steuerpflichtige Einnahmen (60 %)</td><td class="n">6.000</td><td class="ref"></td></tr>
 <tr><td>Finanzierungszinsen 2.000, nur zu 60 % abziehbar</td><td class="n">− 1.200</td><td class="ref">§ 3c Abs. 2 EStG</td></tr>
 <tr class="sum"><td>Steuerpflichtige Einkünfte aus Gewerbebetrieb</td><td class="n">4.800 €</td><td class="ref">§ 15 EStG</td></tr></table>
 <p>Die einbehaltene KapESt (2.500 €) wird auf die tarifliche ESt angerechnet (§ 36 Abs. 2 Nr. 2 EStG), da im Betriebsvermögen keine Abgeltungswirkung besteht (§ 43 Abs. 5 S. 2 EStG).</p>
 <p><b>Zusatz Auszahlung mit Soli:</b> 10.000 − 2.500 KapESt − 137,50 Soli (5,5 % × 2.500) = <b>7.362,50 €</b>.</p>
 <p><b>Buchung:</b> Bank 7.500 / Privatentnahme (Steuern) 2.500 an Beteiligungserträge 10.000.</p>`,
 laws:['§ 3 Nr. 40 EStG – Teileinkünfteverfahren: 40 % steuerfrei (Dividenden, Veräußerungsgewinne im Betriebsvermögen, § 17 EStG)','§ 3c Abs. 2 EStG – zugehörige Aufwendungen nur zu 60 % abziehbar','§ 20 Abs. 8 EStG – Subsidiarität: im BV gehören Dividenden zu § 15','§ 43 Abs. 4, 5 S. 2 EStG – KapESt wird einbehalten, aber keine Abgeltungswirkung im BV','§ 36 Abs. 2 Nr. 2 EStG – Anrechnung der KapESt','§ 32d Abs. 2 Nr. 3 EStG – Option zum TEV im Privatvermögen bei ≥ 25 % oder ≥ 1 % + berufliche Tätigkeit'],
 example:`<p><b>Warum 60 %?</b> Die GmbH/AG hat auf ihren Gewinn schon ca. 30 % Steuern gezahlt (KSt + GewSt). Würde der Aktionär die Dividende nochmal voll versteuern, wären das zusammen über 60 %. Also sagt der Staat: Beim Unternehmer im Betriebsvermögen versteuern wir nur 60 % mit dem persönlichen Satz; im Privatvermögen nehmen wir pauschal 25 %.</p><p><b>Spiegelbild-Regel:</b> Wenn nur 60 % der Einnahmen steuerpflichtig sind, dürfen auch nur 60 % der dazugehörigen Kosten abgezogen werden (§ 3c Abs. 2). Sonst würde man Kosten voll absetzen für Einnahmen, die zu 40 % steuerfrei sind.</p>`,
 traps:['Erst brutto rechnen (netto / 0,75)! Die KapESt ist nur eine Vorauszahlung.','Im Betriebsvermögen gibt es KEINE Abgeltungsteuer → Teileinkünfteverfahren mit Tarif.','Kosten nur zu 60 % abziehbar (§ 3c Abs. 2) – im Privatvermögen (Abgeltungsteuer) gar nicht (§ 20 Abs. 9).','Bei Kapitalgesellschaften als Anteilseigner gilt stattdessen § 8b KStG (95 % steuerfrei).']
},
{
 id:'est-17', topic:'est', title:'Teileinkünfteverfahren vs. Abgeltungsteuer – erklären und beurteilen', diff:2, points:6, exam:true,
 source:'Klausuren 2020, 2021 (Aufgabe 10, Erläuterung); 2013, Aufgabe 4',
 text:`<p>Erläutern Sie, was man unter dem Teileinkünfteverfahren versteht, geben Sie ein aussagekräftiges Beispiel an und beurteilen Sie dieses im Vergleich zur Abgeltungsteuer.</p>`,
 parts:[
  {type:'self', q:'Erläuterung mit Beispiel und Beurteilung (Musterlösung aufdecken und selbst bewerten)', model:`<p><b>Begriff:</b> Das Teileinkünfteverfahren (TEV, § 3 Nr. 40, § 3c Abs. 2 EStG) besteuert Erträge aus Anteilen an Kapitalgesellschaften (Dividenden, Veräußerungsgewinne), die im <b>Betriebsvermögen</b> gehalten werden oder unter § 17 EStG fallen (Beteiligung ≥ 1 % im Privatvermögen bei Veräußerung), nur zu <b>60 %</b> mit dem persönlichen (tariflichen) Steuersatz; 40 % sind steuerfrei. Damit zusammenhängende Aufwendungen sind entsprechend nur zu 60 % abziehbar. Grund: Vorbelastung des Gewinns mit KSt und GewSt auf Ebene der Gesellschaft.</p>
 <p><b>Abgeltungsteuer</b> (§ 32d Abs. 1, § 43 Abs. 5 EStG): Kapitalerträge im <b>Privatvermögen</b> werden pauschal mit 25 % (zzgl. Soli, ggf. KiSt) an der Quelle besteuert; damit ist die ESt abgegolten. Werbungskosten sind nicht abziehbar, nur der Sparer-Pauschbetrag (1.000 €). Günstigerprüfung (§ 32d Abs. 6) möglich, wenn der persönliche Satz unter 25 % liegt.</p>
 <p><b>Beispiel:</b> Dividende 10.000 €, Kreditzinsen 2.000 €, persönlicher Steuersatz 42 %.<br>
 TEV: (10.000 − 2.000) × 60 % = 4.800 € × 42 % = <b>2.016 €</b> Steuer.<br>
 Abgeltungsteuer: 10.000 × 25 % = <b>2.500 €</b>, Zinsen nicht abziehbar.<br>
 Ohne Kosten und bei 42 %: TEV 10.000 × 60 % × 42 % = 2.520 € vs. 2.500 € Abgeltungsteuer → fast gleich; bei niedrigerem Satz (z. B. 30 %: 1.800 €) ist das TEV günstiger, bei Spitzensatz 45 % (2.700 €) die Abgeltungsteuer.</p>
 <p><b>Beurteilung:</b> Das TEV lohnt sich bei hohen Finanzierungskosten (Kostenabzug 60 %) und bei persönlichen Steuersätzen unter ca. 41,67 % (25 % / 60 %). Die Abgeltungsteuer ist einfacher (Quellenabzug, keine Erklärung), aber ohne Kostenabzug und mit beschränkter Verlustverrechnung. Deshalb gibt es für unternehmerisch Beteiligte im Privatvermögen (≥ 25 % oder ≥ 1 % + berufliche Tätigkeit) die Option zum TEV (§ 32d Abs. 2 Nr. 3 EStG).</p>`},
  {type:'multi', q:'Welche Aussagen zum Teileinkünfteverfahren sind zutreffend?', options:['Es kommt zur Anwendung bei zeitweiser Steuerpflicht.','Es gilt für Zinsen und Dividenden im Betriebsvermögen.','Es gilt für Einkünfte aus Anteilen an Kapitalgesellschaften im Betriebsvermögen.','Die verwaltende Bank muss trotzdem Kapitalertragsteuer einbehalten.','Die Kapitalertragsteuer hat in diesem Fall Abgeltungswirkung.'], correct:[2,3]}
 ],
 solution:`<ul class="tight"><li>A: Unsinn – „zeitweise Steuerpflicht“ hat nichts mit dem TEV zu tun.</li><li>B falsch: Zinsen fallen nie unter das TEV (keine Vorbelastung mit KSt), nur Beteiligungserträge.</li><li>C richtig (§ 3 Nr. 40 EStG).</li><li>D richtig: Die Bank prüft nicht, ob die Aktien im Betriebsvermögen liegen – KapESt wird immer einbehalten (§ 43 Abs. 4 EStG) und später angerechnet.</li><li>E falsch: keine Abgeltungswirkung im Betriebsvermögen (§ 43 Abs. 5 S. 2 EStG) → Veranlagung.</li></ul>`,
 laws:['§ 3 Nr. 40 EStG','§ 3c Abs. 2 EStG','§ 20 Abs. 8 EStG','§ 32d Abs. 1, 2 Nr. 3, 6 EStG','§ 43 Abs. 4, 5 EStG','§ 17 EStG – Veräußerung von Anteilen ≥ 1 % im Privatvermögen = gewerbliche Einkünfte mit TEV','§ 8b KStG – Pendant für Kapitalgesellschaften als Anteilseigner'],
 example:`<p>Siehe Entscheidungsschema in den Unterlagen („Abgeltungsteuer oder Teileinkünfteverfahren?“): Privatvermögen → 25 % Flatrate; Betriebsvermögen → 60 % zum Tarif. Die Break-even-Rechnung: 25 % ÷ 60 % = 41,67 %. Liegt dein Grenzsteuersatz darunter, ist das TEV günstiger (sofern wählbar).</p>`,
 traps:['TEV nur für Beteiligungserträge (Dividenden, Veräußerungsgewinne) – nie für Zinsen.','Die Bank behält IMMER KapESt ein; die Frage ist nur, ob sie abgilt (privat) oder angerechnet wird (betrieblich).']
},
{
 id:'est-18', topic:'est', title:'Zinsen richtig zuordnen: betrieblich, Vermietung, privat', diff:2, points:4, exam:true,
 source:'Klausur 2013, Aufgabe 5, aktualisiert (Sparer-Pauschbetrag 1.000 €)',
 text:`<p>Ein lediger, konfessionsloser Bankkunde bekommt jeweils 10.810 € Zinsen (a) auf einem betrieblichen Konto seines Einzelunternehmens, (b) auf einem Miet-Sonderkonto für sein vermietetes Mehrfamilienhaus und (c) auf dem privaten Girokonto gutgeschrieben. Es liegt kein Freistellungsauftrag vor.</p>`,
 parts:[
  {type:'num', q:'Einkünfte aus Gewerbebetrieb aus (a) (€)', answer:10810, tol:1},
  {type:'num', q:'Einkünfte aus Vermietung und Verpachtung aus (b) (€)', answer:10810, tol:1},
  {type:'num', q:'Einkünfte aus Kapitalvermögen aus (c) (€)', answer:9810, tol:1},
  {type:'num', q:'Für welchen Gesamtbetrag muss die Bank Kapitalertragsteuer einbehalten (€ Bemessungsgrundlage)?', answer:32430, tol:1}
 ],
 solution:`<table class="calc">
 <tr><td>(a) Betriebliches Konto: Subsidiarität → Einkünfte aus Gewerbebetrieb, kein Sparer-Pauschbetrag</td><td class="n">10.810</td><td class="ref">§ 20 Abs. 8, § 15 EStG</td></tr>
 <tr><td>(b) Miet-Sonderkonto: Zinsen gehören zu V+V (Nebeneinnahme der Vermietung), kein Sparer-Pauschbetrag</td><td class="n">10.810</td><td class="ref">§ 20 Abs. 8, § 21 EStG</td></tr>
 <tr><td>(c) Privat: 10.810 − Sparer-Pauschbetrag 1.000</td><td class="n">9.810</td><td class="ref">§ 20 Abs. 1 Nr. 7, Abs. 9 EStG</td></tr>
 <tr class="sum"><td>KapESt-Einbehalt durch die Bank: alle drei Konten, 25 % auf 3 × 10.810 = 32.430 (= 8.107,50 € KapESt)</td><td class="n">32.430</td><td class="ref">§ 43 Abs. 1 Nr. 7, Abs. 4 EStG</td></tr></table>
 <p>Die Bank muss die Kapitalertragsteuer auch auf betriebliche Konten einbehalten (§ 43 Abs. 4 EStG) – ohne Freistellungsauftrag auch auf das Privatkonto in voller Höhe. In der Veranlagung wird die KapESt bei (a) und (b) angerechnet (keine Abgeltung, § 43 Abs. 5 S. 2); bei (c) ist sie abgegolten, der nicht genutzte Pauschbetrag kann über die Erklärung geholt werden (§ 32d Abs. 4 EStG).</p>`,
 laws:['§ 20 Abs. 8 EStG – Subsidiaritätsprinzip: Kapitalerträge gehören vorrangig zu §§ 13, 15, 18, 21','§ 20 Abs. 9 EStG – Sparer-Pauschbetrag 1.000 € (nur bei § 20)','§ 43 Abs. 4 EStG – KapESt-Abzug auch bei betrieblichen Konten','§ 43 Abs. 5 S. 2 EStG – keine Abgeltung außerhalb § 20','§ 44a EStG – Freistellungsauftrag / NV-Bescheinigung','§ 32d Abs. 4 EStG – Veranlagungswahlrecht'],
 example:`<p>Die Zinsen sind dreimal identisch, landen aber in drei verschiedenen Schubladen – je nachdem, wem das Konto „dient“. Das Finanzamt fragt: Wo kommt das Geld her? Aus dem Betrieb → Betrieb. Aus den Mieten → Vermietung. Aus deinem Privatleben → Kapitalvermögen. Nur die private Schublade hat den 1.000-€-Bonus. Die Bank interessiert das alles nicht: Sie zieht überall 25 % ab und du holst dir den Rest beim Finanzamt.</p>`,
 traps:['Sparer-Pauschbetrag nur bei echten § 20-Einkünften – nicht im Betriebs- oder Vermietungsbereich.','Die Bank behält KapESt immer ein, auch bei betrieblichen Konten.']
},
{
 id:'est-19', topic:'est', title:'Kapitalertragsteuer mit Verlusttöpfen bei der Bank', diff:3, points:4, exam:true,
 source:'Klausur 2023, Aufgabe 7',
 text:`<p>Der mit seiner Ehefrau (ohne Einkommen) zusammenveranlagte Bankkunde hat folgende Kapitalerträge bzw. Aufwendungen bei seiner Bank: Zinserträge 5.000 € (nach Abzug des Sparer-Pauschbetrags), negative Stückzinsen 5.000 €, Verluste aus dem Verkauf von Aktien 6.000 €, Dividenden 2.000 €, Depotgebühren 100 €.</p>`,
 parts:[
  {type:'num', q:'Welche Kapitalertragsteuer führt die Bank ab (€, ohne Soli)?', answer:500, tol:1},
  {type:'single', q:'Was passiert mit dem Aktienverlust von 6.000 €?', options:['Er wird mit den Zinsen und Dividenden verrechnet.','Er wird in den Aktien-Verlusttopf eingestellt und mit künftigen Aktiengewinnen bei dieser Bank verrechnet (oder per Verlustbescheinigung ins Finanzamt mitgenommen).','Er mindert den Gesamtbetrag der Einkünfte des Ehepaars.'], correct:[1]}
 ],
 solution:`<table class="calc">
 <tr><td>Zinsen (nach Pauschbetrag 2.000 € für Ehegatten)</td><td class="n">5.000</td><td class="ref">§ 20 Abs. 1 Nr. 7, Abs. 9 EStG</td></tr>
 <tr><td>+ Dividenden</td><td class="n">2.000</td><td class="ref">§ 20 Abs. 1 Nr. 1 EStG</td></tr>
 <tr><td>./. negative Stückzinsen (allgemeiner Verlusttopf)</td><td class="n">− 5.000</td><td class="ref">§ 20 Abs. 1 Nr. 7, § 43a Abs. 3 S. 2 EStG</td></tr>
 <tr><td>Depotgebühren: Werbungskosten, nicht abziehbar</td><td class="n">0</td><td class="ref">§ 20 Abs. 9 S. 1 Hs. 2 EStG</td></tr>
 <tr><td>Aktienverluste 6.000: eigener Topf, keine Aktiengewinne vorhanden</td><td class="n">0</td><td class="ref">§ 20 Abs. 6 S. 4, § 43a Abs. 3 EStG</td></tr>
 <tr class="sub"><td>Bemessungsgrundlage</td><td class="n">2.000</td><td class="ref"></td></tr>
 <tr class="sum"><td>Kapitalertragsteuer 25 %</td><td class="n">500 €</td><td class="ref">§ 43a Abs. 1 Nr. 1 EStG</td></tr></table>
 <p>Der Aktienverlust von 6.000 € bleibt im Aktien-Verlusttopf und wird ins Folgejahr übertragen oder auf Antrag (bis 15.12.) bescheinigt, um ihn mit Aktiengewinnen bei anderen Banken zu verrechnen.</p>`,
 laws:['§ 43a Abs. 3 EStG – Verlustverrechnung durch die Bank (zwei Töpfe), Übertrag ins Folgejahr, Verlustbescheinigung','§ 20 Abs. 6 S. 4 EStG – Aktienverluste nur mit Aktiengewinnen','§ 20 Abs. 9 EStG – Sparer-Pauschbetrag 1.000 € / 2.000 €, Werbungskostenabzugsverbot','§ 44a Abs. 2 EStG – gemeinsamer Freistellungsauftrag bei Ehegatten'],
 example:`<p>Die Bank ist wie ein Kassierer mit zwei Gläsern: In Glas 1 („allgemein“) kommen Zinsen und Dividenden rein, gezahlte Stückzinsen gehen raus. In Glas 2 („Aktien“) liegen nur Aktienverluste – daraus darf nur ein Aktiengewinn „trinken“. Am Ende ist Glas 1 bei 2.000 € → 25 % = 500 €. Glas 2 bleibt mit −6.000 € stehen und wartet auf bessere Börsenzeiten.</p>`,
 traps:['Negative Stückzinsen gehören in den ALLGEMEINEN Topf und mindern sofort die KapESt.','Depotgebühren, Beratungskosten usw. sind bei der Abgeltungsteuer nie abziehbar.','Aktienverluste niemals mit Dividenden oder Zinsen verrechnen.']
},
{
 id:'est-20', topic:'est', title:'Steuerermäßigung für gewerbliche Einkünfte (§ 35 EStG)', diff:2, points:5, exam:true,
 source:'Klausuren 2017 (Aufg. 7), 2019 (Aufg. 6), 2021 (Aufg. 7)',
 text:`<p>§ 35 EStG gewährt eine Steuerermäßigung, wenn Einkünfte der Gewerbesteuer unterlegen haben.</p>
 <p>Rechenbeispiel: Einzelunternehmer E hat einen Gewerbesteuermessbetrag von 10.000 €, der Hebesatz seiner Gemeinde beträgt 450 %. Seine tarifliche ESt beträgt 60.000 € und entfällt vollständig auf die gewerblichen Einkünfte.</p>`,
 parts:[
  {type:'multi', q:'Die Ermäßigung bekommen:', options:['natürliche Personen (Einzelunternehmer)','Gesellschafter von Personengesellschaften (Mitunternehmer)','Personengesellschaften selbst','Kapitalgesellschaften'], correct:[0,1]},
  {type:'single', q:'Bei welchem Hebesatz tritt eine vollständige Entlastung von der Gewerbesteuer ein?', options:['400 %','380 %','300 %'], correct:[0]},
  {type:'num', q:'Gezahlte Gewerbesteuer des E (€)', answer:45000, tol:1},
  {type:'num', q:'Steuerermäßigung nach § 35 EStG (€)', answer:40000, tol:1},
  {type:'num', q:'Verbleibende Gesamtbelastung (ESt nach Ermäßigung + GewSt) (€)', answer:65000, tol:1}
 ],
 solution:`<table class="calc">
 <tr><td>Gewerbesteuer: Messbetrag 10.000 × 450 %</td><td class="n">45.000</td><td class="ref">§ 16 GewStG</td></tr>
 <tr><td>Ermäßigung: 4,0 × Messbetrag = 40.000, begrenzt auf die tatsächlich gezahlte GewSt (45.000) und auf die anteilige tarifliche ESt (60.000)</td><td class="n">40.000</td><td class="ref">§ 35 Abs. 1 S. 1 Nr. 1, S. 5 EStG</td></tr>
 <tr><td>ESt nach Ermäßigung: 60.000 − 40.000</td><td class="n">20.000</td><td class="ref"></td></tr>
 <tr class="sum"><td>Gesamtbelastung: 20.000 ESt + 45.000 GewSt</td><td class="n">65.000</td><td class="ref"></td></tr></table>
 <p>Bei Hebesatz 400 % wäre die GewSt 40.000 = Ermäßigung → vollständige Entlastung. Bei 450 % bleiben 5.000 € GewSt „hängen“ (Anrechnungsüberhang). Bei Hebesätzen unter 400 % ist die Ermäßigung auf die tatsächliche GewSt begrenzt. Kapitalgesellschaften bekommen nichts – bei ihnen ist die GewSt Definitivbelastung; die Personengesellschaft selbst zahlt keine ESt, daher Ermäßigung beim Gesellschafter nach seinem Gewinnanteil (§ 35 Abs. 2 EStG).</p>`,
 laws:['§ 35 Abs. 1 S. 1 EStG – Ermäßigung der tariflichen ESt um das 4,0-fache des GewSt-Messbetrags (seit 2020; vorher 3,8)','§ 35 Abs. 1 S. 5 EStG – Begrenzung auf die tatsächlich zu zahlende Gewerbesteuer','§ 35 Abs. 2 EStG – anteilige Zurechnung bei Mitunternehmern nach Gewinnverteilungsschlüssel','§ 4 Abs. 5b EStG – GewSt nicht als Betriebsausgabe abziehbar (deshalb Kompensation über § 35)','§ 16 Abs. 4 GewStG – Mindesthebesatz 200 %'],
 example:`<p>Die Gewerbesteuer ist für Einzelunternehmer eigentlich eine „Doppelbestrafung“: Sie zahlen GewSt an die Gemeinde UND ESt auf denselben Gewinn. § 35 ist der Ausgleich: Der Staat erstattet über die ESt grob das, was die Gemeinde kassiert hat – bis zu einem Hebesatz von 400 % vollständig. Wohnst du in einer teuren Gemeinde (450 %), zahlst du den Aufschlag selbst. Für GmbHs gibt es das nicht, dafür ist ihr KSt-Satz mit 15 % niedrig.</p>`,
 traps:['Faktor 4,0 (seit 2020) – alte Klausuren rechnen mit 3,8 (→ 380 %).','Personengesellschaft als solche bekommt keine Ermäßigung (sie zahlt keine ESt) – ihre Gesellschafter schon.','Ermäßigung ist doppelt gedeckelt: tatsächliche GewSt und anteilige ESt.']
},
{
 id:'est-21', topic:'est', title:'Einkunftsarten zuordnen – Freiberufler oder Gewerbe?', diff:2, points:3, exam:true,
 source:'Klausur 2010, Aufgabe 5; Skript § 15/§ 18',
 text:`<p>Welche der folgenden Personen erzielen Einkünfte aus <b>freiberuflicher</b> Tätigkeit (§ 18 Abs. 1 Nr. 1 EStG)?</p>`,
 parts:[
  {type:'multi', q:'Freiberuflich sind:', options:['Apotheker mit eigener Apotheke','Immobilienmakler','Steuerberater-GmbH','Deutsche Bundeskanzlerin','Versicherungsvertreter (selbstständig)','Rechtsanwalt in eigener Kanzlei','Zahnärztin mit Praxis','Selbstständiger Übersetzer'], correct:[5,6,7]},
  {type:'multi', q:'Welche Aussagen zu Freiberuflern sind richtig?', options:['Sie zahlen keine Gewerbesteuer.','Sie sind nicht buchführungspflichtig und dürfen die EÜR anwenden.','Eine Sozietät aus Ärzten, die zusätzlich Nahrungsergänzungsmittel verkauft, erzielt insgesamt gewerbliche Einkünfte (Abfärbetheorie).','Eine GmbH kann freiberufliche Einkünfte erzielen, wenn alle Gesellschafter Steuerberater sind.'], correct:[0,1,2]}
 ],
 solution:`<ul class="tight">
 <li><b>Apotheker:</b> Gewerbe – Warenverkauf steht im Vordergrund, kein Katalogberuf (anders als Arzt).</li>
 <li><b>Immobilienmakler, Versicherungsvertreter:</b> Gewerbe (Vermittlungstätigkeit).</li>
 <li><b>Steuerberater-GmbH:</b> Kapitalgesellschaft → kraft Rechtsform Gewerbebetrieb (§ 8 Abs. 2 KStG, § 2 Abs. 2 GewStG). Freiberuflichkeit setzt eine natürliche Person voraus.</li>
 <li><b>Bundeskanzlerin:</b> Einkünfte aus nichtselbständiger Arbeit (§ 19 EStG) – Amtsbezüge.</li>
 <li><b>Rechtsanwalt, Zahnärztin, Übersetzer:</b> Katalogberufe des § 18 Abs. 1 Nr. 1 S. 2 EStG → freiberuflich.</li></ul>
 <p>Freiberufler: keine GewSt (§ 2 Abs. 1 GewStG i.V.m. § 15 Abs. 2 EStG), keine originäre Buchführungspflicht (§ 141 AO nennt nur Gewerbetreibende und Land-/Forstwirte). Abfärbetheorie § 15 Abs. 3 Nr. 1 EStG: gewerbliche Nebentätigkeit einer Personengesellschaft „infiziert“ alle Einkünfte (Bagatellgrenze 3 % / 24.500 € laut BFH).</p>`,
 laws:['§ 18 Abs. 1 Nr. 1 EStG – Katalogberufe: Ärzte, Zahnärzte, Rechtsanwälte, Notare, Ingenieure, Architekten, Steuerberater, Journalisten, Dolmetscher/Übersetzer u. a. sowie ähnliche Berufe','§ 15 Abs. 2 EStG – Gewerbebetrieb: selbstständig, nachhaltig, Gewinnerzielungsabsicht, Marktteilnahme, keine LuF, keine selbstständige Arbeit','§ 15 Abs. 3 Nr. 1 EStG – Abfärbe-/Infektionstheorie','§ 8 Abs. 2 KStG, § 2 Abs. 2 GewStG – Kapitalgesellschaften: stets Gewerbebetrieb','§ 141 AO – Buchführungspflicht nur für Gewerbetreibende/Land- und Forstwirte'],
 example:`<p>Faustfrage: „Verkauft die Person vor allem ihr <b>Wissen/Können</b> (Arzt, Anwalt, Architekt) oder <b>Waren/Vermittlung</b> (Apotheker, Makler, Händler)?“ Wissen → § 18, Waren → § 15. Und sobald eine GmbH dazwischen ist, ist es immer Gewerbe, egal was sie tut.</p>`,
 traps:['Apotheker ≠ Arzt: Apotheker sind Gewerbetreibende.','Jede Kapitalgesellschaft ist Gewerbebetrieb kraft Rechtsform – auch die Steuerberater-GmbH.','Abfärbetheorie: Eine kleine gewerbliche Nebentätigkeit kann eine Freiberufler-GbR komplett gewerbesteuerpflichtig machen.']
},

 parts:[

 laws:['§ 9 Abs. 1 S. 1 EStG – Werbungskosten: Aufwendungen zur Erwerbung, Sicherung und Erhaltung der Einnahmen','§ 9 Abs. 1 S. 3 Nr. 4 EStG – Entfernungspauschale 0,38 €/km (ab 2026 ab dem ersten km), Höchstbetrag 4.500 € außer bei eigenem Pkw','§ 9 Abs. 1 S. 3 Nr. 6 EStG – Arbeitsmittel','§ 4 Abs. 5 S. 1 Nr. 6b, 6c EStG – Arbeitszimmer / Homeoffice-Pauschale 6 €/Tag, max. 1.260 €','§ 9a S. 1 Nr. 1a EStG – Arbeitnehmer-Pauschbetrag 1.230 €','§ 12 Nr. 1 EStG – gemischte/private Aufwendungen (Kleidung)'],
 example:`<p>Werbungskosten sind alles, was du ausgeben musst, um deinen Lohn zu verdienen – der Weg zur Arbeit, die Fachbücher, der Gewerkschaftsbeitrag. Nicht dazu gehört, was du auch ohne Job hättest (Anzug: den trägst du auch auf der Hochzeit deines Cousins). Der Staat gibt jedem automatisch 1.230 €; lohnen tut sich das Sammeln von Belegen erst darüber – mit 30 km Arbeitsweg bist du schon weit darüber.</p>`,

{
 id:'est-23', topic:'est', title:'Steuerfreie Einnahmen und Progressionsvorbehalt (§ 3, § 32b EStG)', diff:2, points:3, exam:false,
 source:'Skript 2.1 Steuerfreiheit',
 text:`<p>Ordne zu: Welche steuerfreien Einnahmen unterliegen dem Progressionsvorbehalt?</p>`,
 parts:[
  {type:'multi', q:'Steuerfrei MIT Progressionsvorbehalt:', options:['Arbeitslosengeld I','Krankengeld der gesetzlichen Krankenkasse','Elterngeld','Trinkgelder eines Kellners','Übungsleiterpauschale bis 3.300 €','Zuschläge für Sonntags-, Feiertags- und Nachtarbeit (§ 3b EStG)','Kurzarbeitergeld','Arbeitgeberanteil zur Sozialversicherung'], correct:[0,1,2,6]},
  {type:'single', q:'Ein Übungsleiter im Sportverein erhält 4.000 € im Jahr. Steuerpflichtig sind:', options:['0 €','700 €','4.000 €'], correct:[1]}
 ],
 solution:`<p><b>Mit Progressionsvorbehalt (§ 32b Abs. 1 Nr. 1 EStG)</b> sind die <i>Lohnersatzleistungen</i>: Arbeitslosengeld, Kurzarbeitergeld, Krankengeld, Elterngeld, Mutterschaftsgeld, Insolvenzgeld. Sie ersetzen Lohn, der steuerpflichtig gewesen wäre.</p>
 <p><b>Echte Steuerfreiheit ohne Vorbehalt:</b> Trinkgelder (§ 3 Nr. 51), Übungsleiterfreibetrag 3.300 € (§ 3 Nr. 26) und Ehrenamtspauschale 840 € (§ 3 Nr. 26a), SFN-Zuschläge (§ 3b), AG-Anteil SV (§ 3 Nr. 62), Gesundheitsförderung bis 600 € (§ 3 Nr. 34), Mitarbeiterbeteiligung bis 2.000 € (§ 3 Nr. 39), Sachprämien bis 1.080 € (§ 3 Nr. 38), Reisekostenerstattung (§ 3 Nr. 16), PV-Anlagen (§ 3 Nr. 72).</p>
 <p><b>Übungsleiter:</b> 3.300 € sind ein <b>Freibetrag</b> → nur 4.000 − 3.300 = <b>700 €</b> steuerpflichtig (im Gegensatz zur Freigrenze bei Geschenken).</p>`,
 laws:['§ 3 Nr. 1a, 1d, 2 EStG – Kranken-, Mutterschafts-, Arbeitslosengeld steuerfrei','§ 32b Abs. 1 S. 1 Nr. 1 EStG – Progressionsvorbehalt für Lohnersatzleistungen','§ 3 Nr. 26 EStG – Übungsleiterfreibetrag 3.300 €','§ 3 Nr. 26a EStG – Ehrenamtspauschale 840 €','§ 3 Nr. 51 EStG – Trinkgelder','§ 3 Nr. 62 EStG – Arbeitgeberanteil Sozialversicherung','§ 3b EStG – Zuschläge für SFN-Arbeit (Grundlohn max. 50 €/Std.)','§ 3 Nr. 40 EStG – Teileinkünfteverfahren'],
 example:`<p>Faustregel: Alles, was den <b>Lohn ersetzt</b>, weil du gerade nicht arbeiten kannst (arbeitslos, krank, Elternzeit, Kurzarbeit), ist steuerfrei, aber zählt für den Steuersatz. Alles, was ein echter <b>Bonus</b> ist (Trinkgeld, Nachtzuschlag, Ehrenamt), ist komplett frei. Und: § 3 Nr. 26 ist ein Freibetrag (nur der Überschuss zählt), die 50 € bei Geschenken eine Freigrenze (alles oder nichts).</p>`,
 traps:['Lohnersatzleistungen über 410 € im Jahr lösen eine Pflichtveranlagung aus (§ 46 Abs. 2 Nr. 1 EStG).','Freibetrag (Übungsleiter 3.300 €) ≠ Freigrenze (Geschenke 50 €).']
},
{
 id:'est-24', topic:'est', title:'Sonderausgaben und außergewöhnliche Belastungen', diff:2, points:4, exam:false,
 source:'Skript 2.2.2, Beispiel zumutbare Belastung',
 text:`<p>Gesamtbetrag der Einkünfte 50.000 €, alleinstehend, ohne Kinder. Krankheitskosten (Krankenhaus, Chefarzt) 6.000 €, davon zahlt die Krankenversicherung 3.000 €. Zumutbare Belastung nach § 33 Abs. 3 EStG: 5 % bis 15.340 € GdE, 6 % für den Teil von 15.340 bis 51.130 €.</p>`,
 parts:[
  {type:'num', q:'Zumutbare Belastung (€, auf volle Euro gerundet)', answer:2846.6, tol:1},
  {type:'num', q:'Abziehbare außergewöhnliche Belastung (€)', answer:153.4, tol:1},
  {type:'multi', q:'Welche Posten sind Sonderausgaben (§ 10, 10a, 10b EStG)?', options:['Gezahlte Kirchensteuer','Spende an eine gemeinnützige Organisation','Beiträge zur Basis-Kranken- und Pflegeversicherung','Einkommensteuer-Nachzahlung','Geldstrafe','Haushaltsgeld für die Familie','Unterhaltsleistungen an den geschiedenen Ehegatten (Realsplitting, mit Zustimmung)'], correct:[0,1,2,6]}
 ],
 solution:`<table class="calc">
 <tr><td>5 % × 15.340</td><td class="n">767,00</td><td class="ref">§ 33 Abs. 3 EStG (Stufe 1)</td></tr>
 <tr><td>6 % × (50.000 − 15.340) = 6 % × 34.660</td><td class="n">2.079,60</td><td class="ref">§ 33 Abs. 3 EStG (Stufe 2, Stufentarif laut BFH)</td></tr>
 <tr class="sub"><td>Zumutbare Belastung</td><td class="n">2.846,60</td><td class="ref"></td></tr>
 <tr><td>Eigener Aufwand: 6.000 − 3.000 Erstattung</td><td class="n">3.000,00</td><td class="ref">§ 33 Abs. 1 EStG</td></tr>
 <tr class="sum"><td>Abziehbar: 3.000 − 2.846,60</td><td class="n">153,40 ≈ 154 €</td><td class="ref">§ 33 EStG</td></tr></table>
 <p><b>Sonderausgaben:</b> private Ausgaben, die der Gesetzgeber ausnahmsweise zum Abzug zulässt – Vorsorgeaufwendungen (§ 10 Abs. 1 Nr. 2, 3, 3a), Kirchensteuer (Nr. 4), Kinderbetreuung (Nr. 5), Ausbildungskosten (Nr. 7, max. 6.000 €), Unterhalt an Ex-Ehegatten (Nr. 1a, max. 13.805 €), Spenden (§ 10b, bis 20 % des GdE). <b>Nicht</b>: ESt (§ 12 Nr. 3), Geldstrafen (§ 12 Nr. 4), Lebensführung (§ 12 Nr. 1).</p>`,
 laws:['§ 10 Abs. 1 EStG – Sonderausgaben (Katalog)','§ 10b EStG – Spenden bis 20 % des GdE','§ 10c EStG – Sonderausgaben-Pauschbetrag 36 €','§ 33 Abs. 1 EStG – außergewöhnliche Belastungen (zwangsläufig, außergewöhnlich)','§ 33 Abs. 3 EStG – zumutbare Belastung 1–7 % des GdE nach Stufen','§ 33a EStG – Unterhalt, Ausbildungsfreibetrag','§ 33b EStG – Behinderten-Pauschbeträge','§ 12 EStG – nicht abzugsfähige private Ausgaben'],
 example:`<p>Die zumutbare Belastung ist ein „Selbstbehalt“ wie bei einer Versicherung: Der Staat hilft erst, wenn deine Krankheitskosten einen Teil deines Einkommens übersteigen, den du selbst tragen kannst. Je mehr du verdienst (und je weniger Kinder du hast), desto höher der Selbstbehalt – von 1 % bis 7 %.</p>`,
 traps:['Erstattungen (Krankenkasse) immer abziehen – nur der eigene Aufwand zählt.','Zumutbare Belastung stufenweise rechnen (BFH 2017), nicht den Prozentsatz der höchsten Stufe auf alles.','ESt und Soli sind KEINE Sonderausgaben (§ 12 Nr. 3), gezahlte Kirchensteuer dagegen schon.']
},
{
 id:'est-25', topic:'est', title:'Persönliche Steuerpflicht und Doppelbesteuerung', diff:1, points:3, exam:false,
 source:'Skript 2.1',
 text:`<p>Prüfe die Aussagen zur Steuerpflicht natürlicher Personen.</p>`,
 parts:[
  {type:'multi', q:'Richtig sind:', options:['Wer im Inland einen Wohnsitz oder gewöhnlichen Aufenthalt hat, ist unbeschränkt steuerpflichtig mit seinem Welteinkommen.','Wer weder Wohnsitz noch gewöhnlichen Aufenthalt im Inland hat, ist mit seinen inländischen Einkünften i.S.d. § 49 EStG beschränkt steuerpflichtig.','Ein DBA ist ein völkerrechtlicher Vertrag, der das Besteuerungsrecht zwischen Quellen- und Wohnsitzstaat aufteilt und dem nationalen Recht vorgeht (§ 2 AO).','Ohne DBA wird die ausländische Steuer nach § 34c EStG angerechnet oder abgezogen.','Bei Freistellung nach DBA bleiben die Einkünfte ohne jede Auswirkung auf die deutsche Steuer.','Ein Grenzgänger aus Frankreich, der in Mannheim arbeitet, ist in Deutschland unbeschränkt steuerpflichtig.'], correct:[0,1,2,3]}
 ],
 solution:`<p>E ist falsch: Freigestellte Einkünfte unterliegen dem Progressionsvorbehalt (§ 32b EStG). F ist falsch: Der Grenzgänger hat Wohnsitz in Frankreich → beschränkt steuerpflichtig (§ 1 Abs. 4 EStG); nach dem DBA Frankreich wird der Arbeitslohn von Grenzgängern sogar im Wohnsitzstaat besteuert. Auf Antrag kann er als unbeschränkt steuerpflichtig behandelt werden, wenn 90 % seiner Einkünfte der deutschen ESt unterliegen (§ 1 Abs. 3 EStG).</p>
 <p>Gewöhnlicher Aufenthalt: zusammenhängend mehr als 6 Monate (§ 9 AO). Wohnsitz: Wohnung innehaben unter Umständen, die auf Beibehalten schließen lassen (§ 8 AO).</p>`,
 laws:['§ 1 Abs. 1 EStG – unbeschränkte Steuerpflicht (Welteinkommen)','§ 1 Abs. 3 EStG – fiktive unbeschränkte Steuerpflicht auf Antrag (90 %-Grenze)','§ 1 Abs. 4, § 49 EStG – beschränkte Steuerpflicht mit inländischen Einkünften','§ 8, § 9 AO – Wohnsitz, gewöhnlicher Aufenthalt (> 6 Monate)','§ 2 AO – Vorrang von DBA','§ 34c EStG – Anrechnung/Abzug','§ 32b EStG – Progressionsvorbehalt'],
 example:`<p>Unbeschränkt = Deutschland will alles wissen, auch die Mieteinnahmen aus deiner Ferienwohnung in Spanien. Beschränkt = Deutschland interessiert sich nur für das, was hier entsteht (dein Lohn aus Mannheim, deine Miete aus Heidelberg). Das DBA ist der Friedensvertrag zwischen den beiden Finanzämtern: Wer darf was besteuern?</p>`,
 traps:['Welteinkommensprinzip bei unbeschränkter Steuerpflicht – auch ausländische Einkünfte müssen erklärt werden.','„Steuerfrei nach DBA“ heißt fast immer Progressionsvorbehalt.']
},
{
 id:'est-26', topic:'est', title:'Günstigerprüfung, Sparer-Pauschbetrag und Erklärungspflicht bei Kapitalerträgen', diff:2, points:3, exam:false,
 source:'Skript § 32d EStG',
 text:`<p>Rentnerin R (persönlicher Grenzsteuersatz ca. 15 %) hat 10.000 € Zinsen bei Bank A (KapESt 2.500 € einbehalten, kein Freistellungsauftrag), 2.000 € Zinsen aus einem privaten Darlehen an ihren Neffen (ohne Steuerabzug) und 500 € Depotgebühren.</p>`,
 parts:[
  {type:'multi', q:'Richtig sind:', options:['R muss die 2.000 € Darlehenszinsen in der Steuererklärung angeben (Erklärungspflicht § 32d Abs. 3 EStG), da keine KapESt einbehalten wurde.','R sollte die Günstigerprüfung (§ 32d Abs. 6 EStG) beantragen, weil ihr persönlicher Steuersatz unter 25 % liegt.','Die Depotgebühren kann sie als Werbungskosten abziehen.','Den nicht genutzten Sparer-Pauschbetrag von 1.000 € kann sie über die Steuererklärung nachholen (§ 32d Abs. 4 EStG).','Bei der Günstigerprüfung werden ALLE Kapitalerträge mit dem Tarif besteuert, nicht nur ein Teil.'], correct:[0,1,3,4]}
 ],
 solution:`<p>Nach der Günstigerprüfung werden 12.000 − 1.000 = 11.000 € mit ca. 15 % = 1.650 € besteuert statt 2.750 € (25 % auf 11.000) – die zu viel einbehaltene KapESt wird erstattet. Das Finanzamt prüft automatisch, ob der Antrag günstiger ist; wenn nicht, bleibt es bei 25 %. Werbungskosten (Depotgebühren) sind auch bei der Günstigerprüfung nicht abziehbar (§ 20 Abs. 9 EStG gilt weiter).</p>
 <table class="calc"><tr><th>Kapitalertrag</th><th>Erklärung?</th><th>Norm</th></tr>
 <tr><td>mit KapESt, Abgeltung (Bankzinsen, Dividenden)</td><td>Wahlrecht</td><td>§ 32d Abs. 4 EStG</td></tr>
 <tr><td>ohne KapESt (Privatdarlehen, Auslandskonto, Zinsen vom Finanzamt)</td><td>Pflicht</td><td>§ 32d Abs. 3 EStG</td></tr>
 <tr><td>Darlehen an nahestehende Person / Gesellschafterdarlehen ≥ 10 %</td><td>Tarif statt 25 %</td><td>§ 32d Abs. 2 Nr. 1 EStG</td></tr></table>`,
 laws:['§ 32d Abs. 3 EStG – Erklärungspflicht für Kapitalerträge ohne Steuerabzug','§ 32d Abs. 4 EStG – Erklärungswahlrecht (Pauschbetrag, Verluste, ausländische Steuer)','§ 32d Abs. 6 EStG – Günstigerprüfung (Antrag, alle Kapitalerträge)','§ 32d Abs. 2 EStG – Ausnahmen vom Abgeltungssatz (nahestehende Personen, Gesellschafterdarlehen)','§ 20 Abs. 9 EStG – Werbungskostenabzugsverbot','§ 44a EStG – Freistellungsauftrag bis 1.000 € / 2.000 €'],
 example:`<p>Die Abgeltungsteuer ist eine Flatrate. Wer wenig verdient, fährt mit dem normalen Tarif günstiger und kann „zurück zur Einzelabrechnung“ wechseln – das ist die Günstigerprüfung. Aber Achtung: Es gilt alles oder nichts, man kann nicht einzelne Erträge heraussuchen.</p>`,
 traps:['Zinsen aus Privatdarlehen (ohne Bank) MÜSSEN erklärt werden – häufig vergessen.','Darlehen an nahestehende Personen (z. B. Neffe, wenn Betriebsausgabe beim Schuldner): Tarifbesteuerung statt 25 % (§ 32d Abs. 2 Nr. 1a).']
}
);

 <tr><td>./. Dividenden steuerfrei 100.000, aber 5 % = 5.000 nicht abziehbare BA → netto</td><td class="n">− 95.000</td><td class="ref">§ 8b Abs. 1, Abs. 5 KStG</td></tr>
 <tr class="sum"><td>Zu versteuerndes Einkommen</td><td class="n">1.000.000 €</td><td class="ref">§ 7, § 8 KStG</td></tr>
 <tr><td>Körperschaftsteuer 15 %</td><td class="n">150.000 €</td><td class="ref">§ 23 Abs. 1 KStG</td></tr></table>
 <p><b>Jahresabschluss:</b> Gebucht sind nur 100.000 € (Vorauszahlungen). Die tatsächliche KSt beträgt 150.000 €. Da der Steuerbescheid noch nicht vorliegt, ist die Differenz als <b>Steuerrückstellung</b> (ungewisse Verbindlichkeit, § 249 Abs. 1 HGB) von 50.000 € zu passivieren: Steueraufwand 50.000 an Rückstellungen 50.000. Der Jahresüberschuss sinkt auf 600.000 €. Eine Verbindlichkeit wäre es erst, wenn der Bescheid vorliegt. (Hinzu kommt noch Soli 5,5 % der KSt.)</p>`,
 laws:['§ 7 Abs. 1, 2 KStG – Bemessungsgrundlage: zu versteuerndes Einkommen','§ 8 Abs. 1 KStG – Einkommensermittlung nach EStG + KStG','§ 8 Abs. 2 KStG – alle Einkünfte sind Einkünfte aus Gewerbebetrieb','§ 8b Abs. 1 KStG – Dividenden steuerfrei; Abs. 5: 5 % gelten als nicht abziehbare Betriebsausgaben','§ 8b Abs. 4 KStG – Ausnahme: Streubesitz unter 10 % → steuerpflichtig','§ 10 Nr. 2 KStG – KSt, Soli, USt auf Entnahmen nicht abziehbar','§ 10 Nr. 3 KStG – Geldstrafen','§ 10 Nr. 4 KStG – Hälfte der Aufsichtsratsvergütungen','§ 4 Abs. 5 S. 1 Nr. 2, Nr. 8, Abs. 5b EStG – Bewirtung 30 %, Geldbußen, GewSt','§ 23 Abs. 1 KStG – Steuersatz 15 %','§ 249 Abs. 1 HGB – Rückstellungen für ungewisse Verbindlichkeiten'],
 example:`<p><b>Die Logik:</b> Der Buchhalter hat alle Aufwendungen abgezogen, die betriebswirtschaftlich angefallen sind. Das Steuerrecht sagt aber: „Einige davon erkenne ich nicht an“ und rechnet sie außerhalb der Bilanz wieder hinzu: Strafen (Staat belohnt kein Fehlverhalten), eigene Steuern (eine Steuer kann sich nicht selbst mindern), 30 % der Bewirtung und 50 % des Aufsichtsrats (Pauschalkürzung). Umgekehrt zieht es Dividenden ab, weil die Tochter-AG den Gewinn schon versteuert hat – aber 5 % bleiben als fiktive Kosten hängen, deshalb „95 % steuerfrei“.</p>
 <p><b>Merkliste KSt-Schema:</b> JÜ → + Geldbuße → + 30 % Bewirtung → + 50 % Aufsichtsrat → + GewSt → + KSt (+ Soli) → + vGA → − 95 % Dividenden (§ 8b) → Einkommen × 15 %.</p>`,
 traps:['Aufsichtsratsvergütung: 50 % hinzurechnen (§ 10 Nr. 4 KStG) – bei KapG, nicht bei Personenunternehmen.','Dividenden: 95 % abziehen, nicht 100 % (§ 8b Abs. 5 KStG). Bei Streubesitz < 10 % gar nicht abziehen (§ 8b Abs. 4)!','KSt und GewSt sind beide nicht abziehbar – beide hinzurechnen.','Zinsen, Mieten, stiller Gesellschafter sind für die KSt voll abziehbar – NICHT hinzurechnen (das ist nur GewSt § 8 GewStG).','Rückstellung (Bescheid liegt noch nicht vor) vs. Verbindlichkeit (Bescheid liegt vor).']
},

 id:'kst-03', topic:'kst', title:'KSt-Einkommen mit verdeckter Gewinnausschüttung (Original 2017)', diff:2, points:5, exam:true,
 source:'Klausur 2017, Aufgabe 5/6; 2010, Aufgabe 12',
 text:`<p>Die Finanzbank AG hat einen Gewinn von 5.000.000 €. Dabei wurde abgezogen: Körperschaftsteuer 600.000 €, Gewerbesteuer 200.000 €, Aufsichtsratsvergütungen 194.000 €, angemessene Bewirtungsaufwendungen 10.000 €, Geldbuße 100.000 €. Es liegt eine verdeckte Gewinnausschüttung in Höhe von 95.000 € vor. In der GuV ist eine Dividende von 100.000 € enthalten.</p>`,
 parts:[

 <p><b>Verdeckte Gewinnausschüttung (vGA):</b> Vermögensminderung, die durch das Gesellschaftsverhältnis veranlasst ist (z. B. überhöhtes Gehalt an den Gesellschafter-Geschäftsführer, zinsloses Darlehen an den Aktionär). Sie darf das Einkommen nicht mindern (§ 8 Abs. 3 S. 2 KStG) und wird beim Empfänger als Kapitalertrag besteuert (§ 20 Abs. 1 Nr. 1 S. 2 EStG).</p>`,

 example:`<p>Eine vGA ist wie ein „getarntes Taschengeld“ der GmbH an ihren Chef-Eigentümer: Statt offiziell Dividende zu zahlen (die versteuert werden müsste), zahlt sie ihm ein übertrieben hohes Gehalt oder überlässt ihm den Firmenwagen umsonst. Das Finanzamt zieht die Tarnung ab: Die Firma darf das nicht als Kosten buchen, der Chef muss es wie eine Dividende versteuern.</p>`,
 traps:['vGA immer hinzurechnen (§ 8 Abs. 3 S. 2 KStG).','Die Dividende der Bank AG (Empfänger) ist etwas anderes als die vGA (die sie selbst gewährt) – beides tritt hier auf: +95.000 und −95.000 heben sich zufällig auf.']
},

 id:'kst-05', topic:'kst', title:'Verdeckte Gewinnausschüttung beim Gesellschafter-Geschäftsführer', diff:2, points:4, exam:false,
 source:'Skript 3.2 Beispiel vGA',
 text:`<p>A ist Alleingesellschafter und Geschäftsführer der A-GmbH. Laut Anstellungsvertrag erhält er 1.000.000 € Gehalt pro Jahr. Die Betriebsprüfung stellt fest, dass für diese Tätigkeit nur 300.000 € angemessen sind. Der Jahresüberschuss der GmbH beträgt 500.000 €.</p>`,

  {type:'num', q:'Korrigiertes Einkommen der GmbH (vor sonstigen Korrekturen) (€)', answer:1200000, tol:1},
  {type:'multi', q:'Bei A gilt:', options:['300.000 € sind Einkünfte aus nichtselbständiger Arbeit (§ 19 EStG).','700.000 € sind Einkünfte aus Kapitalvermögen (§ 20 Abs. 1 Nr. 1 S. 2 EStG), grundsätzlich Abgeltungsteuer 25 %.','1.000.000 € bleiben Arbeitslohn, nur die GmbH wird korrigiert.','Als Alleingesellschafter (≥ 25 %) kann A für die vGA das Teileinkünfteverfahren beantragen (§ 32d Abs. 2 Nr. 3 EStG).'], correct:[0,1,3]}
 ],
 solution:`<p>vGA = 1.000.000 − 300.000 = <b>700.000 €</b>. Einkommen der GmbH: 500.000 + 700.000 = <b>1.200.000 €</b> (§ 8 Abs. 3 S. 2 KStG). Darauf fallen zusätzlich ca. 15 % KSt + ca. 14 % GewSt ≈ 203.000 € an.</p>
 <p>Bei A: 300.000 € Arbeitslohn (§ 19), 700.000 € Kapitalertrag (§ 20 Abs. 1 Nr. 1 S. 2 EStG). Da die GmbH keine KapESt einbehalten hat, muss A die vGA erklären; Besteuerung mit 25 % oder auf Antrag TEV (60 % zum Tarif). Prüfmaßstab: Fremdvergleich – hätte ein ordentlicher und gewissenhafter Geschäftsleiter einem fremden Dritten dasselbe gezahlt?</p>`,

},

  {type:'multi', q:'Richtig sind:', options:['Die Teilwertabschreibung auf Y ist steuerlich nicht abziehbar (§ 8b Abs. 3 S. 3 KStG).','Die Refinanzierungszinsen sind voll abziehbar (keine Kürzung wie § 3c Abs. 2 EStG), § 8b Abs. 5 S. 2 KStG.','Dividenden aus Beteiligungen unter 10 % (Streubesitz) sind voll steuerpflichtig (§ 8b Abs. 4 KStG).','Veräußerungsgewinne sind auch bei Streubesitz zu 95 % steuerfrei.'], correct:[0,1,2,3]}

 <tr><td>Dividende Y (5 % Streubesitz): voll steuerpflichtig</td><td class="n">20.000 stpfl.</td><td class="ref">§ 8b Abs. 4 KStG (Grenze 10 % zu Jahresbeginn)</td></tr>
 <tr><td>Veräußerungsgewinn X: steuerfrei, 5 % fiktive BA</td><td class="n">10.000 stpfl.</td><td class="ref">§ 8b Abs. 2, Abs. 3 S. 1 KStG</td></tr>

 example:`<p>§ 8b ist der „Konzern-Durchlauferhitzer“: Gewinne sollen innerhalb einer Kette von Kapitalgesellschaften nur einmal besteuert werden. Deshalb sind Dividenden und Verkaufsgewinne zwischen Kapitalgesellschaften fast steuerfrei (95 %). Der Preis: Verluste aus solchen Beteiligungen darf man auch nicht absetzen. Und für Mini-Beteiligungen (unter 10 %, „Streubesitz“) gilt bei Dividenden die Freistellung nicht.</p>`,

  {type:'multi', q:'Unbeschränkt körperschaftsteuerpflichtig (Sitz oder Geschäftsleitung im Inland) sind:', options:['AG','GmbH','eingetragener Verein (e.V.)','OHG','Einzelunternehmen','eingetragene Genossenschaft','rechtsfähige Stiftung','KG, die nach § 1a KStG zur Körperschaftsbesteuerung optiert hat'], correct:[0,1,2,5,6,7]},
  {type:'single', q:'Der Körperschaftsteuersatz 2026 beträgt', options:['25 %','15 %','14 %','10 %'], correct:[1]},
  {type:'single', q:'Welche Gesamtbelastung trägt der Gewinn einer GmbH 2026 ungefähr (KSt + Soli + GewSt bei Hebesatz 400 %)?', options:['ca. 15 %','ca. 25 %','ca. 30 %','ca. 45 %'], correct:[2]}
 ],
 solution:`<p>§ 1 Abs. 1 KStG zählt die Körperschaften auf: Kapitalgesellschaften (AG, GmbH, KGaA, SE), Genossenschaften, Versicherungsvereine a. G., sonstige juristische Personen des privaten Rechts (e.V., Stiftung), nichtrechtsfähige Vereine/Stiftungen, Betriebe gewerblicher Art von juristischen Personen des öffentlichen Rechts. Personengesellschaften und Einzelunternehmen sind keine Steuersubjekte der KSt (Ausnahme: Option § 1a KStG seit 2022 für Personenhandelsgesellschaften).</p>
 <p><b>Steuersatz:</b> 15 % (§ 23 Abs. 1 KStG) + 5,5 % Soli = 15,825 %. Ab 2028 sinkt der Satz jährlich um 1 Prozentpunkt bis auf 10 % ab 2032 („Investitionsbooster“). Mit GewSt (3,5 % × 400 % = 14 %) ergibt sich 2026 eine Gesamtbelastung von ca. <b>29,8 %</b> auf Unternehmensebene; bei Ausschüttung kommen 25 % KapESt auf die Dividende hinzu (gesamt ca. 48 %).</p>`,
 laws:['§ 1 Abs. 1 KStG – unbeschränkte Steuerpflicht (Sitz § 11 AO oder Geschäftsleitung § 10 AO im Inland)','§ 1 Abs. 2 KStG – Welteinkommen','§ 1a KStG – Option für Personengesellschaften','§ 2 KStG – beschränkte Steuerpflicht','§ 5 KStG – Steuerbefreiungen (gemeinnützige Körperschaften, Bundesbank, Berufsverbände …)','§ 23 Abs. 1 KStG – 15 % (2028: 14 %, 2029: 13 %, 2030: 12 %, 2031: 11 %, ab 2032: 10 %)','§ 24, 25 KStG – Freibeträge 5.000 €/15.000 € nur für Vereine/Genossenschaften, nicht für Kapitalgesellschaften'],
 example:`<p>Die KSt ist die „Einkommensteuer für juristische Personen“. Jede Organisation, die rechtlich eigenständig ist (eine GmbH kann klagen, Verträge schließen, Eigentum haben), zahlt sie. Eine OHG ist zwar auch rechtsfähig, wird aber steuerlich „durchgeschaut“ – ihre Gesellschafter zahlen.</p>`,
 traps:['Der e.V. ist KSt-Subjekt (ggf. befreit nach § 5 Nr. 9 KStG bei Gemeinnützigkeit).','Freibeträge §§ 24, 25 KStG gelten NICHT für Kapitalgesellschaften.','Steuersatzsenkung erst ab 2028 – für Klausuraufgaben 2026 gilt 15 %.']
},

 id:'gew-01', topic:'gewst', title:'Gewerbesteuer der Bank AG – komplette Rechenkette (Original 2025)', diff:3, points:8, exam:true,
 source:'Klausur 2025, Aufgaben 7 und 8 (6 + 2 Punkte)',
 text:`<p>Der Vorstand der inländischen Bank AG teilt Ihnen für 2025 folgende (vorläufige) Besteuerungsmerkmale mit: Gewinn 500.000, Zinsen 300.000, Zahlung an stillen Gesellschafter 100.000, Mieten für Lagerplatz 200.000, Miete LKW 60.000, Gewinnanteil aus der Beteiligung der AG an der Immobilien-OHG 50.000, Einheitswert Betriebsgrundstück 100.000, Hebesatz 400 %.</p>`,
 parts:[
  {type:'num', q:'Die Hinzurechnungen betragen (€)', answer:78000, tol:1},
  {type:'num', q:'Die Kürzungen betragen (€)', answer:51680, tol:1},
  {type:'num', q:'Der gekürzte (abgerundete) Gewerbeertrag beträgt (€)', answer:526300, tol:1},
  {type:'num', q:'Der Gewerbesteuermessbetrag lautet (€, abgerundet)', answer:18420, tol:1},

 ],
 solution:`<p><b>Schritt 1 – Hinzurechnungen § 8 Nr. 1 GewStG:</b></p>
 <table class="calc">
 <tr><td>a) Entgelte für Schulden (Zinsen) 100 %</td><td class="n">300.000</td><td class="ref">§ 8 Nr. 1a GewStG</td></tr>
 <tr><td>c) Gewinnanteile stiller Gesellschafter 100 %</td><td class="n">100.000</td><td class="ref">§ 8 Nr. 1c GewStG</td></tr>
 <tr><td>d) Mieten bewegliche Wirtschaftsgüter (LKW) 20 % × 60.000</td><td class="n">12.000</td><td class="ref">§ 8 Nr. 1d GewStG</td></tr>
 <tr><td>e) Mieten unbewegliche Wirtschaftsgüter (Lagerplatz) 50 % × 200.000</td><td class="n">100.000</td><td class="ref">§ 8 Nr. 1e GewStG</td></tr>
 <tr class="sub"><td>Summe</td><td class="n">512.000</td><td class="ref"></td></tr>
 <tr><td>./. Freibetrag</td><td class="n">− 200.000</td><td class="ref">§ 8 Nr. 1 GewStG a.E.</td></tr>
 <tr><td>= 312.000, davon 1/4</td><td class="n">78.000</td><td class="ref">§ 8 Nr. 1 GewStG</td></tr></table>
 <p><b>Schritt 2 – Kürzungen § 9 GewStG:</b></p>
 <table class="calc">
 <tr><td>Nr. 1: 1,2 % des um 40 % erhöhten Einheitswerts: 100.000 × 140 % × 1,2 %</td><td class="n">1.680</td><td class="ref">§ 9 Nr. 1 S. 1 GewStG, § 121a BewG</td></tr>
 <tr><td>Nr. 2: Gewinnanteil aus Mitunternehmerschaft (OHG)</td><td class="n">50.000</td><td class="ref">§ 9 Nr. 2 GewStG</td></tr>
 <tr class="sub"><td>Summe Kürzungen</td><td class="n">51.680</td><td class="ref"></td></tr></table>
 <p><b>Schritt 3 – Gewerbeertrag und Steuer:</b></p>
 <table class="calc">
 <tr><td>Gewinn aus Gewerbebetrieb</td><td class="n">500.000</td><td class="ref">§ 7 GewStG</td></tr>
 <tr><td>+ Hinzurechnungen</td><td class="n">+ 78.000</td><td class="ref">§ 8</td></tr>
 <tr><td>./. Kürzungen</td><td class="n">− 51.680</td><td class="ref">§ 9</td></tr>
 <tr><td>= Gewerbeertrag 526.320 → abgerundet auf volle 100 €</td><td class="n">526.300</td><td class="ref">§ 11 Abs. 1 S. 3 GewStG</td></tr>
 <tr><td>./. Freibetrag 24.500 € – NICHT für Kapitalgesellschaften</td><td class="n">0</td><td class="ref">§ 11 Abs. 1 S. 3 Nr. 1 GewStG</td></tr>
 <tr><td>× Steuermesszahl 3,5 % = 18.420,50 → abgerundet</td><td class="n">18.420</td><td class="ref">§ 11 Abs. 2 GewStG</td></tr>
 <tr class="sum"><td>× Hebesatz 400 % = Gewerbesteuer</td><td class="n">73.680 €</td><td class="ref">§ 16 GewStG</td></tr></table>
 <p>Hinweis: Die Klausurlösung rundete den Messbetrag auf volle Euro ab (Antwort C 18.420); mit 18.420,50 ergäbe sich 73.682 €. Beide Werte werden hier akzeptiert. Hinweis zur Rechtslage: Für Erhebungszeiträume ab 2025 verweist § 9 Nr. 1 GewStG auf den neuen Grundsteuerwert (0,11 %) – die Klausur rechnet weiterhin mit dem Einheitswert (1,2 % × 140 %), wie im Skript.</p>`,
 laws:['§ 7 GewStG – Gewerbeertrag = Gewinn nach EStG/KStG','§ 8 Nr. 1 GewStG – Hinzurechnung von 25 % der Finanzierungsentgelte (Zinsen 100 %, stiller Gesellschafter 100 %, Renten 100 %, Mieten bewegl. 20 %, Mieten unbewegl. 50 %, Lizenzen 25 %) nach Freibetrag 200.000 €','§ 8 Nr. 5 GewStG – Streubesitzdividenden','§ 9 Nr. 1 GewStG – Kürzung Grundbesitz 1,2 % des (um 40 % erhöhten) Einheitswerts','§ 9 Nr. 2 GewStG – Gewinnanteile aus Mitunternehmerschaften','§ 9 Nr. 2a GewStG – Dividenden aus Beteiligungen ≥ 15 %','§ 11 Abs. 1 GewStG – Abrundung auf volle 100 €, Freibetrag 24.500 € nur für natürliche Personen und Personengesellschaften','§ 11 Abs. 2 GewStG – Steuermesszahl 3,5 %','§ 16 GewStG – Hebesatz (mind. 200 %)'],
 example:`<p><b>Warum Hinzurechnungen?</b> Die Gemeinde will den „objektiven Ertrag“ des Betriebs besteuern – egal ob er mit Eigen- oder Fremdkapital, mit gekauften oder gemieteten Maschinen arbeitet. Zinsen und Mieten enthalten eine „Finanzierungskomponente“, deshalb wird ein Teil wieder hinzugerechnet (bei Mieten für Immobilien 50 %, für LKW nur 20 %, weil in der Miete viel Abnutzung steckt). Von der Summe sind 200.000 € frei, vom Rest nimmt sie ein Viertel.</p>
 <p><b>Warum Kürzungen?</b> Das Grundstück zahlt schon Grundsteuer (Kürzung Nr. 1), der OHG-Gewinn wurde schon bei der OHG mit GewSt belastet (Nr. 2) – Doppelbesteuerung vermeiden.</p>
 <p><b>Rechenreihenfolge als Eselsbrücke:</b> Gewinn → + Hinzu → − Kürz → abrunden (100 €) → − 24.500 (nur Personen) → × 3,5 % → × Hebesatz.</p>`,
 traps:['Freibetrag 200.000 € bei den Hinzurechnungen (§ 8 Nr. 1) ≠ Freibetrag 24.500 € beim Gewerbeertrag (§ 11) – der zweite gilt NICHT für Kapitalgesellschaften!','LKW = beweglich → 20 %; Lagerplatz/Gebäude = unbeweglich → 50 %.','Gewinnanteil aus OHG-Beteiligung kürzen (§ 9 Nr. 2), weil er bereits bei der OHG der GewSt unterlag.','Abrundung auf volle 100 € BEVOR die Messzahl angewendet wird.','Die Gewerbesteuer selbst mindert den Gewinn nicht (§ 4 Abs. 5b EStG) – sie ist im „Gewinn 500.000“ bereits neutralisiert.']
},

 text:`<p>Prüfe dein Wissen über §§ 8 und 9 GewStG.</p>`,

  {type:'multi', q:'Welche Aussagen zu den Hinzurechnungen (§ 8 GewStG) sind richtig?', options:['Zinsen werden zu 100 % in die Summe der Finanzierungsentgelte einbezogen.','Mieten für bewegliche Wirtschaftsgüter gehen mit 20 % ein, für unbewegliche mit 50 %.','Lizenz- und Konzessionsgebühren gehen mit 25 % ein.','Gewinnanteile des typisch stillen Gesellschafters gehen zu 100 % ein.','Von der Summe wird ein Freibetrag von 200.000 € abgezogen; vom Rest wird ein Viertel hinzugerechnet.','Löhne und Gehälter werden zu 25 % hinzugerechnet.','Streubesitzdividenden (Beteiligung < 15 %), die nach § 8b KStG steuerfrei waren, werden hinzugerechnet (§ 8 Nr. 5).'], correct:[0,1,2,3,4,6]},
  {type:'multi', q:'Welche Kürzungen (§ 9 GewStG) gibt es?', options:['1,2 % des um 40 % erhöhten Einheitswerts des Betriebsgrundstücks (Nr. 1)','Gewinnanteile aus Beteiligungen an Personengesellschaften (Nr. 2)','Dividenden aus Beteiligungen an Kapitalgesellschaften ab 15 % (Schachtelprivileg, Nr. 2a)','Gewinne ausländischer Betriebsstätten (Nr. 3)','Spenden im Rahmen der Höchstbeträge (Nr. 5)','Die gezahlte Gewerbesteuer des Vorjahres'], correct:[0,1,2,3,4]}
 ],
 solution:`<p><b>§ 8 Nr. 1 GewStG – Finanzierungsentgelte:</b> a) Zinsen 100 %, b) Renten/dauernde Lasten 100 %, c) stille Gesellschafter 100 %, d) Mieten/Pachten/Leasing beweglich 20 % (E-Fahrzeuge/Fahrräder 10 %), e) Mieten unbeweglich 50 %, f) Lizenzen 25 %. Summe − 200.000 € Freibetrag, davon 25 %.</p>
 <p>Weitere Hinzurechnungen: Nr. 4 Gewinnanteile Komplementäre KGaA, Nr. 5 steuerfreie Streubesitzdividenden (< 15 %), Nr. 8 Verlustanteile aus Mitunternehmerschaften, Nr. 9 Spenden (werden erst hinzugerechnet und dann über § 9 Nr. 5 gekürzt).</p>
 <p><b>§ 9 GewStG – Kürzungen:</b> Nr. 1 Grundbesitz (1,2 % × 140 % EW; erweiterte Kürzung für reine Grundstücksunternehmen), Nr. 2 Mitunternehmeranteile, Nr. 2a Schachteldividenden ≥ 15 %, Nr. 3 ausländische Betriebsstätten, Nr. 5 Spenden, Nr. 7 ausländische Schachteldividenden. Die eigene GewSt wird nie gekürzt (sie ist schon nicht abziehbar).</p>`,
 laws:['§ 8 Nr. 1 Buchst. a–f GewStG','§ 8 Nr. 5 GewStG','§ 8 Nr. 8, 9 GewStG','§ 9 Nr. 1, 2, 2a, 3, 5, 7 GewStG','§ 10a GewStG – Gewerbeverlust (nur Vortrag, Mindestbesteuerung wie § 10d EStG)'],
 example:`<p>Merke die Prozentsätze als Treppe: <b>100 – 50 – 25 – 20</b>: Zinsen/Renten/stille Beteiligung 100 %, Immobilienmiete 50 %, Lizenzen 25 %, Maschinen-/Fahrzeugmiete 20 %. Und die Faustregel: Alles, was innerhalb des Konzerns oder bei anderen Gewerbebetrieben schon GewSt gezahlt hat, wird gekürzt (OHG-Anteil, Schachteldividende, Grundstück zahlt Grundsteuer).</p>`,

{
 id:'ust-01', topic:'ust', title:'Umsatzsteuer bei Banken (§ 4 Nr. 8 UStG) – Original 2025', diff:2, points:3, exam:true,
 source:'Klausur 2025, Aufgabe 10; 2010, Aufgabe 17',
 text:`<p>Die Finanzbank AG …</p>`,
 parts:[
  {type:'multi', q:'Zutreffend sind:', options:['erzielt grundsätzlich steuerfreie Umsätze','erhält grundsätzlich den Vorsteuerabzug','kann bei Leistungen an Unternehmer auf die Steuerfreiheit verzichten','kann stets auf die Steuerfreiheit verzichten','erhält den Vorsteuerabzug, soweit sie auf die Steuerfreiheit verzichtet hat'], correct:[0,2,4]}
 ],
 solution:`<ul class="tight">
 <li><b>A richtig:</b> Kredit-, Zahlungs-, Wertpapier- und Depotgeschäfte sind steuerfrei (§ 4 Nr. 8 Buchst. a–h UStG).</li>
 <li><b>B falsch:</b> Steuerfreie Umsätze nach § 4 Nr. 8 ff. schließen den Vorsteuerabzug aus (§ 15 Abs. 2 S. 1 Nr. 1 UStG). Die Bank bleibt auf der Vorsteuer sitzen – deshalb sind Banken „Endverbraucher“ ihrer Einkäufe.</li>
 <li><b>C richtig:</b> Option nach § 9 Abs. 1 UStG, wenn der Umsatz an einen anderen Unternehmer für dessen Unternehmen ausgeführt wird.</li>
 <li><b>D falsch:</b> Gegenüber Privatkunden ist keine Option möglich.</li>
 <li><b>E richtig:</b> Mit der Option wird der Umsatz steuerpflichtig → Vorsteuerabzug für die damit zusammenhängenden Eingangsleistungen (§ 15 Abs. 1 UStG); bei gemischter Nutzung anteilig (§ 15 Abs. 4 UStG).</li></ul>`,
 laws:['§ 4 Nr. 8 UStG – Steuerbefreiung für Finanzumsätze (Kredite, Zahlungsverkehr, Wertpapiere, Anteile)','§ 15 Abs. 2 S. 1 Nr. 1 UStG – Ausschluss des Vorsteuerabzugs bei steuerfreien Umsätzen','§ 15 Abs. 3 UStG – Ausnahme: Export (§ 4 Nr. 1–7) behält Vorsteuerabzug','§ 9 Abs. 1 UStG – Option zur Steuerpflicht bei Umsätzen an Unternehmer','§ 15 Abs. 4 UStG – Vorsteueraufteilung bei gemischter Verwendung','§ 4 Nr. 10 UStG – Versicherungsleistungen ebenfalls steuerfrei'],
 example:`<p>Eine Bank ist umsatzsteuerlich in einer ungewöhnlichen Lage: Sie berechnet ihren Kunden keine USt (gut für Privatkunden), darf aber auch die USt, die sie selbst zahlt (Software, Gebäude, Berater), nicht vom Finanzamt zurückholen. Für Firmenkunden kann sie freiwillig USt berechnen (Option) – der Firmenkunde holt sich die USt sowieso als Vorsteuer zurück, und die Bank gewinnt dafür den Vorsteuerabzug. Win-win, nur der Staat verliert.</p>`,
 traps:['„Steuerfrei“ heißt bei Banken: KEIN Vorsteuerabzug (§ 15 Abs. 2) – anders als bei Exporten (§ 15 Abs. 3).','Option nur gegenüber Unternehmern (§ 9 Abs. 1), nicht „stets“.']
},
{
 id:'ust-02', topic:'ust', title:'Bankgebäude für 100 Mio. € + 19 Mio. € USt – Gestaltungsberatung', diff:3, points:15, exam:true,
 source:'Klausur 2017, Aufgabe 10 (15 Punkte); 2022, Aufgabe 9 (10 Punkte)',
 text:`<p><b>Sachverhalt:</b> Die Deutsche Bank errichtet ein neues Betriebsgebäude für 100.000.000 € zuzüglich 19.000.000 € von den Bauleistern in Rechnung gestellte Umsatzsteuer. Das Gebäude dient den Bankleistungen.</p>
 <p><b>Aufgabe:</b> Nehmen Sie zur grundsätzlichen umsatzsteuerlichen Betrachtung Stellung.</p>
 <p><b>Ergänzung:</b> Die Deutsche Bank hat in ihrer Kundschaft 70 % Unternehmer, die steuerpflichtige Umsätze ausführen. Untersuchen Sie, inwieweit dies umsatzsteuerliche Auswirkung haben kann und geben Sie der Geschäftsleitung begründet einen Rat zur umsatzsteuerlich optimalen Gestaltung.</p>`,
 parts:[
  {type:'self', q:'Stellungnahme und Gestaltungsempfehlung (Musterlösung aufdecken)', model:`<p><b>1. Grundsätzliche Betrachtung</b></p>
 <ul class="tight"><li>Die Bauleistungen sind steuerbare und steuerpflichtige Leistungen der Bauunternehmer (§ 1 Abs. 1 Nr. 1, § 12 Abs. 1 UStG); die 19 Mio. € USt sind korrekt in Rechnung gestellt (§ 14 UStG).</li>
 <li>Die Bank ist Unternehmerin (§ 2 Abs. 1 UStG). Ihre Ausgangsumsätze (Kredite, Zahlungsverkehr, Depot) sind jedoch nach § 4 Nr. 8 UStG steuerfrei.</li>
 <li>Folge: Der Vorsteuerabzug ist ausgeschlossen (§ 15 Abs. 2 S. 1 Nr. 1 UStG), da die Eingangsleistung zur Ausführung steuerfreier Umsätze verwendet wird. Die 19 Mio. € sind für die Bank <b>Kosten</b> (Anschaffungskosten des Gebäudes, § 9b EStG) – Vorsteuer wird zum Kostenfaktor; die Bank wird wie ein Endverbraucher behandelt.</li></ul>
 <p><b>2. Auswirkung der 70 % Unternehmerkunden</b></p>
 <ul class="tight"><li>Gegenüber Unternehmern, die die Leistung für ihr Unternehmen beziehen, kann die Bank auf die Steuerbefreiung verzichten (<b>Option § 9 Abs. 1 UStG</b>). Die Finanzumsätze werden dann steuerpflichtig (19 %).</li>
 <li>Für die Unternehmerkunden ist das neutral: Sie ziehen die in Rechnung gestellte USt als Vorsteuer ab (§ 15 Abs. 1 UStG), sofern sie selbst steuerpflichtige Umsätze ausführen (bei Ärzten, Versicherungen, anderen Banken wäre die Option nachteilig, weil diese die Vorsteuer nicht abziehen können).</li>
 <li>Soweit die Bank optiert, erhält sie den <b>Vorsteuerabzug</b> aus dem Gebäude. Bei gemischter Verwendung ist die Vorsteuer aufzuteilen (§ 15 Abs. 4 UStG), i.d.R. nach dem Umsatzschlüssel oder (bei Gebäuden) nach Flächenschlüssel: hier bis zu <b>70 % × 19 Mio. € = 13,3 Mio. €</b> abziehbar; 5,7 Mio. € bleiben Kosten (Privatkundenanteil).</li>
 <li>Beachte § 15a UStG: Ändern sich die Verhältnisse innerhalb von 10 Jahren (Berichtigungszeitraum für Grundstücke), ist der Vorsteuerabzug zu berichtigen.</li></ul>
 <p><b>3. Empfehlung</b></p>
 <ul class="tight"><li>Für vorsteuerabzugsberechtigte Firmenkunden durchgängig optieren (§ 9 UStG) und die Entgelte mit USt ausweisen – das kostet die Kunden nichts und sichert der Bank ca. 13,3 Mio. € Vorsteuererstattung.</li>
 <li>Gegenüber Privatkunden und nicht vorsteuerabzugsberechtigten Unternehmern (Ärzte, Versicherungen) steuerfrei bleiben, da die Option dort zum Wettbewerbsnachteil führen würde.</li>
 <li>Organisatorisch: Firmenkundengeschäft räumlich/buchhalterisch trennen (Flächen- oder Umsatzschlüssel dokumentieren), Rechnungen mit USt-Ausweis (§ 14 Abs. 4 UStG), 10-Jahres-Überwachung nach § 15a UStG.</li>
 <li>Risiken: Fehler beim USt-Ausweis führen zu Steuerschuld nach § 14c UStG; Verwaltungsaufwand; Nachteil, wenn Kunden später nicht mehr vorsteuerabzugsberechtigt sind.</li></ul>`},
  {type:'num', q:'Wie viel Vorsteuer (€) kann die Bank maximal abziehen, wenn sie gegenüber allen Unternehmerkunden (70 %) optiert?', answer:13300000, tol:1},
  {type:'num', q:'Wie viel Vorsteuer (€) bleibt ohne jede Option abziehbar?', answer:0, tol:1}
 ],
 solution:`<p>Siehe Musterlösung. Kern: § 4 Nr. 8 → § 15 Abs. 2 Vorsteuerausschluss → § 9 Option gegenüber Unternehmern → § 15 Abs. 4 anteiliger Vorsteuerabzug (70 %) → § 15a Berichtigung über 10 Jahre.</p>`,
 laws:['§ 1 Abs. 1 Nr. 1 UStG – steuerbare Lieferungen/Leistungen','§ 2 Abs. 1 UStG – Unternehmer','§ 4 Nr. 8 UStG – Steuerbefreiung Finanzumsätze','§ 9 Abs. 1 UStG – Option bei Umsätzen an Unternehmer','§ 15 Abs. 1 UStG – Vorsteuerabzug','§ 15 Abs. 2 S. 1 Nr. 1 UStG – Ausschluss bei steuerfreien Umsätzen','§ 15 Abs. 4 UStG – Aufteilung bei gemischter Verwendung','§ 15a UStG – Vorsteuerberichtigung (Grundstücke 10 Jahre)','§ 14, § 14c UStG – Rechnung, unrichtiger Steuerausweis','§ 9b EStG – nicht abziehbare Vorsteuer gehört zu den Anschaffungskosten'],
 example:`<p>Stell dir vor, du kaufst ein Haus mit Werkstatt und Wohnung. Die USt auf den Werkstattteil holst du dir zurück (du machst dort steuerpflichtige Umsätze), die auf den Wohnteil nicht. Bei der Bank ist der „Werkstattteil“ das Firmenkundengeschäft, aber nur, wenn sie dort freiwillig USt berechnet (Option). Dann gibt es anteilig 70 % der Vorsteuer zurück – 13,3 Millionen Euro, das ist ein halbes Hochhaus.</p>`,
 traps:['Ohne Option: 0 € Vorsteuer. Die Option ist der Schlüssel.','Option bringt nur etwas bei Kunden, die selbst vorsteuerabzugsberechtigt sind.','§ 15a UStG: 10 Jahre Überwachung bei Grundstücken (5 Jahre bei beweglichen Wirtschaftsgütern).']
},
