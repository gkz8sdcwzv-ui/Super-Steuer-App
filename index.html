<style>

.grid.cols-3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}

.chip.t-ao{background:#ece9fb;color:#4a3aa7}.chip.t-est{background:#dcebfb;color:#1c5cab}.chip.t-kst{background:#fde4da;color:#a53d14}
.chip.t-gewst{background:#dcf3ea;color:#0f6e4c}.chip.t-ust{background:#fff1cf;color:#8a5a00}.chip.t-sonst{background:#fbe1ec;color:#9a3762}.chip.t-fall{background:#e3e3e3;color:#333}

.examq .qnum{font-weight:700;color:var(--primary-dark)}
.result-big{font-size:2.2rem;font-weight:800}
.schema{background:var(--surface-2);padding:12px 16px;border-radius:8px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.9rem;white-space:pre-wrap;line-height:1.55}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--text);color:#fff;padding:10px 18px;border-radius:999px;font-weight:600;opacity:0;transition:opacity .3s;pointer-events:none;z-index:50}

.histrow:last-child{border-bottom:none}

.heatline span.l1{background:#b7d3f6}.heatline span.l2{background:#6da7ec}.heatline span.l3{background:#2a78d6}.heatline span.l4{background:#184f95}

<script>
const TASKS = [];
// ===== Aufgaben: Verfahrensrecht (AO) =====
TASKS.push(
{
 id:'ao-01', topic:'ao', title:'Einspruchsfrist berechnen (Bekanntgabe am Wochenende)', diff:2, points:3, exam:true,
 source:'Klausurtyp 2015–2025 (jedes Jahr!), angepasst auf Rechtsstand 2026',
 text:`<p>Der Einkommensteuerbescheid 2025 der Bank-Mitarbeiterin M. trägt das Datum <b>22.09.2026</b> (Dienstag) und wurde an diesem Tag vom Finanzamt zur Post gegeben. Tatsächlich lag der Bescheid bereits am 24.09.2026 im Briefkasten. M. hält den Bescheid für fehlerhaft und will sich wehren.</p>`,
 parts:[
  {type:'single', q:'Die Einspruchsfrist endet mit Ablauf des', options:['22.10.2026','24.10.2026','26.10.2026','27.10.2026','28.10.2026','29.10.2026'], correct:[4]},
  {type:'multi', q:'Der Einspruch kann wirksam eingelegt werden …', options:['schriftlich (Brief)','elektronisch (z. B. ELSTER, E-Mail)','telefonisch','zur Niederschrift beim Finanzamt','spätestens 4 Wochen nach Bekanntgabe'], correct:[0,1,3]}
 ],
 solution:`<table class="calc">
 <tr><td>Datum des Bescheids / Aufgabe zur Post</td><td class="n">Di, 22.09.2026</td><td class="ref"></td></tr>
 <tr><td>+ 4 Tage Bekanntgabefiktion (seit 2025, vorher 3 Tage)</td><td class="n">Sa, 26.09.2026</td><td class="ref">§ 122 Abs. 2 Nr. 1 AO</td></tr>
 <tr><td>Fällt auf Samstag → nächster Werktag</td><td class="n">Mo, 28.09.2026</td><td class="ref">§ 108 Abs. 3 AO</td></tr>
 <tr><td>+ 1 Monat Einspruchsfrist</td><td class="n">Mi, 28.10.2026</td><td class="ref">§ 355 Abs. 1 AO</td></tr>
 <tr class="sum"><td>Fristende</td><td class="n">28.10.2026, 24:00 Uhr</td><td class="ref">§ 108 Abs. 1 AO i.V.m. § 188 Abs. 2 BGB</td></tr>
 </table>
 <p>Der <b>tatsächliche Zugang am 24.09.</b> ist unerheblich: Die Fiktion gilt auch, wenn der Brief früher ankommt. Nur ein <i>späterer</i> Zugang zählt (dann muss aber der Steuerpflichtige den späteren Zugang glaubhaft machen; das Finanzamt trägt die Beweislast für den Zugang überhaupt).</p>
 <p><b>Form:</b> Der Einspruch ist schriftlich oder elektronisch einzulegen oder zur Niederschrift zu erklären (§ 357 Abs. 1 AO). Telefonisch geht nicht. Die Frist beträgt <b>einen Monat</b>, nicht vier Wochen (ein Monat kann 28 bis 31 Tage haben).</p>`,
 laws:['§ 122 Abs. 2 Nr. 1 AO – Bekanntgabefiktion: 4 Tage nach Aufgabe zur Post','§ 108 Abs. 3 AO – Fristende an Sa/So/Feiertag → nächster Werktag (gilt auch für den Bekanntgabetag)','§ 355 Abs. 1 AO – Einspruchsfrist 1 Monat nach Bekanntgabe','§ 357 Abs. 1 AO – Form: schriftlich, elektronisch oder zur Niederschrift','§ 347 AO – Statthaftigkeit des Einspruchs'],
 example:`<p><b>So kannst du es dir merken:</b> Stell dir vor, das Finanzamt wirft den Brief am Dienstag in den Postkasten. Das Gesetz sagt: „Wir tun so, als ob er genau 4 Tage später ankommt“ – also Samstag. Aber am Samstag „arbeitet“ das Steuerrecht nicht, deshalb rutscht die Bekanntgabe auf Montag. Ab diesem Montag hat M. einen Monat Zeit – bis zum selben Kalendertag im nächsten Monat (28.10.). Wenn du also am 28.10. um 23:59 Uhr die E-Mail abschickst, bist du noch rechtzeitig.</p>
 <p><b>Schnellcheck für die Klausur:</b> Datum + 4 Tage → Wochenende? → Montag → gleicher Tag im Folgemonat → Wochenende/Feiertag? → nächster Werktag.</p>`,
 traps:['Seit 1.1.2025 gilt die 4-Tage-Fiktion (früher 3 Tage). Die Altklausuren rechnen noch mit 3 Tagen – nicht verwirren lassen!','Fällt der 4. Tag auf Samstag, Sonntag oder Feiertag, verschiebt sich die Bekanntgabe auf den nächsten Werktag (§ 108 Abs. 3 AO).','Fällt das Fristende auf ein Wochenende, verschiebt es sich ebenfalls auf den nächsten Werktag.','Früherer tatsächlicher Zugang verkürzt die Frist nicht.','„4 Wochen“ ist falsch – die Frist beträgt 1 Monat.']
},
{
 id:'ao-02', topic:'ao', title:'Einspruchsfrist – KSt-Bescheid der Bank AG', diff:2, points:3, exam:true,
 source:'Klausurtyp 2017, 2019, 2022, 2025',
 text:`<p>Die Bank AG erhält den Körperschaftsteuerbescheid 2025. Datum des Bescheids: <b>12.10.2026</b> (Montag), Zugang im Posteingang am 14.10.2026. Die Geschäftsleitung möchte wegen steuerlicher Differenzen Einspruch einlegen.</p>`,
 parts:[
  {type:'single', q:'Die Einspruchsfrist läuft bis zum Ablauf des', options:['12.11.2026','15.11.2026','16.11.2026','17.11.2026','19.11.2026','20.11.2026'], correct:[2]},
  {type:'multi', q:'Welche Aussagen zum wirksam eingelegten Einspruch sind richtig?', options:['Die Steuerzahlung wird automatisch aufgeschoben.','Die Steuerzahlung wird nicht aufgeschoben – die Steuer ist trotz Einspruch fällig.','Es kann ein Antrag auf Aussetzung der Vollziehung (AdV) gestellt werden.','Wird der Einspruch abgelehnt und die Steuer war ausgesetzt, fallen Aussetzungszinsen an.'], correct:[1,2,3]}
 ],
 solution:`<table class="calc">
 <tr><td>Datum des Bescheids</td><td class="n">Mo, 12.10.2026</td><td class="ref"></td></tr>
 <tr><td>+ 4 Tage</td><td class="n">Fr, 16.10.2026</td><td class="ref">§ 122 Abs. 2 Nr. 1 AO</td></tr>
 <tr><td>Werktag? Ja → Bekanntgabe</td><td class="n">16.10.2026</td><td class="ref"></td></tr>
 <tr><td>+ 1 Monat</td><td class="n">Mo, 16.11.2026</td><td class="ref">§ 355 Abs. 1 AO</td></tr>
 <tr class="sum"><td>Fristende</td><td class="n">16.11.2026 (Klausurtag!)</td><td class="ref">§ 108 AO</td></tr>
 </table>
 <p><b>Wirkung des Einspruchs:</b> Der Einspruch hat keine aufschiebende Wirkung (§ 361 Abs. 1 AO). Die Bank muss zahlen, kann aber die <b>Aussetzung der Vollziehung</b> beantragen (§ 361 Abs. 2 AO). Verliert sie später, muss sie Aussetzungszinsen von 0,5 % pro Monat zahlen (§ 237 i.V.m. § 238 Abs. 1 AO). Gewinnt sie, bekommt sie die gezahlte Steuer erstattet, Erstattungszinsen gibt es nach § 236 AO nur bei gerichtlichem Verfahren.</p>`,
 laws:['§ 122 Abs. 2 Nr. 1 AO – Bekanntgabe 4 Tage nach Aufgabe zur Post','§ 355 Abs. 1 AO – Einspruchsfrist 1 Monat','§ 361 Abs. 1 AO – Einspruch hemmt die Vollziehung nicht','§ 361 Abs. 2 AO – Aussetzung der Vollziehung auf Antrag bei ernstlichen Zweifeln','§ 237, § 238 Abs. 1 AO – Aussetzungszinsen 0,5 % pro Monat'],
 example:`<p>Denke an eine Strafzettel-Logik: Du bekommst einen Bußgeldbescheid, den du für falsch hältst. Du kannst Einspruch einlegen – aber das Geld musst du trotzdem erst einmal zahlen, es sei denn, du beantragst ausdrücklich, dass die Zahlung „ausgesetzt“ wird. Wenn du am Ende doch Unrecht hast, kostet dich das Warten Zinsen.</p>`,
 traps:['Einspruch ≠ Zahlungsaufschub. Ohne AdV-Antrag muss gezahlt werden (§ 361 Abs. 1 AO).','AdV ist ein eigener Antrag, der zusätzlich zum Einspruch gestellt werden muss.','Aussetzungszinsen 0,5 %/Monat (§ 238 Abs. 1 AO) – nicht mit den Nachzahlungszinsen von 0,15 %/Monat (§ 238 Abs. 1a AO) verwechseln.']
},
{
 id:'ao-03', topic:'ao', title:'Einspruchsfrist über den Jahreswechsel (Feiertag)', diff:3, points:3, exam:true,
 source:'Eigene Variante des Klausurtyps',
 text:`<p>Ein Gewerbesteuermessbescheid trägt das Datum <b>Freitag, 27.11.2026</b> und wird am selben Tag zur Post gegeben.</p>`,
 parts:[
  {type:'single', q:'Die Einspruchsfrist endet mit Ablauf des', options:['27.12.2026','31.12.2026','01.01.2027','02.01.2027','04.01.2027'], correct:[4]}
 ],
 solution:`<table class="calc">
 <tr><td>Datum / Aufgabe zur Post</td><td class="n">Fr, 27.11.2026</td><td class="ref"></td></tr>
 <tr><td>+ 4 Tage</td><td class="n">Di, 01.12.2026</td><td class="ref">§ 122 Abs. 2 Nr. 1 AO</td></tr>
 <tr><td>Werktag → Bekanntgabe</td><td class="n">01.12.2026</td><td class="ref"></td></tr>
 <tr><td>+ 1 Monat</td><td class="n">Fr, 01.01.2027 = Neujahr (Feiertag)</td><td class="ref">§ 355 Abs. 1 AO</td></tr>
 <tr><td>Sa 02.01. / So 03.01. → nächster Werktag</td><td class="n">Mo, 04.01.2027</td><td class="ref">§ 108 Abs. 3 AO</td></tr>
 <tr class="sum"><td>Fristende</td><td class="n">04.01.2027</td><td class="ref"></td></tr>
 </table>
 <p>Wichtig: Der Gewerbesteuer<b>mess</b>bescheid kommt vom Finanzamt und ist Grundlagenbescheid. Gegen ihn ist der Einspruch beim Finanzamt zu richten (§ 347 AO). Gegen den Gewerbesteuerbescheid der Gemeinde (Folgebescheid) wäre dagegen Widerspruch nach der VwGO einzulegen – Einwände gegen die Höhe des Messbetrags gehören aber nicht dorthin (§ 351 Abs. 2 AO).</p>`,
 laws:['§ 122 Abs. 2 Nr. 1 AO','§ 355 Abs. 1 AO','§ 108 Abs. 3 AO – Feiertag/Wochenende verschiebt das Fristende','§ 351 Abs. 2 AO – Grundlagenbescheid kann nur selbst angefochten werden'],
 example:`<p>Wie beim Silvester-Countdown: Die Frist würde eigentlich um Mitternacht am Neujahrstag enden. Aber der 1.1. ist Feiertag, der 2.1. Samstag, der 3.1. Sonntag. Also darf man bis Montag, 4.1., 24:00 Uhr, einlegen.</p>`,
 traps:['Feiertage verschieben das Fristende genauso wie Wochenenden.','Mehrere freie Tage hintereinander: immer bis zum NÄCHSTEN Werktag weiterzählen.','Fristende „+ 1 Monat“ heißt gleicher Kalendertag im Folgemonat – nicht „+ 30 Tage“.']
},
{
 id:'ao-04', topic:'ao', title:'Originalaufgabe Klausur 2025: Rechtsbehelf gegen KSt-Bescheid', diff:2, points:6, exam:true,
 source:'Klausur 11/2025, Aufgabe 12 (3 + 3 Punkte)',
 text:`<p>Der Bank AG ist der Körperschaftsteuerbescheid 2024 vom <b>22.09.2025</b> am 24.09.2025 zugegangen (Briefkasten). Nach Ansicht der Geschäftsleitung ist dieser Steuerbescheid fehlerhaft.</p>`,
 parts:[
  {type:'self', q:'a) Erläutern Sie, wie sich der Vertreter der AG gesichert dagegen wehren kann (Bezeichnung, Form und Frist).', model:`<ul class="tight"><li><b>Bezeichnung:</b> Einspruch (außergerichtlicher Rechtsbehelf, §§ 347 ff. AO).</li><li><b>Form:</b> schriftlich oder elektronisch beim Finanzamt, das den Bescheid erlassen hat; auch zur Niederschrift möglich (§ 357 Abs. 1 und 2 AO). Der Einspruch soll den angefochtenen Bescheid bezeichnen und begründet werden (§ 357 Abs. 3 AO).</li><li><b>Frist:</b> 1 Monat nach Bekanntgabe (§ 355 Abs. 1 AO). Bekanntgabe = Datum des Bescheids + 4 Tage (§ 122 Abs. 2 Nr. 1 AO), ggf. Verschiebung nach § 108 Abs. 3 AO.</li><li><b>Zusätzlich sinnvoll:</b> Antrag auf Aussetzung der Vollziehung (§ 361 Abs. 2 AO), da der Einspruch allein die Zahlungspflicht nicht aufschiebt.</li></ul>`},
  {type:'single', q:'b) Bis zu welchem Tag (in 2025) muss dies beim Finanzamt erfolgen?', options:['23.10.','24.10.','25.10.','26.10.','27.10.','28.10.'], correct:[4]}
 ],
 solution:`<table class="calc">
 <tr><td>Datum Bescheid</td><td class="n">Mo, 22.09.2025</td><td class="ref"></td></tr>
 <tr><td>+ 4 Tage</td><td class="n">Fr, 26.09.2025</td><td class="ref">§ 122 Abs. 2 Nr. 1 AO</td></tr>
 <tr><td>+ 1 Monat</td><td class="n">So, 26.10.2025</td><td class="ref">§ 355 Abs. 1 AO</td></tr>
 <tr><td>Sonntag → nächster Werktag</td><td class="n">Mo, 27.10.2025</td><td class="ref">§ 108 Abs. 3 AO</td></tr>
 <tr class="sum"><td>Fristende</td><td class="n">27.10.2025 (Antwort E)</td><td class="ref"></td></tr>
 </table>
 <p>Der Zugang am 24.09. ist wieder irrelevant, weil er vor dem fiktiven Bekanntgabetag liegt.</p>`,
 laws:['§ 347 AO – Einspruch statthaft gegen Verwaltungsakte in Abgabenangelegenheiten','§ 355 Abs. 1 AO – Frist 1 Monat','§ 357 AO – Form und Inhalt','§ 122 Abs. 2 Nr. 1 AO – Bekanntgabefiktion 4 Tage','§ 108 Abs. 3 AO – Fristende am Sonntag → Montag','§ 361 Abs. 2 AO – Aussetzung der Vollziehung'],
 example:`<p>Die Aufgabe 12 war 2025 die Standard-AO-Aufgabe mit 6 Punkten. Lerne die drei Stichworte wie einen Dreiklang: <b>Einspruch – schriftlich/elektronisch – 1 Monat ab Bekanntgabe (+4 Tage)</b>. Dann den Kalender im Kopf durchgehen. In der Klausur eine kleine Tabelle wie oben aufschreiben – das bringt auch bei kleinen Rechenfehlern Teilpunkte.</p>`,
 traps:['Immer die 4-Tage-Fiktion ab dem BESCHEIDDATUM rechnen, nicht ab dem Zugang.','Nicht „Widerspruch“ oder „Klage“ schreiben – der richtige Rechtsbehelf gegen Steuerbescheide ist der Einspruch; die Klage beim Finanzgericht kommt erst nach erfolglosem Einspruch (§ 44 FGO).']
},
{
 id:'ao-05', topic:'ao', title:'Fristversäumnis und Wiedereinsetzung (§ 110 AO)', diff:3, points:4, exam:false,
 source:'Skript, Aufgabe zum Rechtsbehelfsverfahren',
 text:`<p>ESt-Bescheid vom <b>03.08.2026</b> (Montag), festgesetzte ESt 5.000 €, bereits abgeführt 3.000 €, nicht anerkannte Werbungskosten 1.500 €.</p>
 <p>Variante a) Der Steuerpflichtige war vom 02.08. bis 10.09.2026 im Urlaub und findet den Bescheid erst bei der Rückkehr.<br>Variante b) Der Steuerpflichtige war vom 01.07. bis 10.09.2026 verreist.</p>`,
 parts:[
  {type:'single', q:'Die reguläre Einspruchsfrist endet mit Ablauf des', options:['03.09.2026','06.09.2026','07.09.2026','08.09.2026'], correct:[2]},
  {type:'multi', q:'Welche Aussagen sind richtig?', options:['In Variante a) kann Wiedereinsetzung in den vorigen Stand beantragt werden; der Einspruch muss innerhalb eines Monats nach Rückkehr nachgeholt werden (bis 10.10.2026).','In Variante b) ist die Fristversäumnis unverschuldet, weil der Urlaub länger war.','In Variante b) scheidet Wiedereinsetzung aus: Bei Abwesenheit von mehr als ca. 6 Wochen muss man für die Post Vorsorge treffen.','Die Nachzahlung von 2.000 € wird durch den Einspruch automatisch gestundet.'], correct:[0,2]}
 ],
 solution:`<table class="calc">
 <tr><td>Bescheid</td><td class="n">Mo, 03.08.2026</td><td class="ref"></td></tr>
 <tr><td>+ 4 Tage</td><td class="n">Fr, 07.08.2026</td><td class="ref">§ 122 Abs. 2 Nr. 1 AO</td></tr>
 <tr><td>+ 1 Monat</td><td class="n">Mo, 07.09.2026</td><td class="ref">§ 355 Abs. 1 AO</td></tr>
 </table>
 <p><b>Variante a):</b> Ein normaler Jahresurlaub von bis zu etwa 6 Wochen ist unverschuldet. Nach § 110 Abs. 1 und 2 AO ist Wiedereinsetzung zu gewähren; der Antrag ist innerhalb eines Monats nach Wegfall des Hindernisses (Rückkehr 10.09.) zu stellen und der Einspruch nachzuholen: bis <b>10.10.2026</b> (Samstag → 12.10.2026, § 108 Abs. 3 AO).</p>
 <p><b>Variante b):</b> Über 10 Wochen Abwesenheit – hier verlangt die Rechtsprechung, dass man einen Nachbarn, Freund oder Nachsendeauftrag organisiert. Die Versäumnis ist verschuldet, § 110 AO greift nicht. Der Bescheid wird bestandskräftig, die 2.000 € sind zu zahlen (§ 361 Abs. 1 AO).</p>`,
 laws:['§ 110 Abs. 1 AO – Wiedereinsetzung bei unverschuldeter Fristversäumnis','§ 110 Abs. 2 AO – Antrag innerhalb eines Monats nach Wegfall des Hindernisses, versäumte Handlung nachholen','§ 122 Abs. 2 Nr. 1 AO','§ 355 Abs. 1 AO','§ 361 Abs. 1 AO – keine aufschiebende Wirkung'],
 example:`<p>Eine Faustregel wie beim Briefkasten der Nachbarn: Zwei, drei Wochen Urlaub – niemand erwartet, dass du jemanden mit deiner Post beauftragst. Bist du aber den ganzen Sommer weg, musst du dich kümmern. Das Finanzamt sagt dann: „Selbst schuld.“</p>`,
 traps:['Wiedereinsetzung gibt keine „neue“ Monatsfrist ab dem Bescheid, sondern 1 Monat ab Wegfall des Hindernisses.','Grenze: ca. 6 Wochen Abwesenheit. Darüber hinaus gilt das Versäumnis als verschuldet.']
},
{
 id:'ao-06', topic:'ao', title:'Einteilung der Steuern', diff:1, points:3, exam:true,
 source:'Klausuren 2010, 2015, 2021, 2022, 2025 (Aufgabe 1 bzw. 11)',
 text:`<p>Steuern lassen sich nach verschiedenen Kriterien einteilen: nach dem Gegenstand (Besitz-/Verkehr-/Verbrauchsteuern), nach der Belastung (direkt/indirekt) und nach dem Steuergläubiger (Bund/Land/Gemeinde/Gemeinschaftsteuern).</p>`,
 parts:[
  {type:'multi', q:'Verkehrsteuern sind:', options:['Umsatzsteuer','Einkommensteuer','Grunderwerbsteuer','Mineralölsteuer (Energiesteuer)','Kapitalertragsteuer'], correct:[0,2]},
  {type:'multi', q:'Direkte Steuern sind:', options:['Umsatzsteuer','Lohnsteuer','Tabaksteuer','Kapitalertragsteuer','Körperschaftsteuer','Verbrauchsteuern'], correct:[1,3,4]},
  {type:'multi', q:'Gemeinschaftsteuern (Bund + Länder, Art. 106 Abs. 3 GG) sind:', options:['Einkommensteuer','Gewerbesteuer','Körperschaftsteuer','Grunderwerbsteuer','Umsatzsteuer','Tabaksteuer'], correct:[0,2,4]}
 ],
 solution:`<table class="calc">
 <tr><th>Kriterium</th><th>Gruppen</th><th>Beispiele</th></tr>
 <tr><td>Gegenstand</td><td>Besitz-/Personensteuern</td><td>ESt, KSt, GewSt, Grundsteuer, ErbSt</td></tr>
 <tr><td></td><td>Verkehrsteuern (Anknüpfung an Rechtsvorgang)</td><td>USt, Grunderwerbsteuer, Versicherungsteuer, Kfz-Steuer</td></tr>
 <tr><td></td><td>Verbrauchsteuern</td><td>Energie-/Mineralöl-, Tabak-, Bier-, Kaffee-, Stromsteuer</td></tr>
 <tr><td>Belastung</td><td>Direkt: Steuerschuldner = Steuerträger</td><td>ESt (inkl. LSt, KapESt als Erhebungsformen), KSt, GewSt, GrSt</td></tr>
 <tr><td></td><td>Indirekt: Steuer wird überwälzt</td><td>USt, Verbrauchsteuern</td></tr>
 <tr><td>Gläubiger</td><td>Gemeinschaftsteuern</td><td>ESt, KSt, USt</td></tr>
 <tr><td></td><td>Bundessteuern</td><td>Zölle, Verbrauchsteuern, Versicherungsteuer, Kfz-Steuer, Soli</td></tr>
 <tr><td></td><td>Landessteuern</td><td>ErbSt, Grunderwerbsteuer, Biersteuer</td></tr>
 <tr><td></td><td>Gemeindesteuern</td><td>GewSt, Grundsteuer, Hundesteuer</td></tr>
 </table>
 <p>Lohnsteuer und Kapitalertragsteuer sind <b>keine eigenen Steuerarten</b>, sondern Erhebungsformen der Einkommensteuer (Quellenabzug). Deshalb sind sie direkte Steuern und keine Verkehrsteuern.</p>`,
 laws:['§ 3 Abs. 1 AO – Steuerbegriff: Geldleistung ohne Gegenleistung, von öffentlich-rechtlichem Gemeinwesen auferlegt','Art. 105 GG – Gesetzgebungshoheit','Art. 106 GG – Ertragshoheit (Abs. 3: Gemeinschaftsteuern ESt, KSt, USt)','Art. 108 GG – Verwaltungshoheit','§ 38 EStG – Lohnsteuer als Erhebungsform der ESt','§ 43 EStG – Kapitalertragsteuer als Erhebungsform der ESt'],
 example:`<p><b>Direkt vs. indirekt – der Supermarkt-Test:</b> Wenn du eine Cola kaufst, zahlst du die Umsatzsteuer, aber der Supermarkt führt sie ab. Du bist Steuerträger, der Händler Steuerschuldner → indirekt. Bei deiner Lohnsteuer bist du beides: Du trägst sie und schuldest sie (der Arbeitgeber ist nur „Zahlstelle“) → direkt.</p><p><b>Verkehrsteuer:</b> Es wird ein „Vorgang“ besteuert – ein Kauf, eine Übertragung. Darum Umsatzsteuer und Grunderwerbsteuer. <b>Verbrauchsteuer:</b> Es wird der Konsum einer Ware besteuert – Tabak, Benzin, Bier.</p>`,
 traps:['Kapitalertragsteuer und Lohnsteuer sind Erhebungsformen der ESt → direkte Steuern, keine Verkehrsteuern.','Die Gewerbesteuer ist Gemeindesteuer, keine Gemeinschaftsteuer.','Grunderwerbsteuer = Verkehrsteuer (Vorgang), Grundsteuer = Besitzsteuer (Besitz).']
},
{
 id:'ao-07', topic:'ao', title:'Was regelt die Abgabenordnung?', diff:1, points:3, exam:true,
 source:'Klausuren 2015, 2017, 2021, 2023 (Aufgabe 1/2)',
 text:`<p>Die AO ist das „steuerliche Grundgesetz“ (Mantelgesetz). Sie regelt das Verfahren für alle Steuerarten, aber nicht die einzelnen Steuern selbst.</p>`,
 parts:[
  {type:'multi', q:'Welche der folgenden Themen werden in der Abgabenordnung geregelt?', options:['Steuertarife','Steuerliches Erhebungsverfahren','Steuerzinsen auf die Einkommensteuer','Säumniszuschläge','Strafverfahren wegen Hinterziehung von Lohnsteuer','Vorsteuerabzug','Steuerfreiheit von Dividenden bei Kapitalgesellschaften'], correct:[1,2,3,4]}
 ],
 solution:`<ul class="tight">
 <li><b>Steuertarife</b> → Einzelsteuergesetze (§ 32a EStG, § 23 KStG, § 12 UStG) ✗</li>
 <li><b>Erhebungsverfahren</b> → §§ 218 ff. AO ✓</li>
 <li><b>Zinsen</b> (auch auf ESt) → §§ 233–239 AO ✓</li>
 <li><b>Säumniszuschläge</b> → § 240 AO ✓ (steuerliche Nebenleistung § 3 Abs. 4 AO)</li>
 <li><b>Steuerstrafverfahren</b> (auch für Lohnsteuer) → §§ 369 ff. AO ✓</li>
 <li><b>Vorsteuerabzug</b> → § 15 UStG ✗</li>
 <li><b>§ 8b KStG</b> Dividendenfreistellung → KStG ✗</li></ul>`,
 laws:['§ 1 AO – Anwendungsbereich für alle Steuern','§ 3 Abs. 4 AO – steuerliche Nebenleistungen (Verspätungszuschlag, Zinsen, Säumniszuschlag, Zwangsgeld)','§§ 85, 88, 90 AO – Besteuerungsgrundsätze, Untersuchungsgrundsatz, Mitwirkungspflicht','§§ 155 ff. AO – Festsetzungsverfahren','§§ 218 ff. AO – Erhebungsverfahren','§§ 233–240 AO – Zinsen und Säumniszuschläge','§§ 347 ff. AO – Einspruchsverfahren','§§ 369 ff. AO – Steuerstraftaten und -ordnungswidrigkeiten'],
 example:`<p>Stell dir die AO als <b>Spielregeln</b> eines Brettspiels vor: Wer ist dran, wie lange darf ein Zug dauern, was passiert beim Schummeln. Die Einzelsteuergesetze (EStG, KStG, UStG …) sind dagegen die Spielfiguren – sie sagen, <i>was</i> und <i>wie viel</i> besteuert wird. Alles, was nach „Verfahren, Frist, Zinsen, Strafe“ klingt, ist AO. Alles, was nach „Steuersatz, Freibetrag, Abzug“ klingt, steht im jeweiligen Steuergesetz.</p>`,
 traps:['„Steuerzinsen auf die Einkommensteuer“ klingt nach EStG, steht aber in der AO (§ 233a).','„Strafverfahren wegen Lohnsteuerhinterziehung“ klingt nach EStG, ist aber AO (§ 370).']
},
{
 id:'ao-08', topic:'ao', title:'Entstehung der Steuer und Festsetzungsfrist', diff:2, points:4, exam:true,
 source:'Klausur 2013, Aufgabe 1; Skript Festsetzungsverfahren',
 text:`<p>Frau K. gibt ihre Einkommensteuererklärung 2025 im Mai 2026 ab. Sie fragt sich, wann die Steuer eigentlich „entstanden“ ist und wie lange das Finanzamt sie noch festsetzen oder ändern kann.</p>`,
 parts:[
  {type:'multi', q:'Steuern …', options:['entstehen grundsätzlich kraft Gesetz, sobald der Tatbestand verwirklicht ist','entstehen erst durch den Steuerbescheid','können vom Finanzamt stets festgesetzt werden','können nur innerhalb der Festsetzungsfrist festgesetzt werden'], correct:[0,3]},
  {type:'single', q:'Die reguläre Festsetzungsfrist für die ESt 2025 (Erklärung abgegeben Mai 2026) endet mit Ablauf des', options:['31.12.2029','31.12.2030','31.12.2031','31.12.2036'], correct:[1]}
 ],
 solution:`<p><b>Entstehung:</b> Die ESt entsteht mit Ablauf des Veranlagungszeitraums (§ 36 Abs. 1 EStG), also am 31.12.2025, 24:00 Uhr – kraft Gesetz (§ 38 AO). Der Bescheid stellt sie nur fest.</p>
 <table class="calc">
 <tr><td>Festsetzungsfrist ESt (keine Verbrauchsteuer)</td><td class="n">4 Jahre</td><td class="ref">§ 169 Abs. 2 S. 1 Nr. 2 AO</td></tr>
 <tr><td>Beginn: Ablauf des Kalenderjahres der Abgabe der Erklärung (Anlaufhemmung)</td><td class="n">31.12.2026</td><td class="ref">§ 170 Abs. 2 S. 1 Nr. 1 AO</td></tr>
 <tr class="sum"><td>Ende</td><td class="n">31.12.2030</td><td class="ref"></td></tr>
 </table>
 <p>Ohne Erklärungsabgabe begänne die Frist spätestens mit Ablauf des 3. Jahres nach Entstehung (31.12.2028 → Ende 31.12.2032). Bei leichtfertiger Steuerverkürzung 5 Jahre, bei Steuerhinterziehung 10 Jahre (§ 169 Abs. 2 S. 2 AO). Verbrauchsteuern: 1 Jahr.</p>`,
 laws:['§ 38 AO – Entstehung der Ansprüche aus dem Steuerschuldverhältnis kraft Gesetz','§ 36 Abs. 1 EStG – ESt entsteht mit Ablauf des Veranlagungszeitraums','§ 169 Abs. 2 AO – Festsetzungsfrist: 1 Jahr (Verbrauchsteuern), 4 Jahre (übrige), 5/10 Jahre bei Verkürzung/Hinterziehung','§ 170 Abs. 1, 2 AO – Fristbeginn, Anlaufhemmung bei Erklärungspflicht','§ 171 AO – Ablaufhemmung (z. B. Außenprüfung, Einspruch)','§ 155 AO – Steuerfestsetzung durch Steuerbescheid'],
 example:`<p>Wie beim Geburtstag: Du wirst nicht erst 21, wenn dir jemand gratuliert – du <i>bist</i> es automatisch am Stichtag. Genauso entsteht die Steuer automatisch am 31.12. Der Bescheid ist nur die „Gratulationskarte“ des Finanzamts. Und die Festsetzungsfrist ist das Haltbarkeitsdatum: Nach 4 Jahren (ab Ende des Abgabejahres) darf das Finanzamt nichts mehr ändern – außer du hast geschummelt (dann 10 Jahre).</p>`,
 traps:['Die Frist beginnt NICHT am Tag der Abgabe, sondern mit Ablauf des Kalenderjahres der Abgabe.','Die Festsetzungsfrist (§ 169 AO) ist etwas anderes als die Einspruchsfrist (§ 355 AO) und als die Zahlungsverjährung (§ 228 AO, 5 Jahre).']
},
{
 id:'ao-09', topic:'ao', title:'Steuerstraftaten, Ordnungswidrigkeiten und Selbstanzeige', diff:2, points:3, exam:true,
 source:'Klausur 2022, Aufgabe 3; Skript 1.4',
 text:`<p>Ein Bankkunde hat jahrelang Zinserträge aus einem Auslandsdepot nicht erklärt. Er überlegt nun eine Selbstanzeige.</p>`,
 parts:[
  {type:'multi', q:'Nach einer wirksamen Selbstanzeige wird der Steuerhinterzieher grundsätzlich befreit von', options:['der Strafe','der Steuerzahlung','der Zinszahlung (Hinterziehungszinsen)'], correct:[0]},
  {type:'multi', q:'Welche Zuordnungen sind richtig?', options:['Steuerhinterziehung (§ 370 AO) = Straftat, setzt Vorsatz voraus','Leichtfertige Steuerverkürzung (§ 378 AO) = Ordnungswidrigkeit (grobe Fahrlässigkeit), Bußgeld','Steuergefährdung (§ 379 AO), z. B. falsche Belege ausstellen = Ordnungswidrigkeit','Die Nichtabführung einbehaltener Lohnsteuer ist nie strafbar, weil der Arbeitnehmer Steuerschuldner ist'], correct:[0,1,2]}
 ],
 solution:`<p><b>Selbstanzeige (§ 371 AO):</b> Wer vollständig berichtigt, bevor die Tat entdeckt ist bzw. eine Prüfungsanordnung bekannt gegeben wurde, wird <b>nicht bestraft</b>. Voraussetzung ist aber, dass die hinterzogenen Steuern <b>und die Hinterziehungszinsen (§ 235 AO)</b> fristgerecht nachgezahlt werden (§ 371 Abs. 3 AO). Ab 25.000 € hinterzogener Steuer je Tat ist zusätzlich ein Zuschlag von 10–20 % zu zahlen (§ 398a AO, „Freikaufen“).</p>
 <p><b>Systematik:</b></p>
 <table class="calc"><tr><th>Norm</th><th>Was</th><th>Art</th><th>Folge</th></tr>
 <tr><td>§ 370 AO</td><td>Steuerhinterziehung (Vorsatz: Wissen und Wollen)</td><td>Straftat</td><td>Geld-/Freiheitsstrafe bis 5 Jahre, schwere Fälle bis 10</td></tr>
 <tr><td>§ 378 AO</td><td>leichtfertige Steuerverkürzung (grob fahrlässig)</td><td>OWi</td><td>Bußgeld bis 50.000 €</td></tr>
 <tr><td>§ 379 AO</td><td>Steuergefährdung (falsche Belege, Buchungen)</td><td>OWi</td><td>Bußgeld</td></tr>
 <tr><td>§ 380 AO</td><td>Gefährdung von Abzugsteuern (LSt, KapESt nicht abgeführt)</td><td>OWi</td><td>Bußgeld</td></tr></table>`,
 laws:['§ 369 AO – Steuerstraftaten','§ 370 AO – Steuerhinterziehung (Vorsatz)','§ 371 AO – Selbstanzeige: Straffreiheit, aber Nachzahlung + Zinsen (Abs. 3)','§ 398a AO – Zuschlag bei > 25.000 €','§ 235 AO – Hinterziehungszinsen 0,5 %/Monat','§ 377, 378, 379, 380 AO – Ordnungswidrigkeiten'],
 example:`<p>Die Selbstanzeige ist wie ein „Joker“ im Spiel: Du gibst zu, dass du geschummelt hast, bevor es jemand merkt. Dann bekommst du keine Strafe – aber den Einsatz (die Steuer) und die „Leihgebühr“ (Zinsen) musst du natürlich trotzdem zahlen. Der Staat verzichtet auf die Bestrafung, nicht auf sein Geld.</p>`,
 traps:['Selbstanzeige befreit nur von der STRAFE – Steuer und Zinsen bleiben.','Vorsatz ist Voraussetzung der Hinterziehung; das Finanzamt muss ihn nachweisen. Ohne Vorsatz allenfalls § 378 AO (Ordnungswidrigkeit).']
},
{
 id:'ao-10', topic:'ao', title:'Steuerliche Nebenleistungen: Zinsen und Säumniszuschlag berechnen', diff:2, points:4, exam:false,
 source:'Skript 1.2.1; typische Zusatzfrage',
 text:`<p>a) Die ESt 2024 eines Freiberuflers wird mit Bescheid vom 30.09.2026 festgesetzt. Es ergibt sich eine Nachzahlung von <b>10.000 €</b>.<br>
 b) Eine festgesetzte Steuer von 10.000 € ist am 15.10.2026 fällig. Der Steuerpflichtige überweist erst am 20.12.2026.</p>`,
 parts:[
  {type:'num', q:'a) Nachzahlungszinsen nach § 233a AO (in €)', answer:90, tol:0.5},
  {type:'num', q:'b) Säumniszuschlag nach § 240 AO (in €)', answer:300, tol:0.5}
 ],
 solution:`<p><b>a) Nachzahlungszinsen (Vollverzinsung § 233a AO):</b> Zinslauf beginnt 15 Monate nach Ablauf des Kalenderjahres der Steuerentstehung: Ende 2024 + 15 Monate = <b>01.04.2026</b>. Er endet mit Bekanntgabe des Bescheids (30.09.2026 → fiktiv 05.10.2026, Rundung auf volle Monate). Volle Monate April–September = <b>6 Monate</b>.<br>
 Zinssatz § 238 Abs. 1a AO: <b>0,15 % pro Monat</b> (1,8 % p.a.).<br>
 10.000 € × 0,15 % × 6 = <b>90 €</b>.</p>
 <p><b>b) Säumniszuschlag § 240 Abs. 1 AO:</b> 1 % des auf 50 € abgerundeten rückständigen Betrags für jeden <i>angefangenen</i> Monat der Säumnis. Fällig 15.10.; Schonfrist 3 Tage (§ 240 Abs. 3 AO) bei Überweisung ist hier weit überschritten.<br>
 Angefangene Monate: 16.10.–15.11. (1), 16.11.–15.12. (2), 16.12.–20.12. (3) = <b>3 Monate</b> → 10.000 × 1 % × 3 = <b>300 €</b>.</p>`,
 laws:['§ 3 Abs. 4 AO – Nebenleistungen: Verspätungszuschlag, Zinsen, Säumniszuschlag, Zwangsgeld','§ 233a AO – Vollverzinsung, Karenzzeit 15 Monate','§ 238 Abs. 1a AO – 0,15 %/Monat für § 233a-Zinsen (seit 2019)','§ 238 Abs. 1 AO – 0,5 %/Monat für Stundungs-, Hinterziehungs-, Aussetzungszinsen','§ 240 AO – Säumniszuschlag 1 % je angefangenen Monat, Schonfrist 3 Tage','§ 152 AO – Verspätungszuschlag (0,25 % der Steuer, mind. 25 €/Monat)'],
 example:`<p>Zinsen (§ 233a) sind der „Preis fürs Warten“ – egal, wer schuld ist, der Staat hatte das Geld erst später. Nach 15 Monaten Schonzeit tickt die Uhr mit 0,15 % im Monat. Der Säumniszuschlag ist dagegen eine „Mahngebühr“: Du hättest zahlen müssen, hast aber nicht – 1 % pro angefangenem Monat, das ist 12 % im Jahr, also viel teurer.</p>`,
 traps:['Zwei verschiedene Zinssätze: 0,15 %/Monat (§ 233a) und 0,5 %/Monat (Stundung, Aussetzung, Hinterziehung).','Säumniszuschlag: ANGEFANGENE Monate zählen – ein Tag zu spät kostet den vollen Monat.','Der Verspätungszuschlag (§ 152 AO) betrifft die zu späte ERKLÄRUNG, der Säumniszuschlag die zu späte ZAHLUNG.']
},
{
 id:'ao-11', topic:'ao', title:'Steuerhoheit nach dem Grundgesetz', diff:1, points:2, exam:false,
 source:'Skript 1.1',
 text:`<p>Wer darf Steuern erlassen, wem stehen sie zu und wer verwaltet sie?</p>`,
 parts:[
  {type:'multi', q:'Welche Aussagen sind richtig?', options:['Die Gesetzgebungshoheit ist in Art. 105 GG geregelt; Zölle sind ausschließliche Bundessache.','Die Ertragshoheit (wem steht die Steuer zu?) regelt Art. 106 GG.','Die Einkommensteuer wird von Bundesfinanzbehörden verwaltet.','Zölle und bundesgesetzliche Verbrauchsteuern werden von Bundesfinanzbehörden (Zoll) verwaltet, die übrigen Steuern von den Landesfinanzbehörden (Finanzämter), Art. 108 GG.','Die beiden „tragenden Säulen“ des Steuerrechts sind der Grundsatz der Gesetzmäßigkeit und der Gleichmäßigkeit der Besteuerung (§ 85 AO).'], correct:[0,1,3,4]}
 ],
 solution:`<ul class="tight"><li><b>Gesetzgebungshoheit Art. 105 GG:</b> ausschließlich Bund für Zölle/Finanzmonopole (Abs. 1); konkurrierend für übrige Steuern (Abs. 2); Länder für örtliche Verbrauch- und Aufwandsteuern (Abs. 2a) und den Grunderwerbsteuersatz.</li>
 <li><b>Ertragshoheit Art. 106 GG:</b> Gemeinschaftsteuern ESt/KSt/USt (Abs. 3), Bundessteuern (Abs. 1), Landessteuern (Abs. 2), Gemeindesteuern (Abs. 6: GewSt, GrSt).</li>
 <li><b>Verwaltungshoheit Art. 108 GG:</b> Zoll (Bund) für Zölle, Verbrauchsteuern, Kfz-Steuer; Finanzämter (Länder) für alles andere – auch für die „Bundes-“Anteile an ESt/KSt/USt.</li>
 <li><b>§ 85 AO:</b> Gesetzmäßigkeit und Gleichmäßigkeit.</li></ul>`,
 laws:['Art. 105 GG – Gesetzgebungshoheit','Art. 106 GG – Ertragshoheit','Art. 108 GG – Verwaltungshoheit','§ 85 AO – Besteuerungsgrundsätze','§ 88 AO – Untersuchungsgrundsatz','§ 90 AO – Mitwirkungspflicht'],
 example:`<p>Drei Fragen, drei Artikel: <b>105</b> = Wer macht das Gesetz? <b>106</b> = Wer bekommt das Geld? <b>108</b> = Wer kassiert es ein? Merke: 105 – 106 – 108, der 107 regelt den Finanzausgleich zwischen den Ländern.</p>`,
 traps:['Die ESt ist zwar Gemeinschaftsteuer (Bund bekommt 42,5 %), wird aber von den LANDESfinanzbehörden (Finanzämtern) verwaltet.']
},
{
 id:'ao-12', topic:'ao', title:'Pflicht zur Abgabe der Einkommensteuererklärung', diff:2, points:3, exam:true,
 source:'Klausuren 2010 (Aufg. 4), 2013 (Aufg. 2); Skript',
 text:`<p>Prüfe für den Veranlagungszeitraum 2026, wer eine Einkommensteuererklärung abgeben <b>muss</b>.</p>`,
 parts:[
  {type:'multi', q:'Zur Abgabe verpflichtet sind:', options:['Ein Arbeitnehmer (Steuerklasse I) mit ausschließlich Arbeitslohn von 45.000 €, ohne weitere Einkünfte.','Ein Arbeitnehmer mit Arbeitslohn und zusätzlichen Mieteinkünften von 2.000 €.','Verheiratete Arbeitnehmer mit Steuerklassenkombination III/V.','Ein Selbstständiger (ledig), dessen Gesamtbetrag der Einkünfte über dem Grundfreibetrag liegt.','Ein minderjähriges Kind mit Einkünften aus Gewerbebetrieb von 20.000 €.'], correct:[1,2,3,4]},
  {type:'single', q:'Bis wann muss die ESt-Erklärung 2026 regulär abgegeben werden (ohne Steuerberater)?', options:['31.05.2027','31.07.2027','31.12.2027','28.02.2028'], correct:[1]}
 ],
 solution:`<ul class="tight">
 <li>Arbeitnehmer mit nur Arbeitslohn (Klasse I): <b>keine Pflicht</b> – die Lohnsteuer hat Abgeltungscharakter. Freiwillige Antragsveranlagung (§ 46 Abs. 2 Nr. 8 EStG) bis zu 4 Jahre rückwirkend möglich (für 2026 bis 31.12.2030).</li>
 <li>Nebeneinkünfte ohne Lohnsteuerabzug > 410 € → Pflicht (§ 46 Abs. 2 Nr. 1 EStG).</li>
 <li>Ehegatten mit III/V → Pflicht (§ 46 Abs. 2 Nr. 3a EStG).</li>
 <li>Nicht-Arbeitnehmer mit GdE über dem Grundfreibetrag (2026: 12.348 €) → Pflicht (§ 56 S. 1 Nr. 2 EStDV).</li>
 <li>Minderjährige sind selbst steuerpflichtig (§ 1 EStG kennt keine Altersgrenze); die Eltern geben als gesetzliche Vertreter ab (§ 34 AO) → Pflicht.</li></ul>
 <p><b>Frist:</b> 7 Monate nach Ablauf des Kalenderjahres → 31.07.2027 (§ 149 Abs. 2 AO). Mit Steuerberater: Ende Februar des übernächsten Jahres, also 28.02.2028 (§ 149 Abs. 3 AO).</p>`,
 laws:['§ 25 Abs. 3 EStG – Erklärungspflicht','§ 46 Abs. 2 EStG – Veranlagung bei Arbeitnehmern (Nr. 1: Nebeneinkünfte > 410 €; Nr. 3a: Steuerklasse III/V; Nr. 8: Antrag)','§ 56 EStDV – Erklärungspflicht für Nicht-Arbeitnehmer über Grundfreibetrag','§ 149 Abs. 2 AO – Abgabefrist 7 Monate (31.07.)','§ 149 Abs. 3 AO – mit Steuerberater Ende Februar des übernächsten Jahres','§ 152 AO – Verspätungszuschlag'],
 example:`<p>Faustregel: Wer nur Lohn hat und dessen Lohnsteuer „passt“, muss nichts tun. Sobald das Finanzamt aber Grund zur Annahme hat, dass die Lohnsteuer zu niedrig war (III/V, Nebeneinkünfte, Freibetrag auf der Lohnsteuerkarte, Lohnersatzleistungen > 410 €), will es eine Erklärung. Für Selbstständige gilt: Über dem Grundfreibetrag immer.</p>`,
 traps:['410-€-Grenze ist eine Freigrenze: 411 € Nebeneinkünfte → Pflichtveranlagung.','Antragsveranlagung geht 4 Jahre rückwirkend (Festsetzungsfrist), nicht nur bis 31.07.','Die Steuerberaterfrist gilt nur, wenn ein Berater beauftragt ist.']
},
{
 id:'ao-13', topic:'ao', title:'Steuersubjekt: Die OHG', diff:1, points:3, exam:true,
 source:'Klausuren 2020, 2022 (Aufgabe 3/6)',
 text:`<p>Eine Offene Handelsgesellschaft (OHG) betreibt einen Handel mit Baustoffen und besitzt ein Betriebsgrundstück.</p>`,
 parts:[
  {type:'multi', q:'Die OHG ist selbst Steuersubjekt (Steuerschuldner) bei der', options:['Körperschaftsteuer','Einkommensteuer','Gewerbesteuer','Umsatzsteuer','Grunderwerbsteuer'], correct:[2,3,4]}
 ],
 solution:`<p>Die OHG ist eine <b>Personengesellschaft</b>. Sie ist weder natürliche Person (ESt) noch juristische Person (KSt). Ihr Gewinn wird <b>einheitlich und gesondert festgestellt</b> (§§ 179, 180 AO) und den Gesellschaftern zugerechnet, die ihn als Einkünfte aus Gewerbebetrieb versteuern (§ 15 Abs. 1 S. 1 Nr. 2 EStG, „Transparenzprinzip“).</p>
 <p>Dagegen ist sie <b>selbst Steuerschuldner</b> bei der Gewerbesteuer (§ 5 Abs. 1 S. 3 GewStG), bei der Umsatzsteuer (Unternehmer § 2 UStG) und bei der Grunderwerbsteuer (§ 13 GrEStG, sie kann Grundstücke erwerben).</p>
 <p>Ausnahme seit 2022: Option zur Körperschaftsbesteuerung nach § 1a KStG.</p>`,
 laws:['§ 15 Abs. 1 S. 1 Nr. 2 EStG – Mitunternehmer versteuern ihren Gewinnanteil','§ 1 KStG – nur Körperschaften sind KSt-Subjekte (§ 1a KStG: Option)','§ 5 Abs. 1 S. 3 GewStG – Personengesellschaft ist GewSt-Schuldner','§ 2 Abs. 1 UStG – Unternehmer kann jede Personenvereinigung sein','§ 13 GrEStG – Steuerschuldner der GrESt','§§ 179, 180 AO – gesonderte und einheitliche Feststellung'],
 example:`<p>Die OHG ist wie eine WG: Für die Miete (GewSt, USt, GrESt) haftet die WG als Ganzes. Aber die Einkommensteuer zahlt jeder Mitbewohner selbst auf seinen Anteil – die WG hat kein eigenes Einkommen im Sinne des EStG.</p>`,
 traps:['Nicht „ESt-pflichtig“ schreiben – Personengesellschaften sind steuerlich transparent.','Bei der GewSt ist sie dagegen eigenständig Steuerschuldner (und bekommt den Freibetrag 24.500 €).']
}
);

{
 id:'est-01', topic:'est', title:'Gesamtbetrag der Einkünfte „Peter Müller“ (Original 2025)', diff:2, points:6, exam:true,
 source:'Klausur 2025, Aufgabe 1 (6 Punkte) – Varianten in fast jeder Klausur seit 2015',
 text:`<p>Ermitteln Sie aus nachfolgenden Daten in Schritten das zu versteuernde Einkommen (in €) von Peter Müller:</p>
 <p>Negative Stückzinsen 1.000, Verlust aus Vermietung eines Zweifamilienhauses 50.000, Gewinn aus Gewerbebetrieb 100.000, Bruttolohn 81.230, Arbeitsmittel 300, Fahrtkosten hierzu 500, Einnahmen aus der Vermietung eines Einfamilienhauses 34.000, Abschreibung dieses Gebäudes 3.000 und damit zusammenhängende Finanzierungskosten 1.000 €, abzugsfähige Sonderausgaben 10.000.</p>`,
 parts:[

  {type:'num', q:'Das Einkommen beträgt (€)', answer:150000, tol:1}
 ],
 solution:`<table class="calc">
 <tr><td>Einkünfte aus Gewerbebetrieb</td><td class="n">100.000</td><td class="ref">§ 15 EStG</td></tr>
 <tr><td>Einkünfte aus nichtselbständiger Arbeit: 81.230 − Arbeitnehmer-Pauschbetrag 1.230 (tatsächliche WK 300 + 500 = 800 sind niedriger)</td><td class="n">80.000</td><td class="ref">§ 19, § 9a S. 1 Nr. 1a EStG</td></tr>
 <tr><td>Vermietung EFH: 34.000 − 3.000 AfA − 1.000 Zinsen</td><td class="n">30.000</td><td class="ref">§ 21, § 9 Abs. 1 EStG</td></tr>
 <tr><td>Vermietung ZFH</td><td class="n">− 50.000</td><td class="ref">§ 21 EStG</td></tr>
 <tr><td>→ Einkünfte aus V+V gesamt (horizontaler Verlustausgleich)</td><td class="n">− 20.000</td><td class="ref">§ 2 Abs. 3 EStG</td></tr>
 <tr><td>Negative Stückzinsen: Kapitalvermögen, Abgeltungsteuer – nicht im GdE, Verlustverrechnungstopf</td><td class="n">0</td><td class="ref">§ 20 Abs. 6, § 2 Abs. 5b EStG</td></tr>
 <tr class="sub"><td>Summe = Gesamtbetrag der Einkünfte</td><td class="n">160.000</td><td class="ref">§ 2 Abs. 3 EStG</td></tr>
 <tr><td>./. Sonderausgaben</td><td class="n">− 10.000</td><td class="ref">§ 10 EStG</td></tr>
 <tr class="sum"><td>Einkommen (= zu versteuerndes Einkommen, da keine Kinder)</td><td class="n">150.000</td><td class="ref">§ 2 Abs. 4, 5 EStG</td></tr>
 </table>`,
 laws:['§ 2 Abs. 1–5 EStG – die 7 Einkunftsarten und das Berechnungsschema','§ 2 Abs. 3 EStG – Summe der Einkünfte = Gesamtbetrag der Einkünfte (vertikaler Verlustausgleich)','§ 2 Abs. 5b EStG – Kapitalerträge nach § 32d bleiben außen vor','§ 9a S. 1 Nr. 1a EStG – Arbeitnehmer-Pauschbetrag 1.230 €','§ 20 Abs. 6 EStG – Verluste aus Kapitalvermögen nur mit Kapitalerträgen verrechenbar','§ 21 EStG – Vermietung und Verpachtung','§ 10 EStG – Sonderausgaben'],
 example:`<p><b>So sieht das Schema aus einem Guss aus:</b> Stell dir 7 Schubladen (Einkunftsarten) vor. In jede Schublade kommt nur, was dorthin gehört, und innerhalb der Schublade wird saldiert (EFH + 30.000 und ZFH − 50.000 → V+V-Schublade zeigt − 20.000). Dann werden die Schubladen addiert: 100.000 + 80.000 − 20.000 = 160.000. Die Kapitalvermögen-Schublade ist <i>verschlossen</i>: Sie wird mit 25 % pauschal abgerechnet und darf mit den anderen nicht gemischt werden. Erst wenn alle Schubladen addiert sind, dürfen die Sonderausgaben (private Abzüge wie Kirchensteuer, Versicherungen) abgezogen werden.</p>
 <p><b>Arbeitnehmer-Pauschbetrag:</b> Das Finanzamt schenkt jedem Arbeitnehmer 1.230 € Werbungskosten ohne Nachweis. Nur wer MEHR nachweist (hier nur 800 €), setzt die tatsächlichen Kosten an.</p>`,
 traps:['Negative Stückzinsen gehören zu § 20 → NICHT im Gesamtbetrag der Einkünfte abziehen (Klassiker: 159.000 wäre falsch).','Werbungskosten 800 € < Pauschbetrag 1.230 € → immer der höhere Betrag (Pauschbetrag) zählt.','Sonderausgaben erst NACH dem Gesamtbetrag der Einkünfte abziehen – sie mindern nicht die Einkünfte.','Verluste aus V+V dürfen mit Gewerbe und Lohn verrechnet werden (vertikal) – im Gegensatz zu Kapitalverlusten.']
},
{
 id:'est-02', topic:'est', title:'GdE „Peter Müller“ – Variante mit Dividende und Grunderwerbsteuer', diff:2, points:5, exam:true,
 source:'Klausuren 2020, 2021, 2022 (Aufgabe 4/5), angepasst',
 text:`<p>Ermitteln Sie den steuerlichen Gesamtbetrag der Einkünfte i.S.v. § 2 EStG für Peter Müller:</p>
 <p>Dividende netto 7.500 nach Abzug von Kapitalertragsteuer (Soli vernachlässigt), Verlust aus Vermietung eines Zweifamilienhauses 10.000, Gewinn aus Gewerbebetrieb 90.000, Bruttolohn 81.230, Fahrtkosten hierzu 500, Einnahmen aus der Vermietung eines Einfamilienhauses 44.000, Abschreibung dieses Gebäudes 3.000 und damit zusammenhängende Finanzierungskosten 1.000 €, beim Kauf des Einfamilienhauses gezahlte Grunderwerbsteuer 10.000 €, abzugsfähige Sonderausgaben 10.000.</p>`,
 parts:[

  {type:'num', q:'Das Einkommen beträgt (€)', answer:190000, tol:1},
  {type:'single', q:'Wie wird die Dividende steuerlich behandelt?', options:['Sie erhöht den Gesamtbetrag der Einkünfte um 10.000 € (brutto).','Sie erhöht den Gesamtbetrag der Einkünfte um 7.500 € (netto).','Sie ist mit dem Kapitalertragsteuerabzug von 25 % abgegolten und bleibt außerhalb des GdE (§ 32d, § 43 Abs. 5 EStG).','Sie ist zu 60 % steuerpflichtig (Teileinkünfteverfahren).'], correct:[2]}
 ],
 solution:`<table class="calc">
 <tr><td>Gewerbebetrieb</td><td class="n">90.000</td><td class="ref">§ 15 EStG</td></tr>
 <tr><td>Nichtselbständige Arbeit: 81.230 − 1.230 Pauschbetrag (tatsächlich nur 500)</td><td class="n">80.000</td><td class="ref">§ 19, § 9a EStG</td></tr>
 <tr><td>V+V EFH: 44.000 − 3.000 − 1.000 (Grunderwerbsteuer ist Anschaffungsnebenkosten → nur über AfA, nicht sofort)</td><td class="n">40.000</td><td class="ref">§ 21, § 9, § 7 EStG, § 255 HGB</td></tr>
 <tr><td>V+V ZFH</td><td class="n">− 10.000</td><td class="ref">§ 21 EStG</td></tr>
 <tr><td>Dividende: Abgeltungsteuer, nicht im GdE</td><td class="n">0</td><td class="ref">§ 2 Abs. 5b, § 32d, § 43 Abs. 5 EStG</td></tr>
 <tr class="sub"><td>Gesamtbetrag der Einkünfte</td><td class="n">200.000</td><td class="ref">§ 2 Abs. 3 EStG</td></tr>
 <tr><td>./. Sonderausgaben</td><td class="n">− 10.000</td><td class="ref">§ 10 EStG</td></tr>
 <tr class="sum"><td>Einkommen</td><td class="n">190.000</td><td class="ref">§ 2 Abs. 4 EStG</td></tr></table>
 <p>Die Dividende beträgt brutto 7.500 / 0,75 = 10.000 €; die Bank hat 2.500 € Kapitalertragsteuer einbehalten. Damit ist die ESt darauf <b>abgegolten</b> (§ 43 Abs. 5 EStG). Sie taucht im Schema des § 2 EStG nicht auf (§ 2 Abs. 5b EStG), es sei denn, Peter beantragt die Günstigerprüfung (§ 32d Abs. 6 EStG) – bei 200.000 € GdE wäre das aber nachteilig.</p>`,
 laws:['§ 2 Abs. 5b EStG – Abgeltungsteuer-Kapitalerträge nicht im GdE','§ 32d Abs. 1 EStG – gesonderter Steuersatz 25 %','§ 43 Abs. 5 EStG – Abgeltungswirkung des Kapitalertragsteuerabzugs','§ 43a Abs. 1 Nr. 1 EStG – KapESt 25 %','§ 9a S. 1 Nr. 1a EStG – 1.230 €','§ 255 Abs. 1 HGB / § 6 EStG – Grunderwerbsteuer = Anschaffungsnebenkosten (AfA-Bemessungsgrundlage)'],
 example:`<p><b>Netto zurück auf brutto:</b> Wenn 75 % = 7.500 €, dann sind 100 % = 10.000 €. Die Dividende ist wie ein Lohn, von dem der Arbeitgeber die Steuer schon einbehalten hat – nur dass hier die Bank das für den Staat erledigt. Deshalb muss sie nicht noch einmal in die Steuererklärung.</p><p><b>Grunderwerbsteuer beim Hauskauf</b> ist wie die Lieferkosten beim Möbelkauf: Sie gehört zum Kaufpreis (Anschaffungskosten) und wird über die Nutzungsdauer verteilt (AfA), nicht sofort als Werbungskosten abgezogen.</p>`,
 traps:['Dividende weder brutto noch netto in den GdE – Abgeltungsteuer!','Grunderwerbsteuer beim Kauf des Vermietungsobjekts ist NICHT sofort abziehbar (Anschaffungsnebenkosten).','Fahrtkosten 500 € sind nicht zusätzlich zum Pauschbetrag abziehbar – entweder Pauschbetrag ODER höhere tatsächliche Kosten.']
},
{

 <tr><td>Zinsen 3.000: Abgeltungsteuer (1.000 Sparer-Pauschbetrag, Rest 25 % an der Quelle)</td><td class="n">0</td><td class="ref">§ 20 Abs. 9, § 32d, § 2 Abs. 5b EStG</td></tr>
 <tr><td>Arbeitslosengeld: steuerfrei, nur Progressionsvorbehalt</td><td class="n">0</td><td class="ref">§ 3 Nr. 2a, § 32b Abs. 1 Nr. 1a EStG</td></tr>
 <tr><td>Goldbarren: privates Veräußerungsgeschäft (&lt; 1 Jahr), Verlust nur mit Gewinnen aus § 23 verrechenbar</td><td class="n">0</td><td class="ref">§ 22 Nr. 2, § 23 Abs. 1 Nr. 2, Abs. 3 S. 7 EStG</td></tr>
 <tr class="sub"><td>Gesamtbetrag der Einkünfte</td><td class="n">101.800</td><td class="ref">§ 2 Abs. 3 EStG</td></tr>
 <tr><td>Sonderausgaben: Spende 500 + Basis-KV 1.200</td><td class="n">− 1.700</td><td class="ref">§ 10b, § 10 Abs. 1 Nr. 3 EStG</td></tr>
 <tr><td>Geldstrafe: nicht abziehbar</td><td class="n">0</td><td class="ref">§ 12 Nr. 4 EStG</td></tr>
 <tr class="sum"><td>Einkommen = zvE</td><td class="n">100.100</td><td class="ref">§ 2 Abs. 4, 5 EStG</td></tr></table>
 <p>Das Arbeitslosengeld erhöht zwar nicht das zvE, aber den <b>Steuersatz</b>: Der Tarif wird so berechnet, als hätte Lena 102.100 € zvE, und dieser Satz wird auf die 100.100 € angewandt (§ 32b EStG).</p>`,
 laws:['§ 9 Abs. 1 S. 3 Nr. 4 EStG – Entfernungspauschale 0,38 €/km ab dem 1. km (seit 2026)','§ 9 Abs. 1 S. 3 Nr. 3 EStG – Beiträge zu Berufsverbänden','§ 12 Nr. 1 EStG – private Lebensführung (bürgerliche Kleidung)','§ 12 Nr. 4 EStG – Geldstrafen nicht abziehbar','§ 3 Nr. 2a EStG + § 32b EStG – Arbeitslosengeld steuerfrei mit Progressionsvorbehalt','§ 20 Abs. 9 EStG – Sparer-Pauschbetrag 1.000 €','§ 23 Abs. 1 Nr. 2, Abs. 3 S. 7 EStG – private Veräußerungsgeschäfte, Verlustverrechnungsverbot','§ 10 Abs. 1 Nr. 3, § 10b EStG – Vorsorgeaufwendungen und Spenden'],
 example:`<p>Denke an drei Töpfe: (1) <b>Einkünfte-Topf</b>: Nur echte Einkünfte der 7 Arten, jede mit ihren eigenen Kosten. (2) <b>Private Abzüge</b> (Sonderausgaben, außergewöhnliche Belastungen): Dinge, die der Staat aus sozialen Gründen abziehbar macht – Spenden, Krankenversicherung. (3) <b>Tabu-Zone</b> (§ 12 EStG): Privatvergnügen, Strafen, Lebensführung – kommt nirgendwo rein. Dazu zwei Spezialfälle, die „außen vor“ bleiben: Abgeltungsteuer-Kapitalerträge (eigene Flatrate von 25 %) und steuerfreie Lohnersatzleistungen (zählen nur für den Steuersatz).</p>`,
 traps:['Entfernungspauschale: nur die einfache Entfernung, nicht hin und zurück! Seit 2026 einheitlich 0,38 €/km.','Pauschbetrag ODER tatsächliche Kosten – nie beides.','Verluste aus § 23 (Gold, Krypto, Grundstücke unter 10 Jahren) nur mit Gewinnen aus § 23 verrechenbar.','Geldstrafen (§ 12 Nr. 4) und Geldbußen (§ 4 Abs. 5 Nr. 8) sind nie abziehbar.','Arbeitslosengeld, Krankengeld, Elterngeld: steuerfrei, aber Progressionsvorbehalt.']
},
{
 id:'est-04', topic:'est', title:'Progressionsvorbehalt (Original 2025)', diff:2, points:3, exam:true,
 source:'Klausur 2025, Aufgabe 2; 2022, Aufgabe 3; 2023',
 text:`<p>Herr Meier (alleinstehend) hat ein inländisches Einkommen von 40.000 €, für das sich (angenommen) eine Steuerlast von 6.000 € ergibt. Daneben hat er noch steuerfreie Auslandseinkünfte in Höhe von 20.000 €, die nach einem Doppelbesteuerungsabkommen in Deutschland unter Progressionsvorbehalt gem. § 32b EStG steuerfrei sind. Wären diese Einkünfte in Deutschland steuerpflichtig, wäre die Einkommensteuer für 60.000 € insgesamt 12.000 €.</p>`,
 parts:[
  {type:'single', q:'Welche deutsche ESt fällt an?', options:['3.000 €','12.000 €','8.000 €','6.000 €'], correct:[2]}
 ],
 solution:`<table class="calc">
 <tr><td>Fiktives Einkommen inkl. steuerfreie Einkünfte</td><td class="n">60.000</td><td class="ref">§ 32b Abs. 2 EStG</td></tr>
 <tr><td>Steuer darauf (laut Aufgabe)</td><td class="n">12.000</td><td class="ref"></td></tr>
 <tr><td>Besonderer Steuersatz = 12.000 / 60.000</td><td class="n">20 %</td><td class="ref">§ 32b Abs. 2 S. 1 EStG</td></tr>
 <tr><td>Anwendung auf das tatsächlich steuerpflichtige Einkommen 40.000 × 20 %</td><td class="n">8.000</td><td class="ref">§ 32b Abs. 1 Nr. 3 EStG</td></tr>
 <tr class="sum"><td>Deutsche ESt</td><td class="n">8.000 €</td><td class="ref"></td></tr></table>
 <p>Vergleich: ohne Progressionsvorbehalt 6.000 € (15 %), bei voller Steuerpflicht 12.000 €. Die Auslandseinkünfte bleiben steuerfrei, aber die 40.000 € werden mit dem höheren Satz besteuert → Mehrbelastung 2.000 €.</p>`,
 laws:['§ 32b Abs. 1 S. 1 Nr. 3 EStG – Progressionsvorbehalt für DBA-steuerfreie Einkünfte','§ 32b Abs. 2 EStG – Berechnung des besonderen Steuersatzes','§ 32b Abs. 1 S. 1 Nr. 1 EStG – auch für Lohnersatzleistungen (ALG, Krankengeld, Elterngeld, Kurzarbeitergeld)','§ 2 AO – Vorrang völkerrechtlicher Verträge (DBA)'],
 example:`<p>Stell dir einen Fahrstuhl vor, dessen Geschwindigkeit (Steuersatz) davon abhängt, wie viele Personen einsteigen. Die Auslandseinkünfte steigen mit ein, machen den Fahrstuhl schneller (20 % statt 15 %) – aber bezahlen müssen nur die 40.000 € inländischen Einkünfte die Fahrt. Darum: „steuerfrei“ heißt nicht „folgenlos“.</p><p><b>Merkformel:</b> Steuersatz = Steuer auf (inländisch + ausländisch) ÷ (inländisch + ausländisch); ESt = inländisches zvE × dieser Satz.</p>`,
 traps:['Nicht 12.000 − 6.000 oder sonstige Differenzen rechnen – immer den SATZ aus dem Gesamteinkommen bilden und auf das inländische Einkommen anwenden.','Auch inländische steuerfreie Lohnersatzleistungen (ALG I, Elterngeld, Krankengeld, Kurzarbeitergeld) unterliegen dem Progressionsvorbehalt.']
},
{
 id:'est-05', topic:'est', title:'Progressionsvorbehalt und Anrechnung ausländischer Steuer (Original 2022)', diff:2, points:5, exam:true,
 source:'Klausur 2022, Aufgaben 3 und 4 (je 5 Punkte)',
 text:`<p>a) Der unbeschränkt Steuerpflichtige A hat ein inländisches Einkommen von 50.000 € und nach dem DBA steuerfreie Einkünfte aus Vermietung eines Gebäudes in Frankreich von 30.000 €, die in Deutschland dem Progressionsvorbehalt unterliegen. Der deutsche Steuersatz soll betragen: bei 50.000 € Einkommen 20 %, bei 80.000 € Einkommen 30 %.</p>
 <p>b) Die unbeschränkt Steuerpflichtige B hat ein Einkommen von 50.000 € einschließlich der nachfolgenden ausländischen Einkünfte aus Vermietung eines Gebäudes in Spanien von 10.000 €, die nach dem DBA auch in Deutschland steuerpflichtig sind und für die sie in Spanien 3.000 € Steuern gezahlt hat. Der deutsche Steuersatz soll bei 50.000 € Einkommen 20 % betragen.</p>`,
 parts:[
  {type:'num', q:'a) Die Einkommensteuer des A beträgt (€)', answer:15000, tol:1},
  {type:'num', q:'b) Die ausländische Steuer ist auf die deutsche Steuer anzurechnen mit (€)', answer:2000, tol:1},
  {type:'num', q:'b) Die deutsche Einkommensteuer der B nach Anrechnung beträgt (€)', answer:8000, tol:1}
 ],
 solution:`<p><b>a) Freistellung mit Progressionsvorbehalt (§ 32b EStG):</b> Steuersatz für 80.000 € = 30 %. Anwendung auf 50.000 € → <b>15.000 €</b>. (Ohne Vorbehalt wären es 10.000 €; bei voller Steuerpflicht 24.000 €.)</p>
 <p><b>b) Anrechnungsmethode (§ 34c Abs. 1 EStG):</b></p>
 <table class="calc">
 <tr><td>Deutsche ESt auf 50.000 € × 20 %</td><td class="n">10.000</td><td class="ref"></td></tr>
 <tr><td>Höchstbetrag = dt. ESt × ausl. Einkünfte / Summe der Einkünfte = 10.000 × 10.000 / 50.000</td><td class="n">2.000</td><td class="ref">§ 34c Abs. 1 S. 2 EStG</td></tr>
 <tr><td>Gezahlte spanische Steuer</td><td class="n">3.000</td><td class="ref"></td></tr>
 <tr><td>Anrechenbar: der niedrigere Betrag</td><td class="n">2.000</td><td class="ref">§ 34c Abs. 1 S. 1 EStG</td></tr>
 <tr class="sum"><td>Deutsche ESt nach Anrechnung: 10.000 − 2.000</td><td class="n">8.000 €</td><td class="ref"></td></tr></table>
 <p>Die nicht anrechenbaren 1.000 € sind verloren (Anrechnungsüberhang) – alternativ könnte B die ganze ausländische Steuer als Werbungskosten abziehen (§ 34c Abs. 2 EStG, Abzugsmethode), was bei 20 % Steuersatz aber nur 600 € bringt.</p>`,
 laws:['§ 32b Abs. 1 Nr. 3, Abs. 2 EStG – Progressionsvorbehalt','§ 34c Abs. 1 EStG – Anrechnung ausländischer Steuer bis zum Höchstbetrag (Verhältnis ausl. Einkünfte / Summe der Einkünfte)','§ 34c Abs. 2 EStG – alternativ Abzug bei den Einkünften auf Antrag','§ 1 Abs. 1 EStG – unbeschränkte Steuerpflicht, Welteinkommensprinzip','§ 32d Abs. 5 EStG – Sonderregel für Kapitalerträge (max. 25 %)'],
 example:`<p>Zwei Methoden gegen Doppelbesteuerung, zwei Bilder:</p>
 <p><b>Freistellung (a):</b> Deutschland sagt „Frankreich darf die Miete besteuern, ich fasse sie nicht an“ – zieht aber den Steuersatz hoch. Typisch für Einkünfte mit starker Verbindung ins Ausland (Immobilien, Betriebsstätten, Arbeitslohn dort).</p>
 <p><b>Anrechnung (b):</b> Deutschland besteuert alles, zieht aber die spanische Steuer ab wie eine Vorauszahlung – allerdings höchstens so viel, wie Deutschland selbst auf diese Einkünfte verlangt hätte (2.000 €). Spanien war „teurer“ (3.000 €), die Differenz bleibt an B hängen.</p>`,
 traps:['Höchstbetrag: Anrechnung nie mehr als die anteilige deutsche Steuer auf die Auslandseinkünfte.','Die Formel nutzt die Summe der Einkünfte als Nenner (ohne Sonderausgaben).','Progressionsvorbehalt gilt bei Freistellung, Anrechnung bei Steuerpflicht – nie beides zugleich für dieselben Einkünfte.']
},
{
 id:'est-06', topic:'est', title:'Anrechnung nach § 34c EStG mit Höchstbetrag (Skript-Beispiel)', diff:2, points:4, exam:true,
 source:'Skript 2.1 Doppelbesteuerung',
 text:`<p>Ausländische Einkünfte 10.000 €, Summe der Einkünfte (= Einkommen) 100.000 €, deutsche ESt darauf 20.000 €. Kein DBA mit dem Quellenstaat.</p>`,
 parts:[
  {type:'num', q:'Höchstbetrag der Anrechnung (€)', answer:2000, tol:1},
  {type:'num', q:'Deutsche ESt, wenn im Ausland 3.000 € Steuer gezahlt wurden (€)', answer:18000, tol:1},
  {type:'num', q:'Deutsche ESt, wenn im Ausland 1.000 € Steuer gezahlt wurden (€)', answer:19000, tol:1},
  {type:'single', q:'Welche Methode gilt, wenn KEIN DBA besteht?', options:['Freistellung mit Progressionsvorbehalt (§ 32b EStG)','Anrechnung bzw. Abzug der ausländischen Steuer (§ 34c Abs. 1/2 EStG)','Die Einkünfte sind in Deutschland nicht steuerbar'], correct:[1]}
 ],
 solution:`<table class="calc">
 <tr><td>Höchstbetrag = 20.000 × 10.000 / 100.000</td><td class="n">2.000</td><td class="ref">§ 34c Abs. 1 S. 2 EStG</td></tr>
 <tr><td>Fall 1: ausl. Steuer 3.000 → anrechenbar max. 2.000 → ESt 20.000 − 2.000</td><td class="n">18.000</td><td class="ref"></td></tr>
 <tr><td>Fall 2: ausl. Steuer 1.000 → voll anrechenbar → ESt 20.000 − 1.000</td><td class="n">19.000</td><td class="ref"></td></tr></table>
 <p>Ohne DBA gilt das Welteinkommensprinzip voll (§ 1 Abs. 1 EStG), Deutschland mildert die Doppelbesteuerung einseitig durch § 34c EStG (Anrechnung von Amts wegen, Abzug auf Antrag). Nur bei DBA kommt die Freistellung in Betracht.</p>`,
 laws:['§ 34c Abs. 1 EStG – Anrechnungsmethode (Höchstbetrag)','§ 34c Abs. 2 EStG – Abzugsmethode auf Antrag','§ 34c Abs. 6 EStG – Verhältnis zu DBA','§ 32b EStG – Progressionsvorbehalt nur bei Freistellung','§ 26 KStG – entsprechende Anwendung bei Körperschaften'],
 example:`<p>Der Höchstbetrag ist der „Deckel“: Du bekommst maximal die deutsche Steuer zurück, die auf dein Auslandseinkommen entfällt – hier 10 % deines Einkommens kommen aus dem Ausland, also 10 % deiner deutschen Steuer (2.000 €). Was das Ausland darüber hinaus kassiert hat, ist Pech.</p>`,
 traps:['Höchstbetragsformel: Anteil der ausländischen Einkünfte an der Summe der Einkünfte × deutsche ESt.','Ohne DBA keine Freistellung!']
},
{
 id:'est-07', topic:'est', title:'Abgeltungsteuer mit ausländischer Quellensteuer (§ 32d EStG)', diff:3, points:5, exam:true,
 source:'Klausur 2025, Aufgabe 4 (5 Punkte); 2013, Aufgabe 6; 2010, Aufgabe 6',
 text:`<p>Ermitteln Sie die Einkommensteuer (= Kapitalertragsteuer) nach § 32d EStG. Der in Mannheim wohnende konfessionslose, alleinstehende Herr Müller hat 8.000 € inländische und 2.000 € ausländische Kapitaleinkünfte, ausländische Steuer darauf 600 € (Sparerpauschbetrag nicht mehr zu berücksichtigen). Nach dem DBA besteuern beide Staaten; Deutschland muss die ausländische Steuer nach Maßgabe des deutschen Rechts anrechnen.</p>`,
 parts:[
  {type:'single', q:'Daraus ergibt sich eine deutsche Einkommensteuer von', options:['2.500 €','1.900 €','2.000 €'], correct:[2]},
  {type:'single', q:'Zusatz: Wie hoch ist die Gesamtbelastung (ESt + Soli + KiSt) auf 10.000 € inländische Kapitalerträge bei einem kirchensteuerpflichtigen Anleger (KiSt 8 %, Baden-Württemberg)?', options:['25,00 %','26,375 %','27,82 %','28,50 %'], correct:[2]}
 ],
 solution:`<p><b>Teil 1 – Formel des § 32d Abs. 1 S. 4 EStG:</b> ESt = (e − 4q) / (4 + k)<br>e = Kapitalerträge 10.000; q = anrechenbare ausländische Steuer; k = Kirchensteuersatz (hier 0).</p>
 <table class="calc">
 <tr><td>Ausländische Steuer gezahlt</td><td class="n">600</td><td class="ref"></td></tr>
 <tr><td>Anrechnung begrenzt auf 25 % der ausländischen Erträge: 2.000 × 25 %</td><td class="n">500</td><td class="ref">§ 32d Abs. 5 S. 1 EStG</td></tr>
 <tr><td>ESt = (10.000 − 4 × 500) / (4 + 0) = 8.000 / 4</td><td class="n">2.000</td><td class="ref">§ 32d Abs. 1 S. 4 EStG</td></tr>
 <tr class="sum"><td>Deutsche ESt (Antwort C)</td><td class="n">2.000 €</td><td class="ref"></td></tr></table>
 <p>Kontrolle: 25 % × 10.000 = 2.500 − 500 anrechenbar = 2.000. Die restlichen 100 € ausländische Steuer verfallen.</p>
 <p><b>Teil 2 – mit Kirchensteuer 8 %:</b> ESt = 10.000 / (4 + 0,08) = 2.450,98; KiSt 8 % davon = 196,08; Soli 5,5 % der ESt = 134,80 → Gesamt 2.781,86 € = <b>27,82 %</b>. Ohne Kirche: 25 % + 5,5 % × 25 % = 26,375 %. (Die Kirchensteuer ist als Sonderausgabe berücksichtigt – deshalb sinkt die ESt auf 24,51 % statt 25 %.)</p>`,
 laws:['§ 32d Abs. 1 S. 1 EStG – gesonderter Steuersatz 25 %','§ 32d Abs. 1 S. 3–5 EStG – Ermäßigung bei Kirchensteuer: Formel (e − 4q) / (4 + k)','§ 32d Abs. 5 EStG – Anrechnung ausländischer Steuer, max. 25 % des jeweiligen Kapitalertrags','§ 43a Abs. 1 S. 1 Nr. 1 EStG – Kapitalertragsteuer 25 %','§ 20 Abs. 9 EStG – Sparer-Pauschbetrag 1.000 € / 2.000 €','SolZG – Solidaritätszuschlag 5,5 % auf die KapESt (keine Freigrenze bei Abgeltungsteuer)'],
 example:`<p>Die 25 % sind eine „Flatrate“: Egal, wie hoch dein Lohn ist, auf Kapitalerträge zahlst du pauschal 25 %. Hat das Ausland schon mitkassiert (Quellensteuer), rechnet Deutschland das an – aber höchstens die 25 %, die es selbst nimmt. Von 2.000 € Auslandszinsen will Deutschland 500 €; das Ausland hat 600 € genommen; also sind nur 500 € „gegenrechenbar“, 100 € musst du dir ggf. im Ausland zurückholen.</p><p>Die Formel mit dem Nenner (4 + k) sieht gruselig aus, bedeutet aber nur: Weil Kirchensteuer als Sonderausgabe abziehbar ist, wird die ESt etwas kleiner als 25 %.</p>`,
 traps:['Anrechnung der ausländischen Steuer: maximal 25 % der ausländischen Erträge (hier 500, nicht 600).','Nicht die Günstigerprüfung oder den Tarif verwenden – die Aufgabe will § 32d.','Soli fällt auf die Abgeltungsteuer immer an (keine Freigrenze wie bei der Lohnsteuer).']
},
{
 id:'est-08', topic:'est', title:'Mitunternehmer: Gewinn der A-B-OHG (Original 2025)', diff:2, points:3, exam:true,
 source:'Klausur 2025, Aufgabe 5; 2023, Aufgabe 8',
 text:`<p>Der handelsrechtlich zutreffende Gewinn der A-B-OHG (Beteiligung A mit 70 %, B mit 30 %) beträgt 100.000 €. Es wurde vereinbart, dass A die Geschäftsführung macht und dafür eine Geschäftsführervergütung von 40.000 €/Jahr erhält, die als Personalaufwand gebucht wird. B hat der OHG ein Darlehen von 100.000 € zur Verfügung gestellt, für das die OHG 5.000 € Zinsen ausgezahlt und zutreffend verbucht hat.</p>`,
 parts:[
  {type:'num', q:'Der steuerliche Gewinn der OHG beträgt (€)', answer:145000, tol:1},
  {type:'num', q:'A hat Einkünfte aus Gewerbebetrieb in Höhe von (€)', answer:110000, tol:1},
  {type:'single', q:'B hat …', options:['Einkünfte aus Gewerbebetrieb von 30.000 € und aus Kapitalvermögen von 5.000 €','Einkünfte aus Gewerbebetrieb von 35.000 €','Einkünfte aus Gewerbebetrieb von 30.000 €'], correct:[1]}
 ],
 solution:`<table class="calc">
 <tr><td>Handelsrechtlicher Gewinn</td><td class="n">100.000</td><td class="ref"></td></tr>
 <tr><td>+ Geschäftsführervergütung A (Sondervergütung, steuerlich keine Betriebsausgabe)</td><td class="n">+ 40.000</td><td class="ref">§ 15 Abs. 1 S. 1 Nr. 2 S. 1 Hs. 2 EStG</td></tr>
 <tr><td>+ Darlehenszinsen B (Sondervergütung)</td><td class="n">+ 5.000</td><td class="ref">§ 15 Abs. 1 S. 1 Nr. 2 EStG</td></tr>
 <tr class="sum"><td>Steuerlicher Gewinn der OHG</td><td class="n">145.000 €</td><td class="ref"></td></tr></table>
 <table class="calc">
 <tr><th></th><th class="n">A (70 %)</th><th class="n">B (30 %)</th></tr>
 <tr><td>Gewinnanteil aus 100.000</td><td class="n">70.000</td><td class="n">30.000</td></tr>
 <tr><td>Sondervergütung</td><td class="n">40.000</td><td class="n">5.000</td></tr>
 <tr class="sum"><td>Einkünfte aus Gewerbebetrieb</td><td class="n">110.000</td><td class="n">35.000</td></tr></table>
 <p>Alles sind Einkünfte aus Gewerbebetrieb – auch das „Gehalt“ des A (kein § 19) und die Zinsen des B (kein § 20). Das nennt man <b>Sonderbetriebseinnahmen</b>. Zusatzeffekt: Für die GewSt der OHG werden die Zinsen an B nicht nach § 8 Nr. 1 GewStG hinzugerechnet, weil sie den Gewinn bereits nicht gemindert haben.</p>`,
 laws:['§ 15 Abs. 1 S. 1 Nr. 2 EStG – Gewinnanteile UND Vergütungen für Tätigkeit, Darlehen, Überlassung von Wirtschaftsgütern = Einkünfte aus Gewerbebetrieb','§ 15 Abs. 2 EStG – Merkmale des Gewerbebetriebs','§ 180 Abs. 1 Nr. 2a AO – gesonderte und einheitliche Feststellung','§ 20 Abs. 8 EStG – Subsidiarität: Kapitalerträge im Betriebsvermögen sind gewerblich','§ 19 EStG greift nicht – der Mitunternehmer ist kein Arbeitnehmer seiner eigenen Gesellschaft'],
 example:`<p>Stell dir die OHG als Familienpizzeria vor, die A und B gehört. Wenn A sich 40.000 € „Gehalt“ auszahlt, verschiebt er nur Geld aus der linken in die rechte Tasche – steuerlich bleibt es Gewinn der Pizzeria, der ihm zusteht. Gleiches mit den Zinsen, die B für sein Darlehen bekommt. Der Fiskus sagt: „Ihr seid Unternehmer, alles, was ihr aus eurem Unternehmen zieht, ist Gewinn aus Gewerbebetrieb.“</p><p><b>Merksatz:</b> Handelsbilanzgewinn + alle Sondervergütungen an Gesellschafter = steuerlicher Gesamtgewinn. Jeder bekommt seinen Anteil + seine eigene Sondervergütung.</p>`,
 traps:['Geschäftsführergehalt eines OHG-Gesellschafters ist NICHT § 19 (nichtselbständige Arbeit).','Zinsen aus Gesellschafterdarlehen sind NICHT § 20 (Kapitalvermögen).','Miete für ein an die OHG vermietetes Grundstück des Gesellschafters ist NICHT § 21 (V+V) – siehe Variante.','Bei einer GmbH ist das anders: Dort ist das GF-Gehalt echter Arbeitslohn (§ 19) und mindert den Gewinn (soweit angemessen).']
},
{
 id:'est-09', topic:'est', title:'Mitunternehmer mit Mietvergütung und stiller Gesellschafter', diff:2, points:4, exam:true,
 source:'Skript-Beispiel 2.2.1; Klausurvariante',
 text:`<p>OHG-Gewinn 100.000 €. A (70 %) erhält 40.000 € Geschäftsführervergütung, B (30 %) vermietet der OHG ein Grundstück für 20.000 € jährlich. Beide Beträge sind als Aufwand gebucht. Zusätzlich ist C als <b>typisch stiller Gesellschafter</b> mit 10.000 € am Gewinn beteiligt (ebenfalls als Aufwand gebucht).</p>`,
 parts:[
  {type:'num', q:'Steuerlicher Gewinn der OHG nach § 15 EStG (ohne C) (€)', answer:160000, tol:1},
  {type:'num', q:'Einkünfte aus Gewerbebetrieb des B (€)', answer:50000, tol:1},
  {type:'single', q:'Der Gewinnanteil des typisch stillen Gesellschafters C ist bei C …', options:['Einkünfte aus Gewerbebetrieb (§ 15 EStG), da Mitunternehmer','Einkünfte aus Kapitalvermögen (§ 20 Abs. 1 Nr. 4 EStG), Kapitalertragsteuer 25 %','Einkünfte aus Vermietung und Verpachtung'], correct:[1]}
 ],
 solution:`<table class="calc">
 <tr><td>Handelsgewinn</td><td class="n">100.000</td><td class="ref"></td></tr>
 <tr><td>+ GF-Vergütung A</td><td class="n">+ 40.000</td><td class="ref">§ 15 Abs. 1 Nr. 2 EStG</td></tr>
 <tr><td>+ Miete B (Sonderbetriebseinnahme, Grundstück = Sonderbetriebsvermögen)</td><td class="n">+ 20.000</td><td class="ref">§ 15 Abs. 1 Nr. 2 EStG</td></tr>
 <tr class="sum"><td>Steuerlicher Gewinn</td><td class="n">160.000</td><td class="ref"></td></tr>
 <tr><td>A: 70.000 + 40.000</td><td class="n">110.000</td><td class="ref"></td></tr>
 <tr><td>B: 30.000 + 20.000</td><td class="n">50.000</td><td class="ref"></td></tr></table>
 <p><b>Stiller Gesellschafter C:</b> Der <i>typisch</i> stille Gesellschafter (§§ 230 ff. HGB) ist nur am Gewinn beteiligt, hat keine Mitunternehmerinitiative und kein Mitunternehmerrisiko (keine Beteiligung an stillen Reserven). Sein Gewinnanteil ist bei ihm <b>Kapitalvermögen</b> (§ 20 Abs. 1 Nr. 4 EStG), die OHG behält 25 % KapESt ein (§ 43 Abs. 1 Nr. 3 EStG). Bei der OHG bleibt der Betrag Betriebsausgabe – wird aber bei der GewSt zu 100 % hinzugerechnet (§ 8 Nr. 1c GewStG). Ein <i>atypisch</i> stiller Gesellschafter (Mitwirkungsrechte, Beteiligung an stillen Reserven) wäre dagegen Mitunternehmer → § 15 EStG.</p>`,
 laws:['§ 15 Abs. 1 S. 1 Nr. 2 EStG – Sondervergütungen (Tätigkeit, Darlehen, Überlassung von Wirtschaftsgütern)','§ 20 Abs. 1 Nr. 4 EStG – typisch stiller Gesellschafter = Kapitalvermögen','§ 43 Abs. 1 S. 1 Nr. 3 EStG – KapESt-Abzug bei stiller Beteiligung','§§ 230–236 HGB – stille Gesellschaft','§ 8 Nr. 1c GewStG – Hinzurechnung der Gewinnanteile des stillen Gesellschafters','§ 15 Abs. 3 Nr. 1 EStG – Abfärbetheorie: teilweise gewerbliche Tätigkeit infiziert alle Einkünfte der Personengesellschaft'],
 example:`<p>Der Unterschied zwischen Mitunternehmer und stillem Gesellschafter ist wie zwischen <b>Mitgründer</b> und <b>Geldgeber</b>: Der Mitgründer (A, B) trägt das Risiko, redet mit, besitzt einen Teil des Unternehmens – alles, was er bekommt, ist Unternehmergewinn. Der stille Geldgeber (C) hat nur Geld eingelegt und bekommt dafür eine gewinnabhängige Verzinsung – das ist wirtschaftlich wie Zinsen, also Kapitalvermögen.</p>`,
 traps:['Miete, die ein Gesellschafter von seiner OHG bekommt, ist § 15 – nicht § 21!','Typisch still = § 20; atypisch still = § 15. Das Wort „typisch/atypisch“ im Sachverhalt genau lesen.','Abfärbetheorie: Übt eine freiberufliche Sozietät auch nur eine kleine gewerbliche Tätigkeit aus, werden ALLE Einkünfte gewerblich (und gewerbesteuerpflichtig).']
},
{
 id:'est-10', topic:'est', title:'Verlustverrechnung – Aussagen prüfen (Original 2025)', diff:2, points:3, exam:true,
 source:'Klausur 2025, Aufgabe 3; 2023, Aufgabe 6; 2015, Aufgabe 5 (identischer Text)',
 text:`<p>Welche der folgenden Aussagen sind zutreffend?</p>`,
 parts:[
  {type:'multi', q:'Zutreffend sind:', options:['Verluste und Gewinne innerhalb der Einkunftsart können stets ausgeglichen werden.','Verluste aus Aktienveräußerungen können nicht mit Dividenden ausgeglichen werden.','Negative Stückzinsen können mit Gewinnen aus Aktienverkäufen ausgeglichen werden.','Verluste einer Einkunftsart können grundsätzlich mit positiven Einkünften aus einer anderen Einkunftsart ausgeglichen werden.','Verluste aus Kapitalvermögen einer Bank können bei der anderen Bank mit dortigen positiven Kapitalerträgen ausgeglichen werden.'], correct:[1,2,3]}
 ],
 solution:`<ul class="tight">
 <li><b>A falsch:</b> „stets“ ist zu absolut. Ausnahmen innerhalb einer Einkunftsart: Aktienverluste (§ 20 Abs. 6 S. 4), Termingeschäfte, § 15a EStG (Kommanditisten), § 23 Abs. 3 S. 7 EStG. Mit „grundsätzlich“ wäre die Aussage richtig.</li>
 <li><b>B richtig:</b> Aktienveräußerungsverluste dürfen nur mit Aktienveräußerungsgewinnen verrechnet werden (eigener „Aktientopf“, § 20 Abs. 6 S. 4 EStG).</li>
 <li><b>C richtig:</b> Negative Stückzinsen (gezahlte Stückzinsen beim Anleihekauf) sind negative Kapitalerträge im <i>allgemeinen</i> Verlusttopf. Dieser Topf darf mit allen positiven Kapitalerträgen verrechnet werden – auch mit Aktiengewinnen. Die Beschränkung gilt nur in die andere Richtung (Aktien<i>verluste</i>).</li>
 <li><b>D richtig:</b> Vertikaler Verlustausgleich ist der Grundsatz (§ 2 Abs. 3 EStG); Ausnahmen: § 20 Abs. 6, § 23 Abs. 3, § 15a, § 2a EStG.</li>
 <li><b>E falsch:</b> Verlusttöpfe werden je Bank geführt (§ 43a Abs. 3 EStG). Eine bankübergreifende Verrechnung ist nur über die Steuererklärung mit <b>Verlustbescheinigung</b> möglich (§ 43a Abs. 3 S. 4, § 32d Abs. 4 EStG) – nicht „bei der anderen Bank“.</li></ul>`,
 laws:['§ 2 Abs. 3 EStG – horizontaler und vertikaler Verlustausgleich','§ 20 Abs. 6 S. 1, 2 EStG – Kapitalverluste nur mit Kapitalerträgen (Schedule)','§ 20 Abs. 6 S. 4 EStG – Aktienverluste nur mit Aktiengewinnen','§ 43a Abs. 3 EStG – Verlustverrechnungstopf bei der Bank; Verlustbescheinigung bis 15.12.','§ 32d Abs. 4 EStG – Veranlagungswahlrecht zur bankübergreifenden Verrechnung','§ 23 Abs. 3 S. 7 EStG – Verluste aus privaten Veräußerungsgeschäften nur mit solchen Gewinnen','§ 10d EStG – Verlustabzug (Rück-/Vortrag)'],
 example:`<p><b>Das Töpfe-Modell:</b> Bei jeder Bank gibt es zwei Töpfe: den <b>Aktientopf</b> (nur Aktien-Verkaufsverluste) und den <b>allgemeinen Topf</b> (Stückzinsen, Fonds-/Anleiheverluste, Zertifikate). Positive Erträge füllen zuerst die Töpfe auf: Aktiengewinne dürfen beide Töpfe leeren, Dividenden und Zinsen nur den allgemeinen. Die Töpfe der Deutschen Bank und der Sparkasse kennen sich nicht – zusammengeführt werden sie nur über das Finanzamt, wenn du dir bis 15.12. eine Verlustbescheinigung holst.</p>`,
 traps:['Wortwahl entscheidet: „stets“ → falsch, „grundsätzlich“ → richtig. Die Klausur variiert genau dieses Wort!','Aktienverluste ↔ Dividenden: nein. Allgemeine Verluste (Stückzinsen) ↔ Aktiengewinne: ja.','Bankübergreifende Verrechnung nur über das Finanzamt, nie direkt zwischen Banken.']
},
{
 id:'est-11', topic:'est', title:'Verlustverrechnung – Variante mit V+V und privaten Veräußerungsgeschäften', diff:2, points:3, exam:true,
 source:'Klausuren 2017 (Aufg. 4), 2020 (Aufg. 9), 2022 (Aufg. 5)',
 text:`<p>Welche der folgenden Aussagen sind zutreffend?</p>`,
 parts:[
  {type:'multi', q:'Zutreffend sind:', options:['Verluste und Gewinne innerhalb einer Einkunftsart können grundsätzlich ausgeglichen werden.','Verluste aus Aktienveräußerungen können mit Dividenden ausgeglichen werden.','Gewinne aus Aktienverkäufen können mit (negativen) Stückzinsen ausgeglichen werden.','Verluste aus Kapitalvermögen können mit positiven Einkünften aus einer anderen Einkunftsart ausgeglichen werden.','Verluste aus Vermietung und Verpachtung können mit Gewinnen aus Gewerbebetrieb ausgeglichen werden.','Private Veräußerungsverluste (z. B. aus dem Verkauf eines Grundstücks nach 5 Jahren) können mit Renteneinkünften ausgeglichen werden.'], correct:[0,2,4]}
 ],
 solution:`<ul class="tight">
 <li><b>A richtig</b> („grundsätzlich“).</li>
 <li><b>B falsch</b> – Aktienverluste nur mit Aktiengewinnen (§ 20 Abs. 6 S. 4 EStG).</li>
 <li><b>C richtig</b> – allgemeiner Verlusttopf verrechnet sich mit Aktiengewinnen.</li>
 <li><b>D falsch</b> – Kapitalverluste bleiben in der Schedule § 20 (§ 20 Abs. 6 S. 1 EStG).</li>
 <li><b>E richtig</b> – V+V-Verluste sind voll vertikal ausgleichsfähig (§ 2 Abs. 3 EStG).</li>
 <li><b>F falsch</b> – Verluste aus § 23 nur mit Gewinnen aus § 23 (§ 23 Abs. 3 S. 7 EStG), auch wenn Renten ebenfalls „sonstige Einkünfte“ (§ 22) sind.</li></ul>`,
 laws:['§ 2 Abs. 3 EStG','§ 20 Abs. 6 EStG','§ 23 Abs. 3 S. 7 und 8 EStG – Verlustverrechnungsbeschränkung bei privaten Veräußerungsgeschäften (Vor- und Rücktrag innerhalb § 23)','§ 22 Nr. 1, Nr. 2 EStG – Renten und private Veräußerungsgeschäfte sind beide „sonstige Einkünfte“, aber getrennte Verlustkreise'],
 example:`<p>Rente und Grundstücksverkauf stehen zwar beide in § 22 EStG, aber § 23 hat eine eigene „Quarantäne“: Verluste aus Spekulationsgeschäften sollen nicht die Rente, den Lohn oder die Miete kleinrechnen. Dieselbe Idee wie bei Aktien: Wer spekuliert, trägt das Verlustrisiko selbst.</p>`,
 traps:['Innerhalb von § 22 EStG gibt es zwei getrennte Welten: Renten/Unterhalt (Nr. 1, 1a) und private Veräußerungsgeschäfte (Nr. 2 i.V.m. § 23).','V+V-Verluste sind der „gutmütige“ Fall: voll verrechenbar mit allen anderen Einkunftsarten.']
},
{
 id:'est-12', topic:'est', title:'Verlustrücktrag und Verlustvortrag (§ 10d EStG)', diff:3, points:5, exam:true,
 source:'Klausur 2019, Aufgabe 3 (5 Punkte), angepasst auf 70 %-Regel',
 text:`<p>Bei einem negativen Gesamtbetrag der Einkünfte in 07 von 5.000.000 € und einem positiven Gesamtbetrag der Einkünfte in 06 von 2.000.000 € sowie 3.000.000 € in 08 ergeben sich höchstens folgende Verlustabzüge (Lediger oder Kapitalgesellschaft; Rechtsstand VZ 2024–2027):</p>`,
 parts:[
  {type:'num', q:'Verlustrücktrag nach 06 (€)', answer:1000000, tol:1},
  {type:'num', q:'Verlustvortrag nach 08, der in 08 abgezogen wird (€)', answer:2400000, tol:1},
  {type:'num', q:'Verbleibender Verlustvortrag am Ende von 08 (€)', answer:1600000, tol:1}
 ],
 solution:`<table class="calc">
 <tr><td>Negativer GdE 07</td><td class="n">− 5.000.000</td><td class="ref"></td></tr>
 <tr><td>Verlustrücktrag nach 06: max. 1.000.000 € (Ledige/KapG; 2.000.000 € bei Zusammenveranlagung)</td><td class="n">1.000.000</td><td class="ref">§ 10d Abs. 1 S. 1 EStG</td></tr>
 <tr><td>Verbleibend für Vortrag</td><td class="n">4.000.000</td><td class="ref">§ 10d Abs. 4 EStG (Feststellung)</td></tr>
 <tr><td>Vortrag in 08: Sockel 1.000.000 unbeschränkt</td><td class="n">1.000.000</td><td class="ref">§ 10d Abs. 2 S. 1 EStG</td></tr>
 <tr><td>+ 70 % des 1 Mio. übersteigenden GdE: 70 % × (3.000.000 − 1.000.000)</td><td class="n">1.400.000</td><td class="ref">§ 10d Abs. 2 S. 1 EStG (VZ 2024–2027: 70 %, sonst 60 %)</td></tr>
 <tr class="sub"><td>Verlustabzug in 08</td><td class="n">2.400.000</td><td class="ref"></td></tr>
 <tr><td>Zu versteuern in 08: 3.000.000 − 2.400.000</td><td class="n">600.000</td><td class="ref">„Mindestbesteuerung“</td></tr>
 <tr class="sum"><td>Verbleibender Verlustvortrag Ende 08: 4.000.000 − 2.400.000</td><td class="n">1.600.000</td><td class="ref"></td></tr></table>
 <p>Hinweise: Der Rücktrag ist seit 2022 auch in das zweitvorangegangene Jahr möglich (hier 05) und kann auf Antrag ganz unterbleiben (§ 10d Abs. 1 S. 6 EStG). Der Vortrag ist dagegen Pflicht und zeitlich unbegrenzt. Mit der alten 60 %-Regel ergäben sich 2.200.000 € (Antwort F der Klausur 2019).</p>`,
 laws:['§ 10d Abs. 1 EStG – Verlustrücktrag max. 1 Mio. € / 2 Mio. € in die zwei Vorjahre; Verzicht auf Antrag','§ 10d Abs. 2 EStG – Verlustvortrag: 1 Mio. € unbeschränkt, darüber 70 % (VZ 2024–2027), danach 60 %','§ 10d Abs. 4 EStG – gesonderte Feststellung des verbleibenden Verlustvortrags','§ 8 Abs. 1 KStG – gilt auch für Kapitalgesellschaften (ohne Verdopplung)','§ 10a GewStG – eigener Gewerbeverlust (nur Vortrag, kein Rücktrag!)'],
 example:`<p>Der Verlustvortrag ist wie ein Gutschein, den du nur in Raten einlösen darfst: Die erste Million jedes Jahres ist immer frei. Vom Rest deines Gewinns darfst du nur 70 % mit dem Gutschein bezahlen, 30 % musst du immer „bar“ versteuern (Mindestbesteuerung). Der Staat will auch in Gewinnjahren nach Verlusten etwas sehen. Der nicht genutzte Rest des Gutscheins verfällt nicht – er wandert ins nächste Jahr.</p>`,
 traps:['Rücktrag ist begrenzt auf 1 Mio. € (2 Mio. € Ehegatten) – nicht auf den gesamten Verlust.','Vortrag: 1 Mio. Sockel + 70 % des Rests (nicht 70 % vom Ganzen!).','Bei der Gewerbesteuer gibt es KEINEN Verlustrücktrag (§ 10a GewStG).','Zwischen 2020 und 2023 galten vorübergehend 10 Mio. € Rücktrag – alte Klausuren können abweichen.']
},
{
 id:'est-13', topic:'est', title:'Verlustnutzung einer AG über mehrere Jahre', diff:3, points:5, exam:true,
 source:'Klausuren 2010 (Aufg. 11) und 2013 (Aufg. 8), aktualisiert',
 text:`<p>Die Finanzbank AG hat folgende Einkommen: 2024: +20.000.000 €; 2025: −100.000.000 €; 2026: +20.000.000 €; 2027: +51.000.000 €. (Rechne mit der 70 %-Regel auch für 2027.)</p>`,
 parts:[

 example:`<p>Die Klausurfrage spielt mit den Wörtern <b>„kann“</b> und <b>„muss“</b>. Beim Rücktrag hast du ein Wahlrecht (du könntest z. B. verzichten, wenn im Vorjahr der Steuersatz ohnehin niedrig war). Beim Vortrag hast du keins – er wird automatisch in der größtmöglichen Höhe abgezogen. Und 20 Mio. Gewinn heißt nicht 20 Mio. Vortrag: Nur 1 Mio. + 70 % von 19 Mio. = 14,3 Mio.</p>`,
