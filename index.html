 <p>Die Option nach § 9 Abs. 2 UStG ist bei Grundstücksvermietung nur zulässig, wenn der Mieter das Grundstück ausschließlich für Umsätze verwendet, die den Vorsteuerabzug nicht ausschließen. Ärzte, Banken, Versicherungen und Kleinunternehmer scheiden aus; Wohnungsvermietung an Private ebenfalls (kein Unternehmer). Steuerberater sind Regelunternehmer → Option möglich.</p>`,
 laws:['§ 4 Nr. 12 Buchst. a UStG – Vermietung von Grundstücken steuerfrei','§ 9 Abs. 1 UStG – Option gegenüber Unternehmern','§ 9 Abs. 2 UStG – bei Grundstücken nur, wenn der Mieter vorsteuerunschädliche Umsätze ausführt','§ 15 Abs. 1, 2 UStG','§ 15a UStG – Berichtigung bei Nutzungsänderung (10 Jahre)','§ 19 UStG – Kleinunternehmer (Vorjahr ≤ 25.000 €, laufendes Jahr ≤ 100.000 €)'],
 example:`<p>Ohne Option ist der Vermieter wie ein Privatmann: keine USt auf die Miete, aber auch die 19 Mio. € Vorsteuer sind weg. Mit Option bekommt er die 19 Mio. € sofort vom Finanzamt zurück und berechnet dem Mieter 19 % auf die Miete – der holt sie sich seinerseits zurück. Unterm Strich für beide neutral, aber die Liquidität von 19 Mio. € ist sofort da. Deshalb wollen Vermieter von Gewerbeimmobilien immer vorsteuerabzugsberechtigte Mieter.</p>`,
 traps:['§ 9 Abs. 2 UStG: Bei Grundstücken reicht „Unternehmer“ nicht – der Mieter muss selbst zum Vorsteuerabzug berechtigende Umsätze machen.','Wohnraumvermietung: nie Option.']
},
{
 id:'ust-04', topic:'ust', title:'Ausfuhrlieferung an einen Touristen (Original 2010)', diff:2, points:4, exam:true,
 source:'Klausur 2010, Aufgabe 16',
 text:`<p>Media Markt Mannheim verkauft eine Stereoanlage für netto 5.000 € an einen Touristen aus Kanada, der sie im persönlichen Reisegepäck nach Kanada mitnimmt (Ausfuhrnachweis erbracht). Media Markt hatte die Anlage für netto 3.000 € von der Fa. Grundig (Deutschland) erworben.</p>`,
 parts:[
  {type:'num', q:'Erwerbsteuer (innergemeinschaftlicher Erwerb) für Media Markt (€)', answer:0, tol:0.5},
  {type:'num', q:'Vorsteuer, die Media Markt abziehen kann (€)', answer:570, tol:0.5},
  {type:'num', q:'Umsatzsteuer auf den Verkauf an den Touristen (€)', answer:0, tol:0.5},
  {type:'num', q:'Einfuhrumsatzsteuer in Deutschland (€)', answer:0, tol:0.5}
 ],
 solution:`<ul class="tight">
 <li><b>Einkauf von Grundig (Inland):</b> normale steuerpflichtige Lieferung, Grundig stellt 19 % = 570 € USt in Rechnung. Kein innergemeinschaftlicher Erwerb (kein Grenzübertritt innerhalb der EU) → Erwerbsteuer 0.</li>
 <li><b>Vorsteuer:</b> Media Markt zieht die 570 € ab (§ 15 Abs. 1 Nr. 1 UStG). Der Vorsteuerabzug bleibt trotz steuerfreier Ausfuhr erhalten (§ 15 Abs. 3 Nr. 1a UStG) – „echte“ Steuerbefreiung.</li>
 <li><b>Verkauf an den Kanadier:</b> Lieferung steuerbar im Inland (§ 1 Abs. 1 Nr. 1, § 3 Abs. 6 UStG), aber steuerfrei als Ausfuhrlieferung im nichtkommerziellen Reiseverkehr (§ 4 Nr. 1a, § 6 Abs. 1 Nr. 2, Abs. 3a UStG): Abnehmer hat Wohnort im Drittland, Ausfuhr innerhalb von 3 Monaten, Rechnungsbetrag über 50 €, Nachweis erbracht → USt 0.</li>
 <li><b>Einfuhrumsatzsteuer:</b> fällt nur bei Einfuhr nach Deutschland an (§ 1 Abs. 1 Nr. 4 UStG) – hier Ausfuhr → 0 (Kanada erhebt ggf. seine eigene Einfuhrsteuer).</li></ul>`,
 laws:['§ 1 Abs. 1 Nr. 1 UStG – steuerbarer Umsatz','§ 1 Abs. 1 Nr. 4 UStG – Einfuhr','§ 1 Abs. 1 Nr. 5, § 1a UStG – innergemeinschaftlicher Erwerb (nur EU-grenzüberschreitend)','§ 4 Nr. 1a i.V.m. § 6 UStG – Ausfuhrlieferung ins Drittland steuerfrei','§ 6 Abs. 3a UStG – nichtkommerzieller Reiseverkehr (Drittlandswohnsitz, 3 Monate, > 50 €)','§ 15 Abs. 1 UStG – Vorsteuerabzug','§ 15 Abs. 3 Nr. 1a UStG – Vorsteuerabzug bleibt bei Ausfuhr erhalten (echte Befreiung)'],
 example:`<p>Der Staat will, dass Exporte „sauber“ ohne deutsche USt das Land verlassen (Bestimmungslandprinzip: besteuert wird dort, wo konsumiert wird). Deshalb: keine USt auf den Verkauf UND die Vorsteuer auf den Einkauf gibt es trotzdem zurück. Das nennt man echte Steuerbefreiung. Bei Banken, Ärzten, Vermietern ist es die unechte: steuerfrei, aber Vorsteuer weg.</p>`,
 traps:['Echte Befreiung (Export, § 4 Nr. 1–7): Vorsteuer bleibt. Unechte Befreiung (§ 4 Nr. 8 ff.): Vorsteuer weg.','Der türkische Gastarbeiter, der in Deutschland wohnt, ist KEIN ausländischer Abnehmer – hier wäre der Verkauf steuerpflichtig (Skript-Beispiel).','Innergemeinschaftlicher Erwerb nur bei Lieferung aus einem anderen EU-Staat.']
},
{
 id:'ust-05', topic:'ust', title:'Kreditgewährung der Bank an einen Einzelhändler', diff:2, points:3, exam:true,
 source:'Klausur 2010, Aufgabe 17',
 text:`<p>Die Kreditgewährung der Commerzbank zugunsten des Einzelhändlers Karl Kaufmann (Regelunternehmer) führt bei der Bank zu Umsätzen, die …</p>`,
 parts:[
  {type:'multi', q:'Zutreffend:', options:['grundsätzlich steuerfrei sind','grundsätzlich steuerpflichtig sind','optionsfähig sind','bei Option zum Vorsteuerabzug berechtigen','nicht steuerbar sind'], correct:[0,2,3]}
 ],
 solution:`<p>Die Kreditgewährung ist eine <b>sonstige Leistung</b> (§ 3 Abs. 9 UStG) eines Unternehmers im Inland gegen Entgelt (Zinsen) → <b>steuerbar</b> (§ 1 Abs. 1 Nr. 1 UStG), aber <b>steuerfrei</b> nach § 4 Nr. 8a UStG. Da der Kunde Unternehmer ist, kann die Bank optieren (§ 9 Abs. 1) und erhält dann für die zugehörigen Eingangsleistungen den Vorsteuerabzug (§ 15 Abs. 1). „Nicht steuerbar“ ist falsch – steuerbar und steuerfrei sind zwei verschiedene Prüfungsstufen!</p>`,
 laws:['§ 1 Abs. 1 Nr. 1 UStG – Steuerbarkeit','§ 3 Abs. 9 UStG – sonstige Leistung','§ 3a Abs. 2 UStG – Ort bei Leistung an Unternehmer: Sitz des Empfängers','§ 4 Nr. 8a UStG – Gewährung und Vermittlung von Krediten steuerfrei','§ 9 Abs. 1 UStG – Option','§ 15 Abs. 1, 2 UStG'],
 example:`<p>Prüfschema USt immer in dieser Reihenfolge: 1. <b>Steuerbar?</b> (Lieferung/Leistung, Unternehmer, Inland, Entgelt, im Rahmen des Unternehmens) → 2. <b>Steuerfrei?</b> (§ 4) → 3. <b>Option?</b> (§ 9) → 4. <b>Steuersatz</b> (§ 12) → 5. <b>Vorsteuer?</b> (§ 15). Ein Kredit fällt bei Stufe 2 raus – er ist steuerbar, aber befreit.</p>`,
 traps:['„Nicht steuerbar“ ≠ „steuerfrei“. Der Kredit ist steuerbar, aber steuerfrei.']
},
{
 id:'ust-06', topic:'ust', title:'Grundsatzaussagen zur Umsatzsteuer', diff:1, points:3, exam:true,
 source:'Klausur 2020, Aufgabe 8; 2022, Aufgabe 10',
 text:`<p>Folgende Grundsatzaussagen zur Umsatzsteuer (deutsches UStG) sind zutreffend:</p>`,
 parts:[
  {type:'multi', q:'Zutreffend sind:', options:['Allphasen-Netto-Umsatzsteuer mit Vorsteuerabzug','Neutralität der Umsatzsteuer auf Verbraucherebene','Besteuerung des Endverbrauchs im Inland und Ausland','Mehrwertsteuersystem','Die Umsatzsteuer ist eine direkte Steuer'], correct:[0,3]}
 ],
 solution:`<ul class="tight"><li><b>A richtig:</b> Auf jeder Stufe (Hersteller, Großhandel, Einzelhandel) wird die USt auf den Nettopreis erhoben, die Vorsteuer der Vorstufe abgezogen.</li>
 <li><b>B falsch:</b> Neutral ist die USt auf <b>Unternehmer</b>ebene (Vorsteuerabzug). Der Verbraucher trägt sie – er ist der Belastete.</li>
 <li><b>C falsch:</b> Besteuert wird der Endverbrauch im <b>Inland</b> (Bestimmungslandprinzip). Exporte sind steuerfrei.</li>
 <li><b>D richtig:</b> Wirtschaftlich wird auf jeder Stufe nur der Mehrwert belastet.</li>
 <li><b>E falsch:</b> Indirekte Steuer (Steuerschuldner Unternehmer ≠ Steuerträger Verbraucher).</li></ul>`,
 laws:['§ 1 Abs. 1 UStG – Steuergegenstand','§ 1 Abs. 2 UStG – Inland','§ 15 UStG – Vorsteuerabzug (Grundlage der Neutralität)','§ 4 Nr. 1 UStG – Ausfuhr steuerfrei (Bestimmungsland)','§ 13a UStG – Steuerschuldner ist der Unternehmer'],
 example:`<p>Hersteller verkauft für 1.000 + 190 USt. Großhändler zahlt 1.190, holt 190 zurück, verkauft für 1.500 + 285, führt 285 − 190 = 95 ab. Einzelhändler verkauft für 2.500 + 475, führt 475 − 285 = 190 ab. Der Staat hat insgesamt 190 + 95 + 190 = 475 € = 19 % vom Endpreis 2.500 bekommen – genau das, was der Verbraucher bezahlt hat. Für die Unternehmer war es ein durchlaufender Posten.</p>`,
 traps:['Neutralität gilt für UNTERNEHMER, nicht Verbraucher.','Endverbrauch im INLAND – Exporte sind frei.']
},
{
 id:'ust-07', topic:'ust', title:'Allphasen-Netto-Umsatzsteuer durchrechnen', diff:1, points:4, exam:false,
 source:'Skript 5.1 Systematik',
 text:`<p>Hersteller H verkauft Ware für 1.000 € netto an Großhändler G. G verkauft für 1.500 € netto an Einzelhändler E. E verkauft für 2.500 € netto an den Endverbraucher. Regelsteuersatz 19 %.</p>`,
 parts:[
  {type:'num', q:'Zahllast des Großhändlers G (€)', answer:95, tol:0.5},
  {type:'num', q:'Zahllast des Einzelhändlers E (€)', answer:190, tol:0.5},
  {type:'num', q:'Gesamte USt, die beim Finanzamt ankommt (€)', answer:475, tol:0.5},
  {type:'num', q:'Bruttopreis für den Endverbraucher (€)', answer:2975, tol:0.5}
 ],
 solution:`<table class="calc">
 <tr><th>Stufe</th><th class="n">Netto</th><th class="n">USt 19 %</th><th class="n">Vorsteuer</th><th class="n">Zahllast</th></tr>
 <tr><td>Hersteller</td><td class="n">1.000</td><td class="n">190</td><td class="n">0</td><td class="n">190</td></tr>
 <tr><td>Großhändler</td><td class="n">1.500</td><td class="n">285</td><td class="n">190</td><td class="n">95</td></tr>
 <tr><td>Einzelhändler</td><td class="n">2.500</td><td class="n">475</td><td class="n">285</td><td class="n">190</td></tr>
 <tr class="sum"><td>Summe</td><td class="n"></td><td class="n"></td><td class="n"></td><td class="n">475</td></tr></table>
 <p>475 € = 19 % × 2.500 €. Jede Stufe zahlt 19 % ihres Mehrwerts (190 = 19 % × 1.000; 95 = 19 % × 500; 190 = 19 % × 1.000). Der Verbraucher zahlt 2.975 € brutto.</p>`,
 laws:['§ 10 Abs. 1 UStG – Bemessungsgrundlage = Entgelt (netto)','§ 12 Abs. 1 UStG – 19 %','§ 15 Abs. 1 UStG – Vorsteuerabzug','§ 16 UStG – Zahllast = USt − Vorsteuer','§ 18 UStG – Voranmeldung'],
 example:`<p>Rechenhilfe: Zahllast einer Stufe = 19 % × (Verkaufspreis netto − Einkaufspreis netto). Die Summe aller Zahllasten ist immer 19 % des Endverbraucherpreises.</p>`,
 traps:['Netto als Bemessungsgrundlage – aus Bruttobeträgen die USt mit 19/119 herausrechnen.']
},
{
 id:'ust-08', topic:'ust', title:'Steuerbarkeit und Steuerbefreiung prüfen', diff:2, points:4, exam:false,
 source:'Skript 5.2–5.4',
 text:`<p>Ordne die Fälle ein.</p>`,
 parts:[
  {type:'multi', q:'Steuerbar UND steuerpflichtig (19 % oder 7 %) sind:', options:['Bankangestellter verkauft sein privates Auto an einen Kollegen.','Einzelhändler entnimmt einen Laptop aus dem Geschäft für private Zwecke (Vorsteuer wurde abgezogen).','Zahnarzt behandelt einen Patienten (Heilbehandlung).','Maschinenbauer liefert eine Maschine nach Norwegen (Drittland), Ausfuhrnachweis liegt vor.','Vermieter vermietet eine Wohnung an eine Familie.','Steuerberater erstellt eine Steuererklärung für einen Mandanten in Mannheim.','Bäcker verkauft Brötchen zum Mitnehmen.'], correct:[1,5,6]},
  {type:'multi', q:'Welche dieser Umsätze sind steuerbar, aber steuerfrei?', options:['Zahnarzt (Heilbehandlung)','Maschine nach Norwegen','Wohnungsvermietung','Privatverkauf des Autos'], correct:[0,1,2]}
 ],
 solution:`<ul class="tight">
 <li>Privatverkauf: kein Unternehmer → <b>nicht steuerbar</b> (§ 2 UStG).</li>
 <li>Entnahme Laptop: unentgeltliche Wertabgabe, einer Lieferung gegen Entgelt gleichgestellt → steuerbar und steuerpflichtig (§ 3 Abs. 1b Nr. 1 UStG), Bemessungsgrundlage Wiederbeschaffungskosten (§ 10 Abs. 4 UStG).</li>
 <li>Zahnarzt: steuerbar, steuerfrei (§ 4 Nr. 14a), kein Vorsteuerabzug.</li>
 <li>Norwegen: steuerbar (Ort Beginn der Beförderung § 3 Abs. 6), steuerfrei als Ausfuhr (§ 4 Nr. 1a, § 6), Vorsteuer bleibt.</li>
 <li>Wohnung: steuerbar, steuerfrei (§ 4 Nr. 12a), keine Option möglich (§ 9 Abs. 2).</li>
 <li>Steuerberater: steuerbar, steuerpflichtig 19 %.</li>
 <li>Brötchen zum Mitnehmen: steuerpflichtig 7 % (Anlage 2 UStG).</li></ul>`,
 laws:['§ 1 Abs. 1 Nr. 1 UStG – Tatbestandsmerkmale der Steuerbarkeit','§ 2 Abs. 1 UStG – Unternehmer: selbstständig, nachhaltig, Einnahmeerzielung (keine Gewinnerzielungsabsicht nötig)','§ 3 Abs. 1 UStG – Lieferung; § 3 Abs. 1b – Entnahmen; § 3 Abs. 9 – sonstige Leistung; § 3 Abs. 9a – private Nutzung','§ 3 Abs. 6, 7 UStG – Ort der Lieferung','§ 3a Abs. 1, 2 UStG – Ort der sonstigen Leistung (B2C: Sitz des Leistenden; B2B: Sitz des Empfängers)','§ 4 Nr. 1a, 8, 9a, 12a, 14a UStG – wichtigste Befreiungen','§ 12 Abs. 2 Nr. 1 UStG, Anlage 2 – 7 % für Lebensmittel, Bücher, Zeitungen'],
 example:`<p>Die fünf Merkmale der Steuerbarkeit als Checkliste: <b>L</b>ieferung oder sonstige Leistung – <b>U</b>nternehmer – <b>I</b>nland – <b>E</b>ntgelt – im <b>R</b>ahmen des Unternehmens. Fehlt eines (Privatverkauf: kein Unternehmer), ist das UStG gar nicht anwendbar. Sind alle erfüllt, geht es weiter mit der Frage nach der Befreiung.</p>`,
 traps:['Nicht steuerbar vs. steuerfrei: Privatverkauf ist nicht steuerbar; Arzt/Vermieter/Export sind steuerbar, aber steuerfrei.','Entnahmen aus dem Unternehmen werden wie Verkäufe besteuert, wenn Vorsteuer gezogen wurde.']
},
{
 id:'ust-09', topic:'ust', title:'Steuersätze: 19 % oder 7 %?', diff:1, points:2, exam:false,
 source:'Skript 5.5',
 text:`<p>Ordne den ermäßigten Steuersatz (7 %) zu.</p>`,
 parts:[
  {type:'multi', q:'Dem ermäßigten Steuersatz von 7 % unterliegen:', options:['Pizza vom Lieferservice (Lebensmittel)','Fachbuch Steuerrecht','Milchmischgetränk mit 80 % Milchanteil','Energydrink','Zahnprothese (Körperersatzstück)','Hotelübernachtung','Beratungsleistung eines Steuerberaters','Kinokarte'], correct:[0,1,2,4,5,7]}
 ],
 solution:`<p>7 % (§ 12 Abs. 2 UStG): Lebensmittel und Lebensmittelzubereitungen (Anlage 2 – auch Pizza zum Mitnehmen), Bücher/Zeitungen/E-Books, Milch und Milchmischgetränke ab 75 % Milchanteil, Körperersatzstücke, Beherbergung (Nr. 11), kulturelle Leistungen wie Kino/Theater/Museum (Nr. 7), ÖPNV (Nr. 10), Kunst. <br>19 %: Getränke (außer Milch/Wasser-Leitungsnetz), Energydrinks, Dienstleistungen (Beratung, Handwerk), Luxusgüter. Hinweis: Für Speisen in der Gastronomie galt 2020–2023 vorübergehend 7 %; ab 2026 ist laut Koalitionsbeschluss wieder 7 % vorgesehen – im Zweifel die aktuelle Gesetzeslage im Steuergesetzbuch prüfen.</p>`,
 laws:['§ 12 Abs. 1 UStG – Regelsteuersatz 19 %','§ 12 Abs. 2 Nr. 1 UStG i.V.m. Anlage 2 – Lebensmittel, Bücher, Kunst','§ 12 Abs. 2 Nr. 7 UStG – Theater, Konzerte, Museen, Kino','§ 12 Abs. 2 Nr. 10 UStG – Personennahverkehr','§ 12 Abs. 2 Nr. 11 UStG – Beherbergung','§ 12 Abs. 2 Nr. 15 UStG – Restaurant- und Verpflegungsdienstleistungen (zeitlich geregelt)'],
 example:`<p>Faustregel: Dinge des täglichen Grundbedarfs und Kultur sind ermäßigt, Dienstleistungen und Getränke voll. Die berühmten Kuriositäten: Babynahrung 7 %, Babywindeln 19 %; Trüffel 7 %, Mineralwasser 19 %; Hundefutter 7 %, Katzenstreu 19 %.</p>`,
 traps:['Getränke grundsätzlich 19 % – Ausnahme Milch(mischgetränke ≥ 75 % Milch) und Leitungswasser.','Lebensmittel zum Mitnehmen 7 %; Verzehr vor Ort war Dienstleistung (19 %, mit zeitweisen Ausnahmen).']
},
{
 id:'ust-10', topic:'ust', title:'Innergemeinschaftliche Lieferung und Ausfuhr – Fälle aus dem Skript', diff:2, points:4, exam:false,
 source:'Skript 5.4 (Türkischer Arbeiter / Italiener bei P&C)',
 text:`<p>Fall 1: Ein türkischer Arbeitnehmer von Mercedes (Wohnsitz Stuttgart) kauft vor dem Heimaturlaub bei Media Markt einen Fernseher, den er in die Türkei mitnimmt. Er möchte keine USt zahlen.<br>
 Fall 2: Ein italienischer Tourist (Privatperson) kauft bei P&C in Mannheim fünf Anzüge und nimmt sie nach Italien mit.<br>
 Fall 3: Ein italienischer Modehändler (Unternehmer mit USt-IdNr.) bestellt bei P&C 50 Anzüge für seinen Laden in Mailand; P&C versendet sie nach Italien.</p>`,
 parts:[
  {type:'multi', q:'Richtig sind:', options:['Fall 1: steuerfreie Ausfuhrlieferung, da der Fernseher ins Drittland gelangt.','Fall 1: steuerpflichtig, weil der Käufer seinen Wohnort im Inland hat und damit kein „ausländischer Abnehmer“ ist (§ 6 Abs. 2 UStG).','Fall 2: steuerfreie innergemeinschaftliche Lieferung.','Fall 2: steuerpflichtig in Deutschland (19 %), da der Abnehmer kein Unternehmer ist (Ursprungslandprinzip bei Privatpersonen).','Fall 3: steuerfreie innergemeinschaftliche Lieferung (§ 4 Nr. 1b, § 6a UStG); der Mailänder Händler versteuert den innergemeinschaftlichen Erwerb in Italien.','Fall 3: P&C muss die Lieferung in der Zusammenfassenden Meldung (§ 18a UStG) angeben.'], correct:[1,3,4,5]}
 ],
 solution:`<ul class="tight">
 <li><b>Fall 1:</b> Ausfuhr durch den Abnehmer (§ 6 Abs. 1 Nr. 2) setzt einen <i>ausländischen Abnehmer</i> voraus (Wohnort im Ausland, § 6 Abs. 2 Nr. 1). Wohnort Stuttgart → nein → steuerpflichtig 19 %.</li>
 <li><b>Fall 2:</b> Innerhalb der EU gilt für Privatpersonen das Ursprungslandprinzip: deutsche USt. Keine Befreiung, weil der Abnehmer kein Unternehmer ist (§ 6a Abs. 1 Nr. 2).</li>
 <li><b>Fall 3:</b> Alle Voraussetzungen des § 6a: Beförderung ins übrige Gemeinschaftsgebiet, Abnehmer Unternehmer mit gültiger USt-IdNr., Erwerb unterliegt in Italien der Erwerbsbesteuerung (§ 1a UStG dort) → steuerfrei (§ 4 Nr. 1b). Pflichten: Buch- und Belegnachweis (§ 17a ff. UStDV), Rechnung mit Hinweis und beiden USt-IdNrn. (§ 14a UStG), Zusammenfassende Meldung (§ 18a).</li></ul>`,
 laws:['§ 4 Nr. 1a, § 6 UStG – Ausfuhrlieferung (Drittland)','§ 6 Abs. 2 UStG – ausländischer Abnehmer = Wohnort/Sitz im Ausland','§ 4 Nr. 1b, § 6a UStG – innergemeinschaftliche Lieferung (EU, Unternehmer, USt-IdNr.)','§ 1 Abs. 1 Nr. 5, § 1a UStG – innergemeinschaftlicher Erwerb beim Abnehmer (Bestimmungsland)','§ 3c UStG – Fernverkauf an Privatpersonen in der EU (ab 10.000 € Bestimmungsland, OSS)','§ 18a UStG – Zusammenfassende Meldung','§ 6a Abs. 4 UStG – Vertrauensschutz bei falschen Angaben des Abnehmers'],
 example:`<p>Drei Fragen entscheiden: <b>Wohin</b> geht die Ware (Drittland oder EU)? <b>Wer</b> kauft (Unternehmer oder Privatperson)? <b>Wo wohnt</b> der Käufer? Drittland + Privatperson mit Auslandswohnsitz → frei (Tax-free-Shopping). EU + Unternehmer → frei (ig Lieferung). EU + Privatperson → deutsche USt (außer Versandhandel über Schwelle). Inlandswohnsitz → immer deutsche USt.</p>`,
 traps:['Ausländischer Abnehmer = Wohnsitz im Ausland, nicht Staatsangehörigkeit!','EU-Privatkunden zahlen deutsche USt; EU-Unternehmer bekommen die Ware steuerfrei.']
},
{
 id:'ust-11', topic:'ust', title:'Besteuerungsverfahren: Soll/Ist, Voranmeldung, Kleinunternehmer', diff:2, points:3, exam:false,
 source:'Skript 5.7',
 text:`<p>Verfahrensfragen zur Umsatzsteuer (Rechtsstand 2026).</p>`,
 parts:[
  {type:'multi', q:'Richtig sind:', options:['Grundsatz ist die Sollbesteuerung: Die USt entsteht mit Ablauf des Voranmeldungszeitraums, in dem die Leistung ausgeführt wurde (§ 13 Abs. 1 Nr. 1a UStG).','Die Istbesteuerung (nach vereinnahmten Entgelten) kann beantragt werden, wenn der Vorjahresumsatz 800.000 € nicht überstieg (§ 20 UStG).','Bei einer USt-Zahllast des Vorjahres über 9.000 € sind monatliche Voranmeldungen abzugeben, sonst vierteljährlich; bis 2.000 € kann das FA von Voranmeldungen befreien (§ 18 Abs. 2 UStG).','Kleinunternehmer (Vorjahresumsatz ≤ 25.000 €, laufendes Jahr ≤ 100.000 €) weisen keine USt aus und haben keinen Vorsteuerabzug (§ 19 UStG).','Anzahlungen werden erst mit Leistungsausführung besteuert.','Die Voranmeldung ist bis zum 10. Tag nach Ablauf des Voranmeldungszeitraums elektronisch zu übermitteln.'], correct:[0,1,2,3,5]}
 ],
 solution:`<p>E ist falsch: Anzahlungen werden bereits bei Vereinnahmung besteuert („Mindest-Istbesteuerung“, § 13 Abs. 1 Nr. 1a S. 4 UStG). Alle anderen Aussagen sind richtig. Die Umsatzsteuer ist eine <b>Anmeldesteuer</b>: Der Unternehmer berechnet sie selbst (§ 18 UStG, § 150 Abs. 1 S. 3 AO), die Steueranmeldung steht einer Steuerfestsetzung unter Vorbehalt der Nachprüfung gleich (§ 168 AO). Zusätzlich ist eine Jahreserklärung abzugeben (§ 18 Abs. 3 UStG). Dauerfristverlängerung um einen Monat gegen Sondervorauszahlung (1/11) möglich (§§ 46–48 UStDV).</p>`,
 laws:['§ 13 Abs. 1 Nr. 1a UStG – Entstehung bei Sollbesteuerung; Anzahlungen','§ 16 UStG – Berechnung (USt − Vorsteuer = Zahllast)','§ 18 Abs. 1, 2 UStG – Voranmeldung (monatlich > 9.000 €, vierteljährlich, Befreiung ≤ 2.000 €)','§ 18 Abs. 3 UStG – Jahreserklärung','§ 19 UStG – Kleinunternehmer 25.000 € / 100.000 € (seit 2025)','§ 20 UStG – Istbesteuerung bis 800.000 € Vorjahresumsatz','§ 167, 168 AO – Steueranmeldung = Festsetzung unter Vorbehalt der Nachprüfung','§ 24 UStG – Durchschnittssätze Land- und Forstwirte'],
 example:`<p>Soll = „wenn die Rechnung geschrieben ist“ (du musst die USt ans Finanzamt zahlen, auch wenn der Kunde noch nicht bezahlt hat – Liquiditätsnachteil). Ist = „wenn das Geld da ist“ (für Kleinere und Freiberufler). Kleinunternehmer sind ganz raus: Sie behandeln die USt wie ein Privatmann – nichts ausweisen, nichts zurückholen.</p>`,
 traps:['Kleinunternehmer dürfen keine USt in der Rechnung ausweisen – sonst schulden sie sie (§ 14c Abs. 2 UStG).','Anzahlungen sofort versteuern (Mindest-Ist).']
}
);

TASKS.push(
{
 id:'son-01', topic:'sonst', title:'Grundstücksverkauf vom Vater an den Sohn (Original 2025)', diff:1, points:2, exam:true,
 source:'Klausur 2025, Aufgabe 9; 2021, Aufgabe 8',
 text:`<p>Der Verkauf eines vermieteten Grundstücks vom Vater an den Sohn ist …</p>`,
 parts:[
  {type:'multi', q:'Zutreffend:', options:['grunderwerbsteuerpflichtig','grunderwerbsteuerfrei','umsatzsteuerpflichtig','umsatzsteuerfrei'], correct:[1,3]}
 ],
 solution:`<p><b>Grunderwerbsteuer:</b> Der Kaufvertrag ist ein steuerbarer Erwerbsvorgang (§ 1 Abs. 1 Nr. 1 GrEStG), aber <b>befreit</b>, weil Vater und Sohn in gerader Linie verwandt sind (§ 3 Nr. 6 GrEStG). Die Befreiung gilt auch bei entgeltlichem Verkauf.</p>
 <p><b>Umsatzsteuer:</b> Der Vater ist durch die Vermietung Unternehmer (§ 2 UStG), der Verkauf ist daher steuerbar, aber steuerfrei nach § 4 Nr. 9a UStG (Umsätze, die unter das GrEStG fallen). Eine Option (§ 9) wäre nur möglich, wenn der Sohn Unternehmer ist und das Grundstück unternehmerisch nutzt. Ist der Vater Privatvermieter ohne weitere Tätigkeit, ist die Vermietung dennoch unternehmerisch im Sinne des UStG (Nachhaltigkeit genügt).</p>`,
 laws:['§ 1 Abs. 1 Nr. 1 GrEStG – Kaufvertrag über inländisches Grundstück','§ 3 Nr. 6 GrEStG – Erwerb durch Verwandte in gerader Linie (Kinder, Enkel, Eltern) steuerfrei','§ 3 Nr. 4 GrEStG – Erwerb durch den Ehegatten steuerfrei','§ 3 Nr. 1 GrEStG – Freigrenze 2.500 €','§ 3 Nr. 2 GrEStG – Erwerb von Todes wegen / Schenkung (dann ErbSt)','§ 4 Nr. 9a UStG – Grundstücksumsätze umsatzsteuerfrei','§ 9 Abs. 1, 3 UStG – Option nur im notariellen Vertrag'],
 example:`<p>Der Staat will nicht zweimal kassieren: Grundstücksgeschäfte unterliegen der Grunderwerbsteuer, deshalb sind sie von der USt befreit. Und innerhalb der Familie (gerade Linie: Großeltern – Eltern – Kinder – Enkel) soll der Wechsel des Grundstücks steuerlich nicht behindert werden. Geschwister sind aber Seitenlinie → steuerpflichtig!</p>`,
 traps:['Gerade Linie (Eltern/Kinder) frei, Seitenlinie (Geschwister, Onkel/Nichte) NICHT frei.','Steuerbar, aber steuerfrei – bei beiden Steuerarten.']
},
{
 id:'son-02', topic:'sonst', title:'Grunderwerbsteuer berechnen', diff:1, points:3, exam:false,
 source:'Skript 7. Grunderwerbsteuer',
 text:`<p>K kauft in Mannheim (Baden-Württemberg) eine Eigentumswohnung für 500.000 €. Zusätzlich übernimmt er die mitverkaufte Einbauküche für 20.000 € (im Kaufvertrag gesondert ausgewiesen). Maklerkosten 15.000 €.</p>`,
 parts:[
  {type:'num', q:'Grunderwerbsteuer in Baden-Württemberg (€)', answer:25000, tol:1},
  {type:'multi', q:'Richtig sind:', options:['Bemessungsgrundlage ist die Gegenleistung, also der Kaufpreis (§ 8 Abs. 1, § 9 GrEStG).','Die Einbauküche (bewegliches Inventar) gehört nicht zur Bemessungsgrundlage.','Die Maklerkosten des Käufers erhöhen die Bemessungsgrundlage.','Steuerschuldner sind Käufer und Verkäufer als Gesamtschuldner (§ 13 Nr. 1 GrEStG); vertraglich trägt sie meist der Käufer.','Der Steuersatz beträgt bundeseinheitlich 3,5 %.','Das Grundbuchamt trägt den Käufer erst nach Vorlage der Unbedenklichkeitsbescheinigung des Finanzamts ein (§ 22 GrEStG).'], correct:[0,1,3,5]}
 ],
 solution:`<p>GrESt = 500.000 € × 5 % (BW) = <b>25.000 €</b>. Die Einbauküche ist kein Grundstücksbestandteil (bewegliche Sache) und wird nicht einbezogen, wenn sie gesondert ausgewiesen ist. Maklerkosten des Käufers sind keine Gegenleistung an den Verkäufer. Der gesetzliche Satz von 3,5 % (§ 11 GrEStG) gilt nur noch in Bayern; die Länder dürfen abweichen (Art. 105 Abs. 2a GG): BW 5 %, NRW/SH/Saarland/Brandenburg/Thüringen 6,5 %, Hamburg/Hessen/Berlin 6 %, Sachsen 5,5 % usw.</p>`,
 laws:['§ 1 GrEStG – Erwerbsvorgänge (Kaufvertrag, Meistgebot, Anteilsvereinigung ≥ 90 %)','§ 2 GrEStG – Grundstücke (inkl. Gebäude, ohne Betriebsvorrichtungen/Inventar)','§ 8, § 9 GrEStG – Bemessungsgrundlage Gegenleistung','§ 11 GrEStG – 3,5 %, Länder dürfen abweichen (BW 5 %)','§ 13 GrEStG – Steuerschuldner: beide Vertragsteile','§ 18, 19 GrEStG – Anzeigepflicht Notar/Beteiligte','§ 22 GrEStG – Unbedenklichkeitsbescheinigung'],
 example:`<p>Praxis-Tipp, den jeder Bankberater kennt: Bewegliches Zubehör (Küche, Möbel, Sauna, Markise) im Kaufvertrag separat ausweisen – das spart 5 % GrESt darauf. Aber realistisch bewerten, sonst nimmt das Finanzamt es als Gestaltungsmissbrauch (§ 42 AO).</p>`,
 traps:['Der „gesetzliche“ Satz 3,5 % gilt praktisch nirgends mehr außer Bayern – BW: 5 %.','Beide sind Steuerschuldner – das Finanzamt kann sich auch an den Verkäufer halten, wenn der Käufer nicht zahlt.']
},
{
 id:'son-03', topic:'sonst', title:'Grundsteuer berechnen (neues Recht ab 2025)', diff:2, points:3, exam:true,
 source:'Skript Grundsteuer; Klausur 2010, Aufgabe 15 (Altrecht)',
 text:`<p>a) Baden-Württemberg (Landesmodell, nur Grund und Boden): Grundstück 500 m², Bodenrichtwert 800 €/m², Steuermesszahl nach Abschlag für Wohnnutzung 0,91 ‰, Hebesatz der Gemeinde 400 %.<br>
 b) Altrecht (bis 2024) zum Vergleich: Mehrfamilienhaus mit Einheitswert 1.000.000 € (Verkehrswert 6.000.000 €), Steuermesszahl 3,5 ‰, Hebesatz 200 %.</p>`,
 parts:[
  {type:'num', q:'a) Jährliche Grundsteuer (€)', answer:1456, tol:1},
  {type:'num', q:'b) Jährliche Grundsteuer nach Altrecht (€)', answer:7000, tol:1},
  {type:'single', q:'Wer ist Steuergläubiger der Grundsteuer?', options:['Bund','Land','Gemeinde'], correct:[2]}
 ],
 solution:`<table class="calc">
 <tr><td>a) Grundsteuerwert = 500 m² × 800 €</td><td class="n">400.000</td><td class="ref">§ 38 LGrStG BW (Bodenwertmodell)</td></tr>
 <tr><td>× Steuermesszahl 0,91 ‰ (1,3 ‰ − 30 % für Wohnen)</td><td class="n">364</td><td class="ref">§ 40 LGrStG BW</td></tr>
 <tr><td>× Hebesatz 400 %</td><td class="n">1.456 €</td><td class="ref">§ 25 GrStG</td></tr>
 <tr><td>b) Einheitswert 1.000.000 × 3,5 ‰ = 3.500 Messbetrag × 200 %</td><td class="n">7.000 €</td><td class="ref">§§ 13, 15, 25 GrStG a.F.</td></tr></table>
 <p>Der Verkehrswert (6 Mio.) spielte im Altrecht keine Rolle – genau das hat das Bundesverfassungsgericht 2018 beanstandet. Seit 2025 gelten neue Grundsteuerwerte (Bundesmodell: Ertrags-/Sachwert, Messzahl 0,31 ‰ Wohnen / 0,34 ‰ sonst) bzw. Ländermodelle (BW: nur Bodenwert). Das Schema bleibt dreistufig: <b>Wert × Messzahl = Messbetrag (Finanzamt) × Hebesatz = Grundsteuer (Gemeinde)</b>. Die Grundsteuer ist bei Vermietung als Werbungskosten (§ 9 EStG) bzw. im Betrieb als Betriebsausgabe abziehbar und auf Mieter umlegbar.</p>`,
 laws:['§ 1 GrStG – Gemeindesteuer (Heberecht)','§ 2 GrStG – Steuergegenstand: inländischer Grundbesitz (Grundsteuer A land- und forstwirtschaftlich, B übrige Grundstücke)','§ 3–6 GrStG – Befreiungen (öffentliche Hand, Kirchen, gemeinnützige Zwecke)','§ 13 GrStG – Steuermessbetrag = Grundsteuerwert × Messzahl','§ 15 GrStG – Steuermesszahlen (Bundesmodell 0,31 ‰ / 0,34 ‰)','§ 25 GrStG – Hebesatz der Gemeinde','§ 27 GrStG – Festsetzung für das Kalenderjahr, Fälligkeit vierteljährlich (§ 28)','§§ 218 ff. BewG – Grundsteuerwerte ab 2025; LGrStG BW – Landesmodell'],
 example:`<p>Grundsteuer und Gewerbesteuer sind Geschwister: Beide sind Realsteuern mit dem Dreischritt Bemessungsgrundlage × Messzahl × Hebesatz, beide gehen an die Gemeinde, bei beiden setzt das Finanzamt den Messbetrag fest und die Gemeinde den Steuerbescheid. Unterschied: Grundsteuer ist abziehbar, Gewerbesteuer nicht.</p>`,
 traps:['Grundsteuer (Besitz, jährlich, abziehbar) nicht mit Grunderwerbsteuer (Erwerb, einmalig, Anschaffungsnebenkosten) verwechseln.','Messzahl in Promille (‰), Hebesatz in Prozent (%).']
},
{
 id:'son-04', topic:'sonst', title:'Erbschaftsteuer: Freibeträge und Steuerklassen', diff:2, points:4, exam:false,
 source:'Skript 6. Erbschaft- und Schenkungsteuer (Überblick)',
 text:`<p>Großvater G stirbt 2026 und hinterlässt seinem Sohn S Bankguthaben von 600.000 €, seiner Enkelin E 250.000 €, seiner Lebensgefährtin L 100.000 € und seinem Bruder B 50.000 €. Hausrat bleibt außer Betracht. S hatte vor 6 Jahren bereits 100.000 € von G geschenkt bekommen.</p>`,

  {type:'num', q:'Erbschaftsteuer des S (Steuerklasse I, Satz bis 300.000 €: 11 %) (€)', answer:33000, tol:1},

 ],
 solution:`<table class="calc">
 <tr><td>S: Erwerb 600.000 + Vorschenkung innerhalb 10 Jahren 100.000</td><td class="n">700.000</td><td class="ref">§ 14 ErbStG</td></tr>
 <tr><td>./. Freibetrag Kind (Steuerklasse I)</td><td class="n">− 400.000</td><td class="ref">§ 16 Abs. 1 Nr. 2 ErbStG</td></tr>
 <tr><td>Steuerpflichtiger Erwerb</td><td class="n">300.000</td><td class="ref">§ 10 ErbStG</td></tr>

 <tr><td>B: 50.000 − 20.000 = 30.000 × 15 %</td><td class="n">4.500 €</td><td class="ref">Klasse II</td></tr></table>
 <p><b>Steuerklassen (§ 15):</b> I = Ehegatte, Kinder, Enkel, Eltern (bei Erbfall); II = Geschwister, Nichten/Neffen, Schwiegerkinder, geschiedener Ehegatte, Eltern (bei Schenkung); III = alle übrigen (auch Lebensgefährten!). <b>Freibeträge (§ 16):</b> Ehegatte 500.000, Kinder 400.000, Enkel 200.000, Eltern (Erbfall) 100.000, Klasse II und III 20.000. <b>Sätze (§ 19):</b> Klasse I 7–30 %, II 15–43 %, III 30–50 %.</p>`,
 laws:['§ 1 ErbStG – Erwerb von Todes wegen, Schenkung, Zweckzuwendung, Stiftungsvermögen','§ 2 ErbStG – persönliche Steuerpflicht (Inländer)','§ 9 ErbStG – Entstehung mit dem Tod bzw. der Ausführung der Schenkung','§ 10 ErbStG – steuerpflichtiger Erwerb (Bereicherung)','§ 13 ErbStG – sachliche Befreiungen (Hausrat 41.000 € in Klasse I, Familienheim)','§ 13a, 13b ErbStG – Verschonung von Betriebsvermögen (85 % / 100 %)','§ 14 ErbStG – Zusammenrechnung von Erwerben innerhalb 10 Jahren','§ 15 ErbStG – Steuerklassen','§ 16 ErbStG – persönliche Freibeträge','§ 17 ErbStG – Versorgungsfreibetrag (Ehegatte 256.000 €, Kinder gestaffelt)','§ 19 ErbStG – Steuersätze 7–50 %','§ 30, 33 ErbStG – Anzeigepflichten (Erwerber, Banken!)'],
 example:`<p>Die Erbschaftsteuer ist wie ein Familientarif: Je näher verwandt, desto größer der Freibetrag und desto niedriger der Satz. Der Lebensgefährte ohne Trauschein ist steuerlich ein Fremder (Klasse III) – ein häufiger Beratungsanlass in der Bank. Und die 10-Jahres-Regel verhindert, dass man den Freibetrag durch viele kleine Schenkungen mehrfach nutzt – alle 10 Jahre gibt es ihn aber tatsächlich neu.</p>`,

},

 <tr class="sum"><td>× 400 %</td><td class="n">570.500 €</td><td class="ref">§ 16 GewStG</td></tr></table>
 <p>Konsequenz für den Jahresabschluss: KSt-Rückstellung 500.000 € (600.000 − 100.000) und GewSt-Rückstellung 490.500 € (570.500 − 80.000) zuzüglich Soli.</p>
 <p><b>3. Einkommen des A</b></p>
 <table class="calc">
 <tr><td>GF-Vergütung OHG 12 × 10.000 = Einkünfte aus Gewerbebetrieb (Sondervergütung, kein AN-Pauschbetrag)</td><td class="n">120.000</td><td class="ref">§ 15 Abs. 1 S. 1 Nr. 2 EStG</td></tr>
 <tr><td>Dividende 7.500 netto = 10.000 brutto: Abgeltungsteuer, nicht im Einkommen</td><td class="n">0</td><td class="ref">§ 2 Abs. 5b, § 32d, § 43 Abs. 5 EStG</td></tr>
 <tr><td>= Gesamtbetrag der Einkünfte</td><td class="n">120.000</td><td class="ref">§ 2 Abs. 3 EStG</td></tr>
 <tr><td>./. Sonderausgaben</td><td class="n">− 10.000</td><td class="ref">§ 10 EStG</td></tr>
 <tr class="sum"><td>Einkommen</td><td class="n">110.000 €</td><td class="ref">§ 2 Abs. 4 EStG</td></tr></table>
 <p>Eine Günstigerprüfung (§ 32d Abs. 6) würde sich bei 110.000 € Einkommen (Grenzsteuersatz 42 %) nicht lohnen; die 2.500 € KapESt bleiben abgeltend. A erhält zusätzlich § 35 EStG anteilig für die GewSt der OHG.</p>`,
 laws:['§ 8 Abs. 1, § 10 Nr. 2, 4, § 23 KStG','§ 4 Abs. 5 Nr. 2, Abs. 5b EStG','§ 7, § 8 Nr. 1, § 11, § 16 GewStG','§ 15 Abs. 1 S. 1 Nr. 2 EStG','§ 2 Abs. 3, 4, 5b EStG','§ 32d, § 43 Abs. 5 EStG','§ 10 EStG','§ 35 EStG'],
 example:`<p>Dieser Fall vereint die drei großen Rechenketten der Klausur: KSt-Korrekturen, GewSt-Hinzurechnungen und das ESt-Schema. Zeitplan in der Klausur: 8 Minuten KSt, 7 Minuten GewSt, 5 Minuten Aktionär. Schreibe die Paragrafen daneben – „Rechtsgrundlagen sind anzugeben“ bringt eigene Punkte.</p>`,
 traps:['Mieten und Zinsen bei der KSt nicht korrigieren, bei der GewSt aber hinzurechnen.','Der KSt-Gewinn (4.000.000) ist Ausgangspunkt für die GewSt – nicht der Jahresüberschuss (3.720.000).','GF-Vergütung aus der OHG ist § 15, nicht § 19 – kein Arbeitnehmer-Pauschbetrag, keine Lohnsteuer.','Dividende bleibt außerhalb des Einkommens (Abgeltungsteuer).']
},
{
 id:'fall-02', topic:'fall', title:'Belastungsvergleich: Personenunternehmen (§ 34a EStG) vs. Kapitalgesellschaft', diff:3, points:6, exam:true,
 source:'Klausur 2010, Aufgaben 19/20; Skript 2.3 Tabelle § 34a EStG',
 text:`<p>Stelle die Steuerbelastung eines Gewinns von 100 € gegenüber: (A) Personenunternehmen mit Thesaurierungsbegünstigung § 34a EStG und späterer Entnahme, (B) Kapitalgesellschaft mit späterer Ausschüttung. Gewerbesteuer: Hebesatz 380 % → 13,30 € Belastung bzw. 13,30 € Anrechnung (ohne Freibetrag). Soli 5,5 %. Rechne mit zwei Nachkommastellen.</p>`,
 parts:[
  {type:'num', q:'(B) Kapitalgesellschaft: Belastung auf Unternehmensebene (KSt 15 % + Soli + GewSt) in €', answer:29.13, tol:0.05},
  {type:'num', q:'(B) Ausschüttungsbetrag nach Unternehmenssteuern (€)', answer:70.87, tol:0.05},
  {type:'num', q:'(B) KapESt 25 % + Soli auf die Ausschüttung (€)', answer:18.68, tol:0.05},
  {type:'num', q:'(B) Gesamtbelastung Kapitalgesellschaft (€)', answer:47.81, tol:0.1},
  {type:'num', q:'(A) Personenunternehmen: Belastung bei Thesaurierung (ESt 28,25 % + Soli + GewSt − Anrechnung) in €', answer:29.80, tol:0.05},
  {type:'num', q:'(A) Gesamtbelastung nach Nachversteuerung (25 % + Soli auf 70,20) in €', answer:48.31, tol:0.1}
 ],
 solution:`<table class="calc">
 <tr><th></th><th class="n">Personenunternehmen § 34a</th><th class="n">Kapitalgesellschaft</th></tr>
 <tr><td>Gewinn</td><td class="n">100,00</td><td class="n">100,00</td></tr>
 <tr><td>ESt 28,25 % (§ 34a) / KSt 15 %</td><td class="n">− 28,25</td><td class="n">− 15,00</td></tr>
 <tr><td>Soli 5,5 % darauf</td><td class="n">− 1,55</td><td class="n">− 0,83</td></tr>
 <tr><td>GewSt (380 %)</td><td class="n">− 13,30</td><td class="n">− 13,30</td></tr>
 <tr><td>Anrechnung § 35 EStG</td><td class="n">+ 13,30</td><td class="n">–</td></tr>
 <tr class="sub"><td>Gewinn nach Steuern / Belastung Stufe 1</td><td class="n">70,20 / 29,80</td><td class="n">70,87 / 29,13</td></tr>
 <tr><td>Entnahme / Ausschüttung</td><td class="n">70,20</td><td class="n">70,87</td></tr>
 <tr><td>Nachsteuer 25 % (§ 34a Abs. 4) / KapESt 25 %</td><td class="n">− 17,55</td><td class="n">− 17,72</td></tr>
 <tr><td>Soli 5,5 %</td><td class="n">− 0,96</td><td class="n">− 0,97</td></tr>
 <tr class="sum"><td>Gesamtbelastung</td><td class="n">48,31</td><td class="n">47,81</td></tr></table>
 <p>Ergebnis: Durch § 34a EStG wird das Personenunternehmen bei Thesaurierung fast gleich belastet wie eine Kapitalgesellschaft (29,80 vs. 29,13). Ohne § 34a läge der Einzelunternehmer mit Spitzensteuersatz 42 % + Soli − § 35 bei ca. 44,3 % sofort. Der Thesaurierungssatz sinkt 2028/29 auf 27 %, 2030/31 auf 26 %, ab 2032 auf 25 % – parallel zur KSt-Senkung auf 10 %.</p>`,
 laws:['§ 34a Abs. 1 EStG – Begünstigung nicht entnommener Gewinne, Steuersatz 28,25 %','§ 34a Abs. 4 EStG – Nachversteuerung 25 % bei späterer Entnahme','§ 35 EStG – GewSt-Anrechnung (Faktor 4,0; hier 13,30 bei 380 %)','§ 23 KStG – 15 %','§ 32d, § 43a EStG – KapESt 25 % auf Ausschüttungen','SolZG – 5,5 %'],
 example:`<p>Der Gesetzgeber will Rechtsformneutralität: Ob du dein Unternehmen als GmbH oder als Einzelfirma führst, soll die Steuer möglichst nicht entscheiden. Bei Gewinnen, die im Unternehmen bleiben, gelingt das mit § 34a fast perfekt. Bei vollständiger Entnahme ist der Einzelunternehmer mit normalem Tarif besser dran, als erst 28,25 % und dann noch 25 % zu zahlen – § 34a lohnt sich also nur für dauerhaft thesaurierte Gewinne bei Spitzenverdienern.</p>`,
 traps:['Die GewSt wird beim Personenunternehmen über § 35 angerechnet, bei der KapG ist sie Definitivbelastung.','Die Nachversteuerung (25 %) kommt zur Thesaurierungssteuer hinzu – nicht statt ihrer.']
},
{
 id:'fall-03', topic:'fall', title:'Schema des zu versteuernden Einkommens in 4 Schritten', diff:1, points:10, exam:true,
 source:'Klausur 2022, Aufgabe 7 (10 Punkte)',
 text:`<p>Stellen Sie bitte das Schema zur Ermittlung des zu versteuernden Einkommens in 4 Schritten dar.</p>`,
 parts:[
  {type:'self', q:'Schema aufschreiben, dann Musterlösung vergleichen', model:`<div class="schema">1. Summe der Einkünfte (§ 2 Abs. 1–3 EStG)
   Einkünfte aus Land- und Forstwirtschaft (§ 13)      ┐
   Einkünfte aus Gewerbebetrieb (§ 15)                 ├ Gewinneinkünfte (§ 2 Abs. 2 Nr. 1)
   Einkünfte aus selbständiger Arbeit (§ 18)           ┘
   Einkünfte aus nichtselbständiger Arbeit (§ 19)      ┐
   (Einkünfte aus Kapitalvermögen (§ 20) – i.d.R. Abgeltung) ├ Überschusseinkünfte (§ 2 Abs. 2 Nr. 2)
   Einkünfte aus Vermietung und Verpachtung (§ 21)     │
   Sonstige Einkünfte (§ 22)                           ┘
   = Summe der Einkünfte
   − Altersentlastungsbetrag (§ 24a), Entlastungsbetrag Alleinerziehende (§ 24b)
   = Gesamtbetrag der Einkünfte (§ 2 Abs. 3)

2. Abzug von Sonderausgaben (§§ 10, 10a, 10b, 10c) und
   außergewöhnlichen Belastungen (§§ 33, 33a, 33b)

3. Abzug von Verlusten (Verlustabzug § 10d: Rücktrag / Vortrag)
   = Einkommen (§ 2 Abs. 4)

4. − Kinderfreibeträge (§ 32 Abs. 6), Härteausgleich (§ 46 Abs. 3)
   = zu versteuerndes Einkommen (§ 2 Abs. 5)
   × Tarif (§ 32a: Grund-/Splittingtabelle) = tarifliche ESt
   − Ermäßigungen (§ 35 GewSt, § 35a Handwerker) = festzusetzende ESt
   − Vorauszahlungen, LSt, KapESt (§ 36 Abs. 2) = Nachzahlung / Erstattung</div>
 <p>Hinweis: Im Gesetz (§ 2 Abs. 4) wird der Verlustabzug <i>vor</i> den Sonderausgaben vom GdE abgezogen (§ 10d Abs. 1: „vorrangig vor Sonderausgaben“). Die Klausur 2022 akzeptierte die Reihenfolge 1. Summe der Einkünfte, 2. Sonderausgaben, 3. Verluste, 4. zvE.</p>`},
  {type:'multi', q:'Welche Einkunftsarten sind Gewinneinkünfte?', options:['Land- und Forstwirtschaft','Gewerbebetrieb','Selbständige Arbeit','Nichtselbständige Arbeit','Kapitalvermögen','Vermietung und Verpachtung','Sonstige Einkünfte'], correct:[0,1,2]}
 ],
 solution:`<p>Gewinneinkünfte (§ 2 Abs. 2 Nr. 1 EStG): §§ 13, 15, 18 – Einkünfte = Gewinn (Betriebsvermögensvergleich oder EÜR). Überschusseinkünfte (§ 2 Abs. 2 Nr. 2): §§ 19–22 – Einkünfte = Einnahmen − Werbungskosten. Merkhilfe: Die ersten drei sind „Unternehmer“, die letzten vier „Privatpersonen“.</p>`,
 laws:['§ 2 Abs. 1 EStG – 7 Einkunftsarten','§ 2 Abs. 2 EStG – Gewinn- und Überschusseinkünfte','§ 2 Abs. 3 EStG – Gesamtbetrag der Einkünfte','§ 2 Abs. 4 EStG – Einkommen (nach Verlustabzug, Sonderausgaben, agB)','§ 2 Abs. 5 EStG – zu versteuerndes Einkommen','§ 2 Abs. 5b EStG – Kapitalerträge mit Abgeltungsteuer bleiben außen vor','§ 32a EStG – Tarif','§ 36 EStG – Anrechnung von Vorauszahlungen, LSt, KapESt'],
 example:`<p>Denke an eine Treppe nach unten: Oben stehen die 7 Einkunftsarten (was du verdient hast), jede Stufe nimmt etwas weg (private Abzüge, alte Verluste, Kinder), unten kommt das zvE heraus, auf das der Tarif angewendet wird. In der Klausur 2022 brachten diese 4 Zeilen 10 Punkte – 20 % der Klausur.</p>`,
 traps:['Kapitalvermögen ist zwar eine Einkunftsart, taucht aber wegen der Abgeltungsteuer normalerweise nicht im Schema auf (§ 2 Abs. 5b).','Sonderausgaben und außergewöhnliche Belastungen sind keine Werbungskosten – sie kommen erst nach dem GdE.']
},
{
 id:'fall-04', topic:'fall', title:'Bankkunde mit Kapitalerträgen: Vom Bruttoertrag zur Steuer (Kombifall)', diff:3, points:6, exam:false,
 source:'Eigener Kombinationsfall (Bankpraxis)',
 text:`<p>Kundin K (ledig, kirchensteuerpflichtig 8 %, Freistellungsauftrag 1.000 € bei dieser Bank) hat 2026 bei ihrer Bank: Zinsen 3.000 €, Dividenden inländischer AGs 4.000 €, Gewinn aus Aktienverkauf 5.000 €, Verlust aus Aktienverkauf 2.000 €, Verlust aus Fondsverkauf 1.000 €, gezahlte Stückzinsen 500 €. Ihr Grenzsteuersatz liegt bei 35 %.</p>`,
 parts:[
  {type:'num', q:'Aktien-Verlusttopf nach Verrechnung mit Aktiengewinnen: verbleibender Aktiengewinn (€)', answer:3000, tol:1},
  {type:'num', q:'Bemessungsgrundlage für die KapESt nach allen Verrechnungen und Freistellungsauftrag (€)', answer:7500, tol:1},
  {type:'num', q:'Kapitalertragsteuer (€, mit KiSt-Ermäßigung: BMG / 4,08)', answer:1838.24, tol:1},
  {type:'single', q:'Lohnt sich die Günstigerprüfung?', options:['Ja, weil der Grenzsteuersatz 35 % über 25 % liegt.','Nein, weil der Grenzsteuersatz 35 % über 25 % liegt – die Abgeltungsteuer ist günstiger.','Ja, weil dann die Depotgebühren abziehbar wären.'], correct:[1]}
 ],
 solution:`<table class="calc">
 <tr><td>Aktiengewinn 5.000 − Aktienverlust 2.000 (Aktientopf)</td><td class="n">3.000</td><td class="ref">§ 20 Abs. 6 S. 4 EStG</td></tr>
 <tr><td>Allgemeiner Topf: Zinsen 3.000 + Dividenden 4.000 − Fondsverlust 1.000 − Stückzinsen 500</td><td class="n">5.500</td><td class="ref">§ 20 Abs. 6 S. 1, § 43a Abs. 3 EStG</td></tr>
 <tr><td>Summe positive Erträge</td><td class="n">8.500</td><td class="ref"></td></tr>
 <tr><td>./. Freistellungsauftrag (Sparer-Pauschbetrag)</td><td class="n">− 1.000</td><td class="ref">§ 20 Abs. 9, § 44a EStG</td></tr>
 <tr class="sub"><td>Bemessungsgrundlage</td><td class="n">7.500</td><td class="ref"></td></tr>
 <tr><td>KapESt = 7.500 / (4 + 0,08)</td><td class="n">1.838,24</td><td class="ref">§ 32d Abs. 1 S. 4 EStG</td></tr>
 <tr><td>KiSt 8 % darauf</td><td class="n">147,06</td><td class="ref">§ 51a Abs. 2b EStG</td></tr>
 <tr><td>Soli 5,5 % der KapESt</td><td class="n">101,10</td><td class="ref">SolZG</td></tr>
 <tr class="sum"><td>Gesamtabzug der Bank</td><td class="n">2.086,40 €</td><td class="ref"></td></tr></table>
 <p>Günstigerprüfung: Bei 35 % Grenzsteuersatz wäre der Tarif teurer als 25 % → kein Antrag. Werbungskosten wären auch bei der Günstigerprüfung nicht abziehbar.</p>`,
 laws:['§ 20 Abs. 6 EStG – Verlustverrechnung (zwei Töpfe)','§ 20 Abs. 9 EStG – Sparer-Pauschbetrag','§ 43a Abs. 3 EStG – Verrechnung durch die Bank','§ 44a EStG – Freistellungsauftrag','§ 32d Abs. 1 EStG – 25 %, Formel mit KiSt','§ 51a Abs. 2b–2e EStG – Kirchensteuer auf KapESt (automatischer Abruf beim BZSt)','§ 32d Abs. 6 EStG – Günstigerprüfung'],
 example:`<p>So sieht die Jahressteuerbescheinigung deiner Bank aus: Erst werden Aktienverluste gegen Aktiengewinne gerechnet, dann alle anderen Verluste gegen alle Erträge, dann wird der Freistellungsauftrag abgezogen, und auf den Rest kommen 25 % (bei Kirchenmitgliedern etwas weniger ESt, dafür KiSt) plus Soli. Alles automatisch – K muss nichts erklären.</p>`,
 traps:['Fondsverluste gehören in den ALLGEMEINEN Topf (nur Aktien-Einzelverluste in den Aktientopf).','Freistellungsauftrag erst nach der Verlustverrechnung anwenden.','Günstigerprüfung nur bei Grenzsteuersatz unter 25 %.']
}
);

 {p:'§ 377–380 AO', t:'Steuerordnungswidrigkeiten', d:'Leichtfertige Steuerverkürzung (§ 378, grobe Fahrlässigkeit, Bußgeld bis 50.000 €), Steuergefährdung (§ 379, falsche Belege), Gefährdung von Abzugsteuern (§ 380, LSt/KapESt).', k:'Abgrenzung Straftat/OWi.'}
]},
{ code:'EStG', name:'Einkommensteuergesetz (EStG)', intro:'Besteuerung natürlicher Personen. Kernstück der Klausur: Einkunftsarten, Schema des zvE, Verlustverrechnung, Kapitalerträge, Mitunternehmer.', items:[
 {p:'§ 1 EStG', t:'Persönliche Steuerpflicht', d:'Abs. 1: unbeschränkt (Wohnsitz/gewöhnlicher Aufenthalt im Inland, Welteinkommen). Abs. 3: fiktive unbeschränkte Steuerpflicht auf Antrag. Abs. 4: beschränkt (nur inländische Einkünfte § 49).', k:'DBA-Aufgaben.'},
 {p:'§ 2 EStG', t:'Umfang der Besteuerung, Schema', d:'Abs. 1: 7 Einkunftsarten. Abs. 2: Gewinneinkünfte (§§ 13, 15, 18) vs. Überschusseinkünfte (§§ 19–22). Abs. 3: Summe = Gesamtbetrag der Einkünfte. Abs. 4: Einkommen (nach Sonderausgaben, agB, Verlustabzug). Abs. 5: zu versteuerndes Einkommen. Abs. 5b: Kapitalerträge mit Abgeltungsteuer bleiben außen vor.', k:'„Peter Müller“-Aufgabe, Schema in 4 Schritten.'},
 {p:'§ 3 EStG', t:'Steuerfreie Einnahmen', d:'Nr. 1 Kranken-/Mutterschaftsgeld; Nr. 2 Arbeitslosen-/Kurzarbeitergeld; Nr. 16 Reisekosten; Nr. 26 Übungsleiter 3.300 €; Nr. 26a Ehrenamt 840 €; Nr. 33 Kinderbetreuung; Nr. 34 Gesundheitsförderung 600 €; Nr. 38 Sachprämien 1.080 €; Nr. 39 Mitarbeiterbeteiligung 2.000 €; Nr. 40 Teileinkünfteverfahren; Nr. 51 Trinkgeld; Nr. 62 AG-Anteil SV; Nr. 72 PV-Anlagen.', k:'Lohnersatzleistungen → Progressionsvorbehalt.'},
 {p:'§ 3b EStG', t:'Zuschläge für Sonntags-, Feiertags-, Nachtarbeit', d:'Steuerfrei bis bestimmte Prozentsätze des Grundlohns (max. 50 €/Stunde Grundlohn).', k:'Echte Steuerfreiheit ohne Progressionsvorbehalt.'},
 {p:'§ 3c Abs. 2 EStG', t:'Teilabzugsverbot', d:'Aufwendungen im Zusammenhang mit zu 40 % steuerfreien Einnahmen (TEV) sind nur zu 60 % abziehbar.', k:'Einzelkaufmann mit kreditfinanzierten Aktien.'},
 {p:'§ 4 Abs. 1, Abs. 3 EStG', t:'Gewinnermittlung', d:'Abs. 1: Betriebsvermögensvergleich (EK Ende − EK Anfang + Entnahmen − Einlagen). Abs. 3: Einnahmen-Überschuss-Rechnung für nicht Buchführungspflichtige.', k:'Klausur 2019 Aufgabe 2.'},
 {p:'§ 4 Abs. 4 EStG', t:'Betriebsausgaben', d:'Aufwendungen, die durch den Betrieb veranlasst sind.', k:'Grundnorm.'},
 {p:'§ 4 Abs. 5 EStG', t:'Nicht abziehbare Betriebsausgaben', d:'Nr. 1 Geschenke an Nicht-AN über 50 € (Freigrenze); Nr. 2 Bewirtung 30 % nicht abziehbar; Nr. 4 Jagd/Jacht; Nr. 5 Verpflegungsmehraufwand nur pauschal; Nr. 6b/6c Arbeitszimmer/Homeoffice 6 €/Tag max. 1.260 €; Nr. 7 unangemessene Repräsentation; Nr. 8 Geldbußen, Ordnungs-/Verwarnungsgelder.', k:'KSt-Korrekturen; Geschenke-Aufgabe.'},
 {p:'§ 4 Abs. 5b EStG', t:'Gewerbesteuer keine Betriebsausgabe', d:'Seit 2008 ist die GewSt nicht abziehbar (deshalb § 35 EStG als Ausgleich).', k:'Bei KSt-Aufgaben hinzurechnen.'},
 {p:'§ 5 EStG', t:'Gewinn bei Buchführungspflicht', d:'Maßgeblichkeit der Handelsbilanz für die Steuerbilanz; Kaufleute müssen bilanzieren.', k:'Grundlage KSt-Einkommen (Jahresüberschuss als Ausgangspunkt).'},
 {p:'§ 6 EStG', t:'Bewertung', d:'Anschaffungskosten inkl. Nebenkosten (z. B. Grunderwerbsteuer, Notar), Teilwert, GWG bis 800 € sofort abziehbar.', k:'GrESt beim Kauf = Anschaffungsnebenkosten, nicht sofort abziehbar.'},
 {p:'§ 7 EStG', t:'Absetzung für Abnutzung (AfA)', d:'Verteilung der Anschaffungskosten über die Nutzungsdauer. Gebäude: 3 % (Betriebsgebäude), 2 % (Wohngebäude vor 2023), 3 % (Wohngebäude ab 2023), degressiv 5 % (§ 7 Abs. 5a, 2023–2029).', k:'V+V-Werbungskosten.'},
 {p:'§ 8, § 9 EStG', t:'Einnahmen, Werbungskosten', d:'§ 8: Einnahmen in Geld oder Geldeswert (geldwerter Vorteil). § 9: Werbungskosten = Aufwendungen zur Erwerbung, Sicherung, Erhaltung der Einnahmen; Entfernungspauschale 0,38 €/km (Abs. 1 Nr. 4), Berufsverbände (Nr. 3), Arbeitsmittel (Nr. 6), doppelte Haushaltsführung (Nr. 5).', k:'Werbungskosten-Rechnung.'},
 {p:'§ 9a EStG', t:'Pauschbeträge für Werbungskosten', d:'Arbeitnehmer-Pauschbetrag 1.230 € (Nr. 1a), Versorgungsbezüge 102 €, sonstige Einkünfte 102 €.', k:'„Peter Müller“: 800 € tatsächlich < 1.230 € Pauschbetrag.'},
 {p:'§ 10, § 10b, § 10c EStG', t:'Sonderausgaben', d:'Private Ausgaben, die abziehbar sind: Vorsorgeaufwendungen, Kirchensteuer, Unterhalt (Realsplitting), Kinderbetreuung, Ausbildungskosten, Spenden (20 % des GdE). Pauschbetrag 36 €.', k:'Abzug nach dem GdE.'},
 {p:'§ 10d EStG', t:'Verlustabzug', d:'Abs. 1: Rücktrag bis 1 Mio. € (2 Mio. € Ehegatten) in die zwei Vorjahre, Verzicht auf Antrag. Abs. 2: Vortrag unbegrenzt in der Zeit; 1 Mio. € Sockel + 70 % (VZ 2024–2027, sonst 60 %) des übersteigenden GdE (Mindestbesteuerung). Abs. 4: gesonderte Feststellung.', k:'Klausuren 2010, 2013, 2019.'},
 {p:'§ 11 EStG', t:'Zufluss-/Abflussprinzip', d:'Einnahmen im Jahr des Zuflusses, Ausgaben im Jahr des Abflusses (Ausnahme: regelmäßig wiederkehrende Zahlungen um den Jahreswechsel, 10-Tage-Regel).', k:'EÜR, Überschusseinkünfte.'},
 {p:'§ 12 EStG', t:'Nicht abzugsfähige private Ausgaben', d:'Nr. 1 Lebensführung (auch gemischt veranlasst, z. B. bürgerliche Kleidung); Nr. 3 ESt, Soli, KiSt-Nachzahlungen (als Sonderausgabe aber abziehbar!), sonstige Personensteuern, USt auf Entnahmen; Nr. 4 Geldstrafen.', k:'Geldstrafe vs. Geldbuße (§ 4 Abs. 5 Nr. 8).'},
 {p:'§ 13 EStG', t:'Einkünfte aus Land- und Forstwirtschaft', d:'Planmäßige Nutzung der Naturkräfte des Bodens.', k:'Gewinneinkunftsart Nr. 1.'},
 {p:'§ 15 Abs. 1 S. 1 Nr. 2 EStG', t:'Mitunternehmer', d:'Gewinnanteile der Gesellschafter von OHG/KG UND Sondervergütungen (Gehalt, Zinsen, Miete) sind Einkünfte aus Gewerbebetrieb.', k:'A-B-OHG-Aufgabe (jedes Jahr).'},
 {p:'§ 15 Abs. 2 EStG', t:'Begriff Gewerbebetrieb', d:'Selbstständig, nachhaltig, Gewinnerzielungsabsicht, Beteiligung am allgemeinen wirtschaftlichen Verkehr, keine LuF, keine selbständige Arbeit, keine Vermögensverwaltung.', k:'Abgrenzung zu § 18.'},
 {p:'§ 15 Abs. 3 Nr. 1 EStG', t:'Abfärbetheorie', d:'Übt eine Personengesellschaft auch gewerbliche Tätigkeit aus, sind alle ihre Einkünfte gewerblich.', k:'Freiberufler-Sozietät mit Produktverkauf.'},
 {p:'§ 16, § 17 EStG', t:'Veräußerung von Betrieben und Anteilen', d:'§ 16: Betriebsveräußerung (Freibetrag 45.000 € ab 55 Jahren). § 17: Verkauf von Kapitalgesellschaftsanteilen ≥ 1 % im Privatvermögen = gewerbliche Einkünfte mit TEV.', k:'TEV-Fälle.'},
 {p:'§ 18 EStG', t:'Selbständige Arbeit', d:'Freiberufler (Katalogberufe: Ärzte, Anwälte, Steuerberater, Ingenieure, Architekten, Journalisten, Übersetzer …), keine GewSt, keine Buchführungspflicht.', k:'Zuordnungsaufgabe.'},
 {p:'§ 19 EStG', t:'Nichtselbständige Arbeit', d:'Arbeitslohn, geldwerte Vorteile; Lohnsteuerabzug durch Arbeitgeber (§§ 38 ff.).', k:'GF einer GmbH: § 19; GF einer OHG: § 15!'},
 {p:'§ 20 Abs. 1, 2 EStG', t:'Kapitalvermögen', d:'Nr. 1 Dividenden (inkl. vGA); Nr. 4 typisch stiller Gesellschafter; Nr. 7 Zinsen; Abs. 2: Veräußerungsgewinne (Aktien, Anleihen, Fonds).', k:'Grundlage Abgeltungsteuer.'},
 {p:'§ 20 Abs. 6 EStG', t:'Verlustverrechnung Kapitalvermögen', d:'Verluste nur mit Kapitalerträgen (S. 1); Aktienverluste nur mit Aktiengewinnen (S. 4); Vortrag, kein Rücktrag.', k:'Aussagen-Aufgabe jedes Jahr.'},
 {p:'§ 20 Abs. 8 EStG', t:'Subsidiarität', d:'Kapitalerträge im Betriebsvermögen oder bei V+V gehören zu diesen Einkunftsarten.', k:'Zinsen auf betrieblichem Konto.'},
 {p:'§ 20 Abs. 9 EStG', t:'Sparer-Pauschbetrag', d:'1.000 € (2.000 € Ehegatten); keine tatsächlichen Werbungskosten.', k:'Depotgebühren nicht abziehbar.'},
 {p:'§ 21 EStG', t:'Vermietung und Verpachtung', d:'Mieteinnahmen − Werbungskosten (AfA, Zinsen, Grundsteuer, Reparaturen, Verwaltung).', k:'EFH/ZFH in „Peter Müller“.'},
 {p:'§ 22, § 23 EStG', t:'Sonstige Einkünfte, private Veräußerungsgeschäfte', d:'§ 22 Nr. 1: Renten (Besteuerungsanteil); Nr. 1a Unterhalt; Nr. 4 Abgeordnete. § 23: Grundstücke < 10 Jahre, andere WG (Gold, Krypto) < 1 Jahr; Freigrenze 1.000 €; Verluste nur mit § 23-Gewinnen.', k:'Verlust Goldbarren.'},
 {p:'§ 24a, § 24b EStG', t:'Altersentlastungsbetrag, Entlastungsbetrag für Alleinerziehende', d:'Abzug vor dem GdE (4.260 € Alleinerziehende).', k:'Schema.'},
 {p:'§ 25, § 26, § 26b EStG', t:'Veranlagung, Ehegatten', d:'Veranlagungszeitraum = Kalenderjahr; Zusammenveranlagung mit Splitting.', k:'Splittingtarif.'},
 {p:'§ 32a EStG', t:'Einkommensteuertarif', d:'Grundfreibetrag 2026: 12.348 €; progressiv 14 % bis 42 % (ab 69.879 €), Reichensteuer 45 % (ab 282.750 €); Splitting: doppelter Betrag der Steuer auf das halbe Einkommen.', k:'Tarif-Fragen.'},
 {p:'§ 32b EStG', t:'Progressionsvorbehalt', d:'Steuerfreie Lohnersatzleistungen und DBA-freigestellte Einkünfte erhöhen den Steuersatz: Satz auf (zvE + steuerfreie Einkünfte) wird auf das zvE angewendet.', k:'Herr Meier-Aufgabe (2022, 2023, 2025).'},
 {p:'§ 32d EStG', t:'Abgeltungsteuer', d:'Abs. 1: 25 %; Formel (e − 4q)/(4 + k) bei KiSt. Abs. 2: Ausnahmen (nahestehende Personen, Gesellschafterdarlehen, Option TEV bei ≥ 25 % / ≥ 1 % + Tätigkeit). Abs. 3: Erklärungspflicht ohne Steuerabzug. Abs. 4: Wahlrecht. Abs. 5: Anrechnung ausländischer Steuer max. 25 %. Abs. 6: Günstigerprüfung.', k:'Herr Müller 8.000/2.000 (Klausur 2025).'},
 {p:'§ 33, § 33a, § 33b EStG', t:'Außergewöhnliche Belastungen', d:'Zwangsläufige, außergewöhnliche Aufwendungen (Krankheit) abzüglich zumutbarer Belastung (1–7 % des GdE, Stufentarif); Unterhalt, Behinderten-Pauschbeträge.', k:'Skript-Beispiel 50.000/6.000/3.000.'},
 {p:'§ 34a EStG', t:'Thesaurierungsbegünstigung', d:'Nicht entnommene Gewinne von Einzel-/Mitunternehmern auf Antrag mit 28,25 % (ab 2028 sinkend bis 25 %); Nachversteuerung 25 % bei Entnahme.', k:'Belastungsvergleich.'},
 {p:'§ 34c EStG', t:'Anrechnung/Abzug ausländischer Steuer', d:'Abs. 1: Anrechnung bis Höchstbetrag (dt. ESt × ausl. Einkünfte / Summe der Einkünfte). Abs. 2: Abzug bei den Einkünften auf Antrag. Gilt ohne DBA oder bei DBA mit Anrechnungsmethode.', k:'Spanien-Aufgabe 2022.'},
 {p:'§ 35 EStG', t:'Steuerermäßigung bei gewerblichen Einkünften', d:'Tarifliche ESt mindert sich um das 4,0-fache des GewSt-Messbetrags (max. tatsächliche GewSt, max. anteilige ESt). Nur natürliche Personen/Mitunternehmer.', k:'Volle Entlastung bei Hebesatz 400 %.'},
 {p:'§ 36 EStG', t:'Entstehung, Anrechnung', d:'ESt entsteht mit Ablauf des VZ; Anrechnung von Vorauszahlungen, LSt, KapESt (soweit nicht abgeltend).', k:'Festsetzungsfrist-Beginn.'},
 {p:'§ 38, § 38a, § 39b, § 42e EStG', t:'Lohnsteuer', d:'Erhebungsform der ESt durch Abzug beim Arbeitgeber; Steuerklassen I–VI; Anrufungsauskunft (§ 42e) für AG und AN.', k:'Direkte Steuer.'},
 {p:'§ 43, § 43a EStG', t:'Kapitalertragsteuer', d:'Abzug 25 % an der Quelle (Bank, AG) auf Dividenden (Nr. 1), stille Beteiligung (Nr. 3), Zinsen (Nr. 7), Veräußerungsgewinne (Nr. 9); auch bei Betriebsvermögen (Abs. 4); Abgeltungswirkung nur im Privatvermögen (Abs. 5). § 43a Abs. 3: Verlusttöpfe der Bank, Verlustbescheinigung.', k:'Bankpraxis.'},
 {p:'§ 44a EStG', t:'Freistellungsauftrag', d:'Abstandnahme vom Steuerabzug bis zum Sparer-Pauschbetrag; NV-Bescheinigung.', k:'Bankpraxis.'},
 {p:'§ 46 EStG', t:'Veranlagung von Arbeitnehmern', d:'Pflicht u. a. bei Nebeneinkünften > 410 € (Abs. 2 Nr. 1), Lohnersatzleistungen > 410 €, Steuerklasse III/V (Nr. 3a), Freibetrag auf der Lohnsteuerkarte; Antragsveranlagung 4 Jahre (Nr. 8).', k:'Erklärungspflicht.'},
 {p:'§ 49 EStG', t:'Beschränkt steuerpflichtige Einkünfte', d:'Katalog inländischer Einkünfte für Steuerausländer.', k:'Beschränkte Steuerpflicht.'},
 {p:'§ 51a EStG', t:'Zuschlagsteuern (KiSt auf KapESt)', d:'Kirchensteuer wird von der Bank automatisch einbehalten (Abruf beim BZSt), ESt mindert sich um 25 % der KiSt.', k:'Formel § 32d.'},
 {p:'§ 56 EStDV', t:'Erklärungspflicht Nicht-Arbeitnehmer', d:'Pflicht, wenn GdE über dem Grundfreibetrag (Ledige) bzw. doppeltem Grundfreibetrag (Ehegatten).', k:'Selbstständige.'}
]},
{ code:'KStG', name:'Körperschaftsteuergesetz (KStG)', intro:'„Einkommensteuer der juristischen Personen“. Steuersatz 15 %. Einkommen nach EStG-Regeln plus eigene Korrekturen (§§ 8–10).', items:[
 {p:'§ 1 KStG', t:'Unbeschränkte Steuerpflicht', d:'Kapitalgesellschaften (AG, GmbH, KGaA, SE), Genossenschaften, Versicherungsvereine, sonstige juristische Personen (e.V., Stiftung), nichtrechtsfähige Vereine, Betriebe gewerblicher Art – mit Sitz oder Geschäftsleitung im Inland; Welteinkommen (Abs. 2).', k:'OHG ist KEIN KSt-Subjekt.'},
 {p:'§ 1a KStG', t:'Option zur Körperschaftsbesteuerung', d:'Personenhandelsgesellschaften (OHG, KG) und Partnerschaftsgesellschaften können seit 2022 auf Antrag wie eine Kapitalgesellschaft besteuert werden.', k:'Ausnahme vom Transparenzprinzip.'},
 {p:'§ 2 KStG', t:'Beschränkte Steuerpflicht', d:'Körperschaften ohne Sitz/Geschäftsleitung im Inland mit inländischen Einkünften.', k:'Überblick.'},
 {p:'§ 5 KStG', t:'Steuerbefreiungen', d:'Bundesbank, gemeinnützige Körperschaften (Nr. 9), Berufsverbände, politische Parteien, Pensionskassen.', k:'Analog § 3 GewStG.'},
 {p:'§ 7 KStG', t:'Bemessungsgrundlage', d:'Zu versteuerndes Einkommen = Einkommen nach § 8 abzüglich Freibeträge §§ 24, 25 (nicht für KapG). Veranlagungszeitraum Kalenderjahr, Wirtschaftsjahr kann abweichen.', k:'Schema.'},
 {p:'§ 8 Abs. 1 KStG', t:'Ermittlung des Einkommens', d:'Nach den Vorschriften des EStG (§ 4 Abs. 5, § 10d …) und des KStG.', k:'Verweisnorm – deshalb gelten § 4 Abs. 5 EStG-Abzugsverbote.'},
 {p:'§ 8 Abs. 2 KStG', t:'Alle Einkünfte sind gewerblich', d:'Bei unbeschränkt steuerpflichtigen Kapitalgesellschaften sind sämtliche Einkünfte Einkünfte aus Gewerbebetrieb.', k:'Steuerberater-GmbH ist Gewerbebetrieb.'},
 {p:'§ 8 Abs. 3 KStG', t:'Verdeckte Gewinnausschüttung', d:'Die Gewinnverteilung (offen oder verdeckt) mindert das Einkommen nicht; vGA = durch das Gesellschaftsverhältnis veranlasste Vermögensminderung (Fremdvergleich).', k:'Überhöhtes GF-Gehalt.'},
 {p:'§ 8b KStG', t:'Beteiligungen an anderen Körperschaften', d:'Abs. 1: Dividenden steuerfrei. Abs. 2: Veräußerungsgewinne steuerfrei. Abs. 3: 5 % des Gewinns nicht abziehbar; Verluste/Teilwert-AfA nicht abziehbar. Abs. 4: Streubesitzdividenden (< 10 %) steuerpflichtig. Abs. 5: 5 % der Dividende nicht abziehbare BA → effektiv 95 % frei.', k:'In jeder KSt-Aufgabe: Dividende − 95 %.'},
 {p:'§ 8c KStG', t:'Verlustabzug bei Anteilseignerwechsel', d:'Verlustvorträge gehen unter, wenn > 50 % der Anteile übertragen werden (Ausnahmen: Sanierung, Konzern, stille Reserven).', k:'Ergänzung zu § 10d.'},
 {p:'§ 9 KStG', t:'Abziehbare Aufwendungen', d:'Spenden bis 20 % des Einkommens oder 4 ‰ der Umsätze und Löhne.', k:'Schema.'},
 {p:'§ 10 KStG', t:'Nicht abziehbare Aufwendungen', d:'Nr. 1 Satzungszwecke; Nr. 2 Steuern vom Einkommen (KSt, Soli, KapESt), USt auf vGA/Entnahmen, Nebenleistungen; Nr. 3 Geldstrafen; Nr. 4 Hälfte der Aufsichtsratsvergütungen.', k:'In jeder KSt-Aufgabe: + KSt, + 50 % Aufsichtsrat.'},
 {p:'§ 23 KStG', t:'Steuersatz', d:'15 % (2026/2027); 2028: 14 %, 2029: 13 %, 2030: 12 %, 2031: 11 %, ab 2032: 10 %. Plus Soli 5,5 %.', k:'„KSt immer 15 %“ (Eric-Notiz 2025).'},
 {p:'§ 24, § 25 KStG', t:'Freibeträge', d:'5.000 € für bestimmte Körperschaften (Vereine), 15.000 € für Genossenschaften/Vereine in LuF – NICHT für Kapitalgesellschaften.', k:'Falle.'},
 {p:'§ 26 KStG', t:'Ausländische Steuern', d:'Anrechnung wie § 34c EStG.', k:'Überblick.'},
 {p:'§ 27 ff. KStG', t:'Steuerliches Einlagekonto', d:'Rückzahlung von Einlagen ist keine Dividende.', k:'Überblick.'}
]},
{ code:'GewStG', name:'Gewerbesteuergesetz (GewStG)', intro:'Gemeindesteuer auf den objektiven Ertrag des Gewerbebetriebs. Rechenkette: Gewinn + Hinzurechnungen − Kürzungen → Gewerbeertrag → Messbetrag × Hebesatz.', items:[
 {p:'§ 1 GewStG', t:'Steuerberechtigte', d:'Die Gemeinden erheben die Gewerbesteuer (Realsteuer, § 3 Abs. 2 AO).', k:'Gemeindesteuer.'},
 {p:'§ 2 GewStG', t:'Steuergegenstand', d:'Abs. 1: jeder stehende Gewerbebetrieb im Inland (Begriff nach EStG). Abs. 2: Kapitalgesellschaften gelten stets und in vollem Umfang als Gewerbebetrieb. Freiberufler und LuF nicht.', k:'Steuerberater-GmbH ja, Steuerberater nein.'},
 {p:'§ 3 GewStG', t:'Befreiungen', d:'Bundesbank, gemeinnützige Körperschaften, Krankenhäuser, Schulen – analog § 5 KStG.', k:'Überblick.'},
 {p:'§ 5 GewStG', t:'Steuerschuldner', d:'Der Unternehmer; bei Personengesellschaften die Gesellschaft selbst (Abs. 1 S. 3).', k:'OHG ist GewSt-Subjekt.'},
 {p:'§ 6, § 7 GewStG', t:'Besteuerungsgrundlage: Gewerbeertrag', d:'Gewinn aus Gewerbebetrieb nach EStG/KStG (vor Verlustabzug), verändert um §§ 8, 9.', k:'Ausgangspunkt = KSt-Einkommen vor § 10d.'},
 {p:'§ 8 Nr. 1 GewStG', t:'Hinzurechnung Finanzierungsentgelte', d:'a) Zinsen 100 %; b) Renten/dauernde Lasten 100 %; c) Gewinnanteile stiller Gesellschafter 100 %; d) Mieten/Pachten/Leasing beweglicher WG 20 % (E-Fahrzeuge 10 %); e) Mieten unbeweglicher WG 50 %; f) Lizenzen 25 %. Summe − 200.000 € Freibetrag, davon 25 %.', k:'Kernaufgabe GewSt (6–8 Punkte).'},
 {p:'§ 8 Nr. 4, 5, 8, 9 GewStG', t:'Weitere Hinzurechnungen', d:'Nr. 4 Gewinnanteile Komplementäre KGaA; Nr. 5 steuerfreie Streubesitzdividenden (< 15 %); Nr. 8 Verlustanteile aus Mitunternehmerschaften; Nr. 9 Spenden.', k:'Ergänzung.'},
 {p:'§ 9 Nr. 1 GewStG', t:'Kürzung Grundbesitz', d:'1,2 % des um 40 % erhöhten Einheitswerts (Klausur: EW 100.000 → 1.680 €); erweiterte Kürzung für reine Grundstücksunternehmen. Ab EZ 2025 gesetzlich: 0,11 % des Grundsteuerwerts.', k:'Jede GewSt-Aufgabe mit Betriebsgrundstück.'},
 {p:'§ 9 Nr. 2, 2a, 3, 5, 7 GewStG', t:'Weitere Kürzungen', d:'Nr. 2 Gewinnanteile aus Personengesellschaften; Nr. 2a Dividenden aus Beteiligungen ≥ 15 % (Schachtelprivileg); Nr. 3 ausländische Betriebsstätten; Nr. 5 Spenden; Nr. 7 ausländische Schachteldividenden.', k:'OHG-Gewinnanteil 50.000 kürzen (Klausur 2025).'},
 {p:'§ 10a GewStG', t:'Gewerbeverlust', d:'Nur Vortrag (kein Rücktrag!), 1 Mio. € unbeschränkt, darüber 60 % (Mindestbesteuerung); Unternehmer- und Unternehmensidentität nötig.', k:'Unterschied zu § 10d EStG.'},
 {p:'§ 11 GewStG', t:'Steuermesszahl, Freibetrag', d:'Abs. 1: Gewerbeertrag auf volle 100 € abrunden; Freibetrag 24.500 € nur für natürliche Personen und Personengesellschaften. Abs. 2: Steuermesszahl 3,5 %.', k:'AG: kein Freibetrag!'},
 {p:'§ 14 GewStG', t:'Steuermessbescheid', d:'Das Finanzamt setzt den Messbetrag fest (Grundlagenbescheid), die Gemeinde die Steuer.', k:'Einspruch gegen Messbescheid beim Finanzamt.'},
 {p:'§ 16 GewStG', t:'Hebesatz', d:'Von der Gemeinde festgelegt, mindestens 200 % (Abs. 4 S. 2); Mannheim 430 %, Großstädte 400–500 %.', k:'Messbetrag × Hebesatz.'},
 {p:'§ 19 GewStG', t:'Vorauszahlungen', d:'Vierteljährlich (15.02., 15.05., 15.08., 15.11.).', k:'Überblick.'},
 {p:'§§ 28–31 GewStG', t:'Zerlegung', d:'Bei Betriebsstätten in mehreren Gemeinden: Verteilung des Messbetrags nach Arbeitslöhnen (auf 1.000 € abgerundet).', k:'Skript 4.5.'}
]},
{ code:'UStG', name:'Umsatzsteuergesetz (UStG)', intro:'Allphasen-Netto-Umsatzsteuer mit Vorsteuerabzug; indirekte Verkehrsteuer; belastet den Endverbrauch im Inland. Prüfschema: steuerbar → steuerfrei → Option → Steuersatz → Vorsteuer.', items:[
 {p:'§ 1 Abs. 1 UStG', t:'Steuerbare Umsätze', d:'Nr. 1: Lieferungen und sonstige Leistungen eines Unternehmers im Inland gegen Entgelt im Rahmen seines Unternehmens. Nr. 4: Einfuhr aus dem Drittland (EUSt). Nr. 5: innergemeinschaftlicher Erwerb.', k:'Fünf Merkmale der Steuerbarkeit.'},
 {p:'§ 1 Abs. 2, 2a, 3 UStG', t:'Inland, Gemeinschaftsgebiet, Drittland', d:'Inland = Bundesrepublik ohne Büsingen/Helgoland; Gemeinschaftsgebiet = EU; Drittland = Rest (Schweiz, UK, USA, Türkei …).', k:'Ausfuhr vs. ig Lieferung.'},
 {p:'§ 1a UStG', t:'Innergemeinschaftlicher Erwerb', d:'Erwerber-Unternehmer versteuert den Bezug aus einem anderen EU-Staat im Inland (Bestimmungslandprinzip), Vorsteuerabzug zugleich; Erwerbsschwelle 12.500 € für Halbunternehmer/Kleinunternehmer.', k:'Spiegelbild der ig Lieferung.'},
 {p:'§ 2 UStG', t:'Unternehmer', d:'Wer eine gewerbliche oder berufliche Tätigkeit selbstständig ausübt; nachhaltig, Einnahmeerzielung genügt (keine Gewinnabsicht nötig). Abs. 2 Nr. 2: Organschaft (finanzielle, wirtschaftliche, organisatorische Eingliederung) – Innenumsätze nicht steuerbar.', k:'Vermieter ist Unternehmer.'},
 {p:'§ 3 Abs. 1, 1b, 9, 9a UStG', t:'Lieferung, sonstige Leistung, Entnahmen', d:'Lieferung = Verschaffung der Verfügungsmacht; Entnahme von Gegenständen = fiktive Lieferung (Abs. 1b); sonstige Leistung = alles andere (Abs. 9); private Nutzung = fiktive sonstige Leistung (Abs. 9a).', k:'Entnahme Laptop.'},
 {p:'§ 3 Abs. 6, 7 UStG', t:'Ort der Lieferung', d:'Beförderungs-/Versendungslieferung: Beginn der Beförderung (Abs. 6); ruhende Lieferung: Ort der Verschaffung der Verfügungsmacht (Abs. 7).', k:'Export: Ort Inland → steuerbar, dann steuerfrei.'},
 {p:'§ 3a UStG', t:'Ort der sonstigen Leistung', d:'B2C: Sitz des leistenden Unternehmers (Abs. 1); B2B: Sitz des Leistungsempfängers (Abs. 2); Ausnahmen: Grundstück (Abs. 3 Nr. 1), Restaurant, Veranstaltungen.', k:'Bankleistung an Unternehmer im Ausland: nicht steuerbar in D.'},
 {p:'§ 4 Nr. 1a, § 6 UStG', t:'Ausfuhrlieferung', d:'Lieferung ins Drittland steuerfrei; bei Abholung durch den Abnehmer muss dieser „ausländischer Abnehmer“ sein (Wohnort im Ausland); Reiseverkehr: Ausfuhr innerhalb 3 Monaten, > 50 €. Vorsteuer bleibt (§ 15 Abs. 3).', k:'Kanada-Tourist; türkischer Arbeiter.'},
 {p:'§ 4 Nr. 1b, § 6a UStG', t:'Innergemeinschaftliche Lieferung', d:'Steuerfrei, wenn Ware in anderen EU-Staat gelangt, Abnehmer Unternehmer mit USt-IdNr., Erwerb dort besteuert; Zusammenfassende Meldung (§ 18a); Vertrauensschutz (Abs. 4).', k:'Italiener bei P&C.'},
 {p:'§ 4 Nr. 8 UStG', t:'Finanzumsätze', d:'Kreditgewährung, Zahlungsverkehr, Wertpapier-, Anteils- und Depotgeschäfte steuerfrei (unechte Befreiung: kein Vorsteuerabzug).', k:'Bank-Aufgabe jedes Jahr.'},
 {p:'§ 4 Nr. 9a UStG', t:'Grundstücksumsätze', d:'Umsätze, die unter das GrEStG fallen, sind umsatzsteuerfrei (Option § 9 möglich im Notarvertrag).', k:'Vater → Sohn.'},
 {p:'§ 4 Nr. 10, 11 UStG', t:'Versicherungen, Bausparen', d:'Versicherungsleistungen und Vermittlung steuerfrei (Versicherungsteuer stattdessen).', k:'Überblick.'},
 {p:'§ 4 Nr. 12a UStG', t:'Vermietung von Grundstücken', d:'Steuerfrei (unecht); Option nach § 9 Abs. 2 nur bei Mietern mit vorsteuerunschädlichen Umsätzen; Wohnungen nie.', k:'Bürogebäude 100 Mio.'},
 {p:'§ 4 Nr. 14 UStG', t:'Heilbehandlungen', d:'Ärzte, Zahnärzte, Heilpraktiker, Krankenhäuser steuerfrei (unecht).', k:'Arzt als Mieter: keine Option.'},
 {p:'§ 9 UStG', t:'Verzicht auf Steuerbefreiung (Option)', d:'Abs. 1: Bei Umsätzen nach § 4 Nr. 8, 9, 12, 13, 19 an andere Unternehmer für deren Unternehmen. Abs. 2: bei Grundstücken nur, wenn der Mieter ausschließlich vorsteuerabzugsberechtigende Umsätze ausführt. Abs. 3: bei Grundstückslieferungen nur im Notarvertrag.', k:'Schlüssel zum Vorsteuerabzug der Bank.'},
 {p:'§ 10 UStG', t:'Bemessungsgrundlage', d:'Entgelt = alles, was der Leistungsempfänger aufwendet, abzüglich USt (Nettoprinzip). Abs. 4: Entnahmen → Einkaufspreis/Selbstkosten.', k:'Aus brutto: × 19/119.'},
 {p:'§ 12 UStG', t:'Steuersätze', d:'19 % Regelsatz; 7 % ermäßigt für Anlage 2 (Lebensmittel, Bücher, Zeitungen, Kunst), Kultur, ÖPNV, Beherbergung, Milchmischgetränke ≥ 75 % Milch.', k:'Pizza-Beispiel.'},
 {p:'§ 13, § 13a, § 13b UStG', t:'Entstehung, Steuerschuldner, Reverse Charge', d:'Sollbesteuerung: Ablauf des Voranmeldungszeitraums der Leistung; Anzahlungen bei Vereinnahmung. Steuerschuldner ist der leistende Unternehmer (§ 13a), bei Bauleistungen/Auslandsleistungen der Empfänger (§ 13b).', k:'Verfahren.'},
 {p:'§ 14, § 14a, § 14c UStG', t:'Rechnung', d:'Pflichtangaben (Name, Steuernummer/USt-IdNr., Datum, Nummer, Menge, Entgelt, Steuersatz, Steuerbetrag); Kleinbetragsrechnung bis 250 € (§ 33 UStDV); E-Rechnung im B2B seit 2025; unrichtiger Ausweis wird geschuldet (§ 14c).', k:'Voraussetzung Vorsteuerabzug.'},
 {p:'§ 15 UStG', t:'Vorsteuerabzug', d:'Abs. 1: gesetzlich geschuldete USt aus Rechnungen für das Unternehmen, EUSt, Erwerbsteuer. Abs. 2: ausgeschlossen bei steuerfreien Ausgangsumsätzen (§ 4 Nr. 8 ff.). Abs. 3: nicht ausgeschlossen bei Export (§ 4 Nr. 1–7). Abs. 4: Aufteilung bei gemischter Verwendung.', k:'Herzstück der Bank-Aufgabe.'},
 {p:'§ 15a UStG', t:'Vorsteuerberichtigung', d:'Ändern sich die Verhältnisse innerhalb von 5 Jahren (bewegliche WG) bzw. 10 Jahren (Grundstücke), wird der Vorsteuerabzug anteilig korrigiert.', k:'Gebäude-Gestaltung.'},
 {p:'§ 16, § 18 UStG', t:'Berechnung, Voranmeldung', d:'Zahllast = USt − Vorsteuer. Voranmeldung bis zum 10. des Folgemonats: monatlich (> 9.000 € Vorjahr), vierteljährlich, Befreiung ≤ 2.000 €; Jahreserklärung; Dauerfristverlängerung.', k:'Anmeldesteuer (§ 168 AO).'},
 {p:'§ 18a UStG', t:'Zusammenfassende Meldung', d:'Meldung ig Lieferungen an das BZSt.', k:'Pflicht bei ig Lieferung.'},
 {p:'§ 19 UStG', t:'Kleinunternehmer', d:'Umsatz Vorjahr ≤ 25.000 € und laufendes Jahr ≤ 100.000 € (seit 2025): keine USt, kein Vorsteuerabzug, kein USt-Ausweis; Verzicht möglich (5 Jahre Bindung).', k:'Besondere Besteuerung.'},
 {p:'§ 20 UStG', t:'Istbesteuerung', d:'Auf Antrag nach vereinnahmten Entgelten, wenn Vorjahresumsatz ≤ 800.000 € oder Freiberufler.', k:'Liquiditätsvorteil.'},
 {p:'§ 24 UStG', t:'Durchschnittssätze Land- und Forstwirtschaft', d:'Pauschalierung für Landwirte.', k:'Überblick.'}
]},
{ code:'GrEStG', name:'Grunderwerbsteuergesetz (GrEStG)', intro:'Landessteuer, Verkehrsteuer, einmalig beim Erwerb inländischer Grundstücke.', items:[
 {p:'§ 1 GrEStG', t:'Erwerbsvorgänge', d:'Kaufvertrag oder anderes Rechtsgeschäft mit Übereignungsanspruch, Meistgebot in Zwangsversteigerung, Anteilsvereinigung ≥ 90 % (Share Deals).', k:'Steuerbarkeit.'},
 {p:'§ 2 GrEStG', t:'Grundstücke', d:'Grundstücke im Sinne des BGB inkl. Gebäude; nicht Betriebsvorrichtungen und bewegliches Inventar.', k:'Einbauküche separat ausweisen.'},
 {p:'§ 3 GrEStG', t:'Befreiungen', d:'Nr. 1 Freigrenze 2.500 €; Nr. 2 Erwerb von Todes wegen/Schenkung (ErbSt vorrangig); Nr. 4 Ehegatten/Lebenspartner; Nr. 5 Vermögensauseinandersetzung nach Scheidung; Nr. 6 Verwandte in gerader Linie (Eltern/Kinder/Enkel) und Stiefkinder.', k:'Vater → Sohn frei, Bruder → Schwester nicht.'},
 {p:'§ 8, § 9 GrEStG', t:'Bemessungsgrundlage', d:'Gegenleistung (Kaufpreis + übernommene Belastungen); bei Fehlen Grundbesitzwert nach BewG.', k:'Rechnung.'},
 {p:'§ 11 GrEStG', t:'Steuersatz', d:'3,5 %; Länder dürfen abweichen (Art. 105 Abs. 2a GG): BW 5 %, Bayern 3,5 %, NRW 6,5 %, Hessen 6 %.', k:'„lt. Gesetz 3,5 %, i.d.R. höher“.'},
 {p:'§ 13 GrEStG', t:'Steuerschuldner', d:'Die an dem Erwerbsvorgang Beteiligten (Käufer und Verkäufer) als Gesamtschuldner.', k:'Beide!'},
 {p:'§ 18, § 19 GrEStG', t:'Anzeigepflichten', d:'Notare und Beteiligte müssen dem Finanzamt den Vorgang anzeigen.', k:'Überblick.'},
 {p:'§ 22 GrEStG', t:'Unbedenklichkeitsbescheinigung', d:'Eintragung im Grundbuch erst nach Bestätigung des Finanzamts, dass die GrESt gezahlt ist.', k:'Praxisablauf.'}
]},
{ code:'GrStG', name:'Grundsteuergesetz (GrStG)', intro:'Gemeindesteuer auf den Besitz von Grundbesitz; jährlich; Dreischritt Grundsteuerwert × Messzahl × Hebesatz. Reform ab 2025.', items:[
 {p:'§ 1, § 2 GrStG', t:'Heberecht, Steuergegenstand', d:'Gemeinden erheben die Grundsteuer auf inländischen Grundbesitz: Grundsteuer A (Land-/Forstwirtschaft), B (sonstige Grundstücke), C (baureife Grundstücke, optional).', k:'Gemeindesteuer.'},
 {p:'§§ 3–6 GrStG', t:'Befreiungen', d:'Grundbesitz der öffentlichen Hand, Kirchen, gemeinnütziger Körperschaften für bestimmte Nutzungen.', k:'Überblick.'},
 {p:'§ 10 GrStG', t:'Steuerschuldner', d:'Eigentümer (wem das Grundstück zugerechnet wird).', k:'Umlage auf Mieter zivilrechtlich.'},
 {p:'§ 13, § 15 GrStG', t:'Steuermessbetrag, Messzahl', d:'Grundsteuerwert × Steuermesszahl (Bundesmodell: 0,31 ‰ Wohnen, 0,34 ‰ Nichtwohnen; BW Landesmodell: 1,3 ‰ auf Bodenwert, −30 % für Wohnen).', k:'Promille!'},
 {p:'§ 25 GrStG', t:'Hebesatz', d:'Gemeinde legt den Hebesatz fest; Mannheim 2025: ca. 500 % Grundsteuer B.', k:'Prozent.'},
 {p:'§ 27, § 28 GrStG', t:'Festsetzung, Fälligkeit', d:'Jahressteuer, vierteljährliche Fälligkeit (15.02., 15.05., 15.08., 15.11.).', k:'Überblick.'},
 {p:'§§ 218 ff. BewG', t:'Grundsteuerwerte', d:'Hauptfeststellung auf 1.1.2022, Anwendung ab 2025; Ertragswert-/Sachwertverfahren (Bundesmodell).', k:'Ersetzt Einheitswert.'}
]},
{ code:'ErbStG', name:'Erbschaft- und Schenkungsteuergesetz (ErbStG) – Überblick', intro:'Landessteuer auf unentgeltliche Vermögensübergänge. Freibeträge und Sätze nach Verwandtschaft (Steuerklassen).', items:[
 {p:'§ 1 ErbStG', t:'Steuerpflichtige Vorgänge', d:'Erwerb von Todes wegen, Schenkungen unter Lebenden, Zweckzuwendungen, Vermögen von Familienstiftungen (alle 30 Jahre).', k:'Schenkung = Erbfall zu Lebzeiten.'},
 {p:'§ 2 ErbStG', t:'Persönliche Steuerpflicht', d:'Unbeschränkt, wenn Erblasser/Schenker oder Erwerber Inländer ist (Welt-Vermögen); sonst beschränkt für Inlandsvermögen.', k:'Überblick.'},
 {p:'§ 9, § 11 ErbStG', t:'Entstehung, Bewertungsstichtag', d:'Mit dem Tod bzw. Ausführung der Schenkung; Bewertung auf diesen Stichtag.', k:'Überblick.'},
 {p:'§ 10 ErbStG', t:'Steuerpflichtiger Erwerb', d:'Bereicherung des Erwerbers (Vermögensanfall − Nachlassverbindlichkeiten − Befreiungen − Freibeträge), auf 100 € abgerundet.', k:'Berechnungsbasis.'},
 {p:'§ 13 ErbStG', t:'Sachliche Befreiungen', d:'Hausrat 41.000 € (Klasse I), andere bewegliche Gegenstände 12.000 €; Familienheim an Ehegatten/Kinder (10 Jahre Selbstnutzung); übliche Gelegenheitsgeschenke.', k:'Überblick.'},
 {p:'§ 13a, § 13b ErbStG', t:'Verschonung Betriebsvermögen', d:'Begünstigtes Betriebsvermögen und Anteile an KapG > 25 %: 85 % steuerfrei (Regelverschonung, 5 Jahre Lohnsumme) oder 100 % (Option, 7 Jahre); bis 26 Mio. €.', k:'Skript: „Produktivvermögen“.'},
 {p:'§ 14 ErbStG', t:'Zusammenrechnung', d:'Erwerbe von derselben Person innerhalb von 10 Jahren werden zusammengerechnet – Freibeträge gelten einmal pro 10 Jahre.', k:'Vorschenkungen beachten.'},
 {p:'§ 15 ErbStG', t:'Steuerklassen', d:'I: Ehegatte, Kinder, Enkel, Eltern/Großeltern (bei Erwerb von Todes wegen). II: Geschwister, Nichten/Neffen, Stief-/Schwiegereltern, Schwiegerkinder, geschiedener Ehegatte, Eltern bei Schenkung. III: alle übrigen (auch Lebensgefährten).', k:'Lebensgefährte = Klasse III!'},
 {p:'§ 16 ErbStG', t:'Persönliche Freibeträge', d:'Ehegatte 500.000 €; Kinder 400.000 €; Enkel 200.000 € (400.000 € wenn Elternteil verstorben); Urenkel/Eltern (Erbfall) 100.000 €; Klasse II und III 20.000 €.', k:'Rechenaufgabe.'},
 {p:'§ 17 ErbStG', t:'Versorgungsfreibetrag', d:'Ehegatte 256.000 €, Kinder bis 27 Jahre gestaffelt 10.300–52.000 € (gekürzt um Versorgungsbezüge).', k:'Zusätzlich zu § 16.'},
 {p:'§ 19 ErbStG', t:'Steuersätze', d:'Klasse I: 7 % (bis 75.000) – 11 % (300.000) – 15 % (600.000) – 19 % (6 Mio.) – 23 % – 27 % – 30 %. Klasse II: 15–43 %. Klasse III: 30 % / 50 % (über 6 Mio.). Härteausgleich (Abs. 3).', k:'Vollmengenstaffel – ganzer Betrag mit dem Satz der Stufe.'},
 {p:'§ 21 ErbStG', t:'Anrechnung ausländischer Erbschaftsteuer', d:'Bei Auslandsvermögen.', k:'Überblick.'},
 {p:'§ 30, § 33, § 34 ErbStG', t:'Anzeigepflichten', d:'Erwerber innerhalb 3 Monaten; Banken, Versicherungen, Notare, Gerichte müssen Vermögen Verstorbener melden.', k:'Bankpflicht § 33!'},
 {p:'§§ 176 ff. BewG', t:'Grundstücksbewertung für ErbSt', d:'Vergleichswertverfahren (Eigentumswohnungen, EFH/ZFH), Ertragswertverfahren (Mietwohngrundstücke), Sachwertverfahren (Geschäftsgrundstücke); Öffnungsklausel § 198 für niedrigeren Gutachtenwert.', k:'Skript zur Kenntnis.'}
]},
{ code:'GG/FGO/HGB', name:'Grundgesetz, Finanzgerichtsordnung, HGB – flankierende Normen', intro:'Verfassungsrechtliche Grundlagen, gerichtlicher Rechtsschutz und Handelsrecht als Basis der Bilanzierung.', items:[
 {p:'Art. 105 GG', t:'Gesetzgebungshoheit', d:'Abs. 1: Bund ausschließlich für Zölle; Abs. 2: konkurrierend für übrige Steuern; Abs. 2a: Länder für örtliche Verbrauch-/Aufwandsteuern und GrESt-Satz.', k:'Steuerhoheit.'},
 {p:'Art. 106 GG', t:'Ertragshoheit', d:'Wem steht die Steuer zu: Bund (Zölle, Verbrauchsteuern, Versicherung-, Kfz-Steuer, Soli), Länder (ErbSt, GrESt, Biersteuer), Gemeinschaft (ESt, KSt, USt), Gemeinden (GewSt, GrSt).', k:'Einteilung nach Gläubiger.'},
 {p:'Art. 108 GG', t:'Verwaltungshoheit', d:'Bundesfinanzbehörden (Zoll) für Zölle/Verbrauchsteuern/Kfz-Steuer; Landesfinanzbehörden (Finanzämter) für den Rest.', k:'ESt wird vom Finanzamt verwaltet.'},
 {p:'§ 40, § 44, § 47 FGO', t:'Klage beim Finanzgericht', d:'Anfechtungsklage nach erfolglosem Einspruch (Vorverfahren); Klagefrist 1 Monat nach Einspruchsentscheidung; Revision zum BFH (§ 115).', k:'Gerichtlicher Rechtsschutz.'},
 {p:'§ 238, § 242 HGB', t:'Buchführungspflicht, Jahresabschluss', d:'Jeder Kaufmann muss Bücher führen und Bilanz/GuV aufstellen; über § 140 AO auch steuerlich maßgebend.', k:'Bilanzierung bei KapG.'},
 {p:'§ 249 HGB', t:'Rückstellungen', d:'Für ungewisse Verbindlichkeiten – z. B. noch nicht festgesetzte Steuern (KSt-Rückstellung in der Klausur).', k:'„Rückstellung von 50.000“.'},
 {p:'§§ 230–236 HGB', t:'Stille Gesellschaft', d:'Vermögenseinlage in ein Handelsgewerbe gegen Gewinnbeteiligung; nach außen nicht erkennbar; typisch = Kapitalvermögen, atypisch = Mitunternehmer.', k:'Einkunftsart-Zuordnung.'}
]}

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2200); }

function parseNum(str){
  if(str==null) return NaN;
  let s = String(str).trim().replace(/€/g,'').replace(/\s/g,'').replace(/%/g,'');
  if(!s) return NaN;
  const neg = /^-|^−|^\(/.test(s); s = s.replace(/^[-−(]+|\)+$/g,'');
  if(s.includes(',') && s.includes('.')){ s = s.replace(/\./g,'').replace(',', '.'); }
  else if(s.includes(',')){ s = s.replace(',', '.'); }
  else if(s.includes('.')){ const parts = s.split('.'); if(parts.slice(1).every(p=>p.length===3)) s = parts.join(''); }
  const v = parseFloat(s); return neg ? -v : v;
}

// ---------- Statistik ----------
function taskStat(id){ return state.tasks[id] || {attempts:0, correct:0, best:0, last:null}; }
function statusOf(id){ const s=taskStat(id); if(!s.attempts) return 'neu'; if(s.best>=0.999) return 'ok'; if(s.last>=0.999) return 'ok'; return s.last>0?'part':'ko'; }
function topicStats(topic){
  const list = TASKS.filter(t=>topic==='alle'||t.topic===topic);
  const done = list.filter(t=>taskStat(t.id).attempts>0).length;
  const mastered = list.filter(t=>taskStat(t.id).best>=0.999).length;
  const pts = list.reduce((a,t)=>a+t.points,0);
  const earned = list.reduce((a,t)=>a+t.points*taskStat(t.id).best,0);
  return {total:list.length, done, mastered, pts, earned};
}
function streak(){
  let n=0; const d=new Date();
  for(;;){ const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); if(state.days[k]){n++; d.setDate(d.getDate()-1);} else { if(n===0){ d.setDate(d.getDate()-1); const k2=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); if(state.days[k2]){ n=0; let dd=new Date(d); while(true){const kk=dd.getFullYear()+'-'+String(dd.getMonth()+1).padStart(2,'0')+'-'+String(dd.getDate()).padStart(2,'0'); if(state.days[kk]){n++; dd.setDate(dd.getDate()-1);} else break;} } } break; } }
  return n;
}
