function partHTML(task, p, i, prefix){
  const name = `${prefix}-${task.id}-${i}`;
  let body='';
  if(p.type==='single'||p.type==='multi'){
    body = `<div class="opts">${p.options.map((o,j)=>`<label class="opt" data-j="${j}"><input type="${p.type==='single'?'radio':'checkbox'}" name="${name}" value="${j}"><span class="l">${String.fromCharCode(65+j)}</span><span>${o}</span></label>`).join('')}</div>${p.type==='multi'?'<div class="muted small" style="margin-top:6px">Mehrere Antworten können richtig sein – die Teilaufgabe zählt nur, wenn genau die richtigen angekreuzt sind (wie in der Klausur).</div>':''}`;
  } else if(p.type==='num'){
    body = `<div class="numin"><input type="text" inputmode="decimal" name="${name}" placeholder="Betrag" autocomplete="off"><span class="muted">€</span></div>`;
  } else if(p.type==='self'){
    body = `<details class="more"><summary>Musterlösung anzeigen</summary><div style="margin-top:8px">${p.model}</div></details><div class="pill-row self-grade" data-name="${name}"><span class="muted small" style="align-self:center">Selbstbewertung:</span><button class="pill" data-v="1">✔ Konnte ich</button><button class="pill" data-v="0.5">◐ Teilweise</button><button class="pill" data-v="0">✘ Konnte ich nicht</button></div>`;
  }
  return `<div class="part" data-i="${i}" data-type="${p.type}"><div class="q">${task.parts.length>1?`<span class="muted">${i+1}.</span> `:''}${p.q}</div>${body}<div class="feedback"></div></div>`;
}

function evaluatePart(container, p){
  const type = p.type;
  if(type==='single'||type==='multi'){
    const checked = [...container.querySelectorAll('input:checked')].map(i=>Number(i.value));
    const correct = p.correct.slice().sort((a,b)=>a-b);
    const ok = checked.length===correct.length && checked.slice().sort((a,b)=>a-b).every((v,i)=>v===correct[i]);
    container.querySelectorAll('.opt').forEach(o=>{const j=Number(o.dataset.j); const isC=correct.includes(j); const isS=checked.includes(j); if(isC&&isS) o.classList.add('correct'); else if(!isC&&isS) o.classList.add('wrong'); else if(isC&&!isS) o.classList.add('missed');});
    container.querySelectorAll('input').forEach(i=>i.disabled=true);
    const fb = container.querySelector('.feedback'); fb.className='feedback '+(ok?'ok':'ko');
    fb.textContent = ok ? '✔ Richtig' : `✘ Richtig wäre: ${correct.map(j=>String.fromCharCode(65+j)).join(', ')}`;
    return ok?1:0;
  }
  if(type==='num'){
    const inp = container.querySelector('input'); const v = parseNum(inp.value);
    const ok = !isNaN(v) && Math.abs(v - p.answer) <= (p.tol==null?0.5:p.tol);
    inp.classList.add(ok?'correct':'wrong'); inp.disabled=true;
    const fb = container.querySelector('.feedback'); fb.className='feedback '+(ok?'ok':'ko');
    fb.textContent = ok ? `✔ Richtig: ${fmt(p.answer)} €` : (isNaN(v)?`✘ Keine Zahl erkannt. Lösung: ${fmt(p.answer)} €`:`✘ Deine Eingabe: ${fmt(v)} – Lösung: ${fmt(p.answer)} €`);
    return ok?1:0;
  }
  if(type==='self'){
    const sel = container.querySelector('.pill.active');
    const v = sel? Number(sel.dataset.v) : 0;
    const fb = container.querySelector('.feedback'); fb.className='feedback '+(v>=1?'ok':v>0?'':'ko');
    fb.textContent = sel ? (v>=1?'✔ Als gekonnt markiert':v>0?'◐ Teilweise – nochmal lesen':'✘ Als nicht gekonnt markiert') : '✘ Nicht bewertet (zählt als nicht gekonnt)';
    container.querySelectorAll('.pill').forEach(b=>b.disabled=true);
    return v;
  }
  return 0;
}
function wireSelfGrade(root){
  root.querySelectorAll('.self-grade').forEach(row=>row.querySelectorAll('.pill').forEach(b=>b.onclick=()=>{row.querySelectorAll('.pill').forEach(x=>x.classList.remove('active')); b.classList.add('active');}));
}

// ---------- Probeklausur ----------
let exam = null, examTimer = null;
function buildExam(){
  const pool = TASKS.filter(t=>t.exam && t.points<=10);
  const byTopic = {};
  pool.forEach(t=>{(byTopic[t.topic]=byTopic[t.topic]||[]).push(t);});
  const order = ['ao','est','kst','gewst','ust','sonst','fall'];
  let chosen=[], pts=0;
  // Mindestens eine Aufgabe je Thema (wie die echte Klausur: AO, ESt, KSt, GewSt, USt, GrESt)
  order.forEach(k=>{ const arr=(byTopic[k]||[]).slice().sort(()=>Math.random()-0.5); if(arr.length){chosen.push(arr[0]); pts+=arr[0].points;} });
  const rest = pool.filter(t=>!chosen.includes(t)).sort(()=>Math.random()-0.5);
  for(const t of rest){ if(pts>=48) break; if(pts+t.points<=56){ chosen.push(t); pts+=t.points; } }
  chosen.sort((a,b)=>order.indexOf(a.topic)-order.indexOf(b.topic));
  return {tasks:chosen, max:pts, start:Date.now(), duration:50*60};
}
function renderKlausur(){
  if(examTimer){clearInterval(examTimer); examTimer=null;}
  exam=null;
  const hist = state.exams.slice().reverse().slice(0,5);
  $('#view-klausur').innerHTML = `
  <h1>Probeklausur</h1>
  <p class="muted">Zufällige Zusammenstellung aus Klausur-Aufgabentypen aller Themen, ca. 50 Punkte, 50 Minuten mit Timer. Ohne Lösungen zwischendurch – erst nach „Abgeben“ siehst du die Auswertung mit allen Lösungswegen.</p>
  <div class="card"><h3>Regeln wie in der echten Klausur</h3><ul class="tight"><li>Hilfsmittel: Steuergesetze, nicht programmierbarer Taschenrechner.</li><li>Multiple Choice: Nur komplett richtige Kreuze zählen.</li><li>Erläuterungsaufgaben bewertest du selbst anhand der Musterlösung.</li><li>Bestanden ab 50 % (25 Punkte).</li></ul><button class="btn" id="start-exam">Probeklausur starten</button></div>
  ${hist.length?`<h2>Letzte Ergebnisse</h2><div class="card">${hist.map(e=>`<div class="histrow"><span>${e.date}</span><span>${e.score} / ${e.max} Punkte · ${e.pct} %</span><span><b>Note ${e.grade}</b></span></div>`).join('')}</div>`:''}`;
  $('#start-exam').onclick = startExam;
}
function gradeFor(pct){ const g=[[95,'1,0'],[90,'1,3'],[85,'1,7'],[80,'2,0'],[75,'2,3'],[70,'2,7'],[65,'3,0'],[60,'3,3'],[55,'3,7'],[50,'4,0']]; for(const [p,n] of g) if(pct>=p) return n; return '5,0'; }
function startExam(){
  exam = buildExam();
  const v=$('#view-klausur');
  v.innerHTML = `
  <div class="navrow" style="margin:0 0 12px;align-items:center"><h1 style="margin:0">Probeklausur · ${exam.max} Punkte</h1><span class="timer" id="timer">50:00</span></div>
  <p class="muted small">Bearbeite alle Aufgaben und klicke unten auf „Abgeben“. Der Timer läuft – bei 0:00 wird automatisch abgegeben.</p>
  ${exam.tasks.map((t,n)=>`<div class="card examq" data-id="${t.id}"><div class="qnum">Aufgabe ${n+1} <span class="muted small">(${t.points} Punkte · ${TOPICS[t.topic].short})</span></div><h3 style="margin-top:4px">${esc(t.title)}</h3><div class="sachverhalt">${t.text}</div>${t.parts.map((p,i)=>partHTML(t,p,i,'e')).join('')}</div>`).join('')}
  <div class="navrow"><button class="btn secondary" id="abort">Abbrechen</button><button class="btn" id="submit">Abgeben</button></div>`;
  wireSelfGrade(v);
  // In exam mode: hide model solutions for self parts until submit
  v.querySelectorAll('details.more').forEach(d=>{ d.querySelector('summary').textContent='Musterlösung (erst nach Abgabe sichtbar)'; d.querySelector('summary').style.pointerEvents='none'; d.querySelector('summary').style.color='var(--text-3)'; });
  $('#abort').onclick=()=>{ if(confirm('Probeklausur wirklich abbrechen? Das Ergebnis wird nicht gespeichert.')) renderKlausur(); };
  $('#submit').onclick=submitExam;
  const tick=()=>{ const left=Math.max(0, exam.duration - Math.floor((Date.now()-exam.start)/1000)); const m=String(Math.floor(left/60)).padStart(2,'0'), s=String(left%60).padStart(2,'0'); const el=$('#timer'); if(!el){clearInterval(examTimer);return;} el.textContent=`${m}:${s}`; el.classList.toggle('low', left<300); if(left<=0){ clearInterval(examTimer); toast('Zeit abgelaufen – Klausur wird abgegeben'); submitExam(); } };
  examTimer=setInterval(tick,1000); tick();
  window.scrollTo({top:0});
}
function submitExam(){
  if(!exam) return; if(examTimer){clearInterval(examTimer); examTimer=null;}
  // For self parts: reveal model solutions and let the user grade before final scoring
  const v=$('#view-klausur');
  const selfParts=[...v.querySelectorAll('.part[data-type="self"]')];
  const hasUngraded = selfParts.some(c=>!c.querySelector('.pill.active'));
  if(hasUngraded && !exam.selfPhase){
    exam.selfPhase=true;
    v.querySelectorAll('details.more').forEach(d=>{ const s=d.querySelector('summary'); s.textContent='Musterlösung anzeigen'; s.style.pointerEvents=''; s.style.color=''; d.open=true; });
    selfParts.forEach(c=>c.scrollIntoView&&null);
    toast('Bitte bewerte zuerst deine Erläuterungsaufgaben mit der Musterlösung');
    const first=selfParts.find(c=>!c.querySelector('.pill.active')); if(first) first.scrollIntoView({behavior:'smooth',block:'center'});
    $('#submit').textContent='Endgültig abgeben';
    return;
  }
  let score=0;
  exam.tasks.forEach(t=>{
    const card=v.querySelector(`.examq[data-id="${t.id}"]`);
    const parts=[...card.querySelectorAll('.part')];
    let sum=0; parts.forEach((c,i)=>{ sum+=evaluatePart(c,t.parts[i]); });
    const frac=sum/parts.length; const pts=Math.round(t.points*frac*2)/2; score+=pts;
    const st=taskStat(t.id); st.attempts++; st.last=frac; st.best=Math.max(st.best||0,frac); st.lastDate=todayKey(); state.tasks[t.id]=st;
    const sol=document.createElement('div'); sol.className='solution';
    sol.innerHTML=`<div class="hinweis"><b>${pts} von ${t.points} Punkten</b></div><details class="more" ${frac<0.999?'open':''}><summary>Lösungsweg, Gesetze und Stolperfallen</summary><div style="margin-top:8px">${t.solution}<h3>Rechtsgrundlagen</h3>${t.laws.map(l=>`<div class="law"><b>${esc(l)}</b></div>`).join('')}<h3>Stolperfallen</h3>${t.traps.map(x=>`<div class="trap">${x}</div>`).join('')}</div></details>`;
    card.appendChild(sol);
    v.querySelectorAll('details.more').forEach(d=>{ const s=d.querySelector('summary'); if(s.textContent.includes('Musterlösung')){ s.textContent='Musterlösung'; s.style.pointerEvents=''; s.style.color=''; d.open=true; } });
  });
  const pct=Math.round(score/exam.max*100); const grade=gradeFor(pct);
  const d=new Date(); const dateStr=d.toLocaleDateString('de-DE')+' '+d.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});
  state.exams.push({date:dateStr, score, max:exam.max, pct, grade}); recordActivity(); saveState();
  const res=document.createElement('div'); res.className='card'; res.style.borderColor= pct>=50?'var(--good)':'var(--bad)';
  res.innerHTML=`<div class="label muted small">Ergebnis</div><div class="result-big">${score} / ${exam.max} Punkte · ${pct} %</div><div style="font-size:1.2rem;margin:4px 0">Note <b>${grade}</b> ${pct>=50?'– bestanden ✔':'– nicht bestanden ✘'}</div><p class="muted small">Die Lösungen stehen jetzt unter jeder Aufgabe. Fehlerhafte Aufgaben findest du auch unter „Übungsaufgaben → Mit Fehlern“.</p><div class="navrow"><button class="btn" id="again">Neue Probeklausur</button><button class="btn secondary" id="toprog">Zum Fortschritt</button></div>`;
  v.insertBefore(res, v.children[2]);
  $('#submit').remove(); $('#abort').remove();
  $('#again').onclick=renderKlausur; $('#toprog').onclick=()=>showView('fortschritt');
  window.scrollTo({top:0});
}

  v.innerHTML = `

  <input class="search" id="law-search" type="search" placeholder="Suchen: z. B. 122, Einspruch, Hinzurechnung, § 8b …">
  <div class="pill-row"><button class="pill" id="open-all">Alle aufklappen</button><button class="pill" id="close-all">Alle zuklappen</button><button class="pill" id="show-schemas">Rechenschemata</button></div>
  <div id="schemas" style="display:none">${SCHEMAS.map(s=>`<div class="card"><h3 style="margin-top:0">${esc(s.title)}</h3><div class="schema">${esc(s.body)}</div></div>`).join('')}</div>
  <div id="laws">${LAWS.map((g,gi)=>`<div class="acc" data-g="${gi}"><button class="acchead"><span>${esc(g.name)} <span class="muted small" style="font-weight:400">· ${g.items.length} Normen</span></span><span class="arrow">▶</span></button><div class="accbody"><p class="muted small" style="margin:8px 0 4px">${esc(g.intro)}</p>${g.items.map(it=>`<div class="para" data-text="${esc((it.p+' '+it.t+' '+it.d+' '+it.k).toLowerCase())}"><span class="pn">${esc(it.p)}</span> – <span class="pt">${esc(it.t)}</span><div class="pd">${esc(it.d)}</div><div class="pk">${esc(it.k)}</div></div>`).join('')}</div></div>`).join('')}</div>`;
  v.querySelectorAll('.acchead').forEach(b=>b.onclick=()=>b.parentElement.classList.toggle('open'));
  $('#open-all').onclick=()=>v.querySelectorAll('.acc').forEach(a=>a.classList.add('open'));
  $('#close-all').onclick=()=>v.querySelectorAll('.acc').forEach(a=>a.classList.remove('open'));
  $('#show-schemas').onclick=()=>{const s=$('#schemas'); const show=s.style.display==='none'; s.style.display=show?'block':'none'; $('#show-schemas').classList.toggle('active',show);};
  $('#law-search').oninput=e=>{
    const q=e.target.value.trim().toLowerCase().replace(/§\s*/,'');
    v.querySelectorAll('.para').forEach(p=>{ p.style.display = (!q || p.dataset.text.replace(/§\s*/g,'').includes(q)) ? '' : 'none'; });
    v.querySelectorAll('.acc').forEach(a=>{ const vis=[...a.querySelectorAll('.para')].some(p=>p.style.display!=='none'); a.style.display=vis?'':'none'; if(q) a.classList.add('open'); });
  };
}

// ---------- Stolperfallen ----------
function renderFallen(){
  $('#view-fallen').innerHTML = `
  <h1>Stolperfallen</h1>
  <p class="muted">Die typischen Fehler, mit denen die Klausur Punkte abzieht – nach Themen sortiert. Lies die Liste am Abend vor der Klausur noch einmal komplett durch.</p>
  ${TRAPS.map(g=>`<div class="card"><h3 style="margin-top:0"><span class="chip t-${g.topic}">${TOPICS[g.topic].short}</span> ${TOPICS[g.topic].name}</h3>${g.items.map(x=>`<div class="trap">${esc(x)}</div>`).join('')}</div>`).join('')}
  <div class="card"><h3 style="margin-top:0">Klausurtaktik</h3><ul class="tight">
   <li>Lies bei Aussagen-Aufgaben auf Signalwörter: <b>stets, immer, nie, nur</b> sind meist falsch; <b>grundsätzlich, in der Regel</b> meist richtig.</li>
   <li>Bei Rechenaufgaben: Erst die Rechtsform klären (AG/GmbH vs. OHG/Einzelunternehmer) – davon hängen Freibetrag 24.500 €, § 35, § 8b vs. TEV, Abgeltungsteuer vs. Veranlagung ab.</li>
   <li>Immer prüfen, ob eine Zahl netto oder brutto gegeben ist (Dividende 7.500 netto = 10.000 brutto).</li>
   <li>Antwortoptionen nutzen: Wenn dein Ergebnis nicht dabei ist, hast du meistens einen der Standardfehler gemacht (Stückzinsen, Pauschbetrag, 95 % statt 100 %, Freibetrag vergessen).</li>
   <li>Paragrafen immer dazuschreiben – auch bei Multiple Choice auf die Rückseite. Das kann bei knappen Punkten helfen.</li>
  </ul></div>`;
}

// ---------- Fortschritt ----------
function renderFortschritt(){
  const all=topicStats('alle');
  const pct=all.total?Math.round(all.mastered/all.total*100):0;
  const attempts=Object.values(state.tasks).reduce((a,s)=>a+s.attempts,0);
  // last 28 days heat
  const days=[]; for(let i=27;i>=0;i--){const d=new Date(); d.setDate(d.getDate()-i); const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); days.push({k, n:state.days[k]||0});}
  const lvl=n=>n===0?'':n<3?'l1':n<6?'l2':n<10?'l3':'l4';
  const weak = TASKS.filter(t=>{const s=taskStat(t.id); return s.attempts>0&&s.best<0.999;}).sort((a,b)=>taskStat(a.id).best-taskStat(b.id).best).slice(0,8);
  $('#view-fortschritt').innerHTML = `
  <h1>Fortschritt</h1>
  <div class="grid cols-3">
   <div class="stat"><div class="label">Gemeistert</div><div class="value">${pct} %</div><div class="sub">${all.mastered} von ${all.total} Aufgaben fehlerfrei</div></div>
   <div class="stat"><div class="label">Bearbeitet</div><div class="value">${all.done} / ${all.total}</div><div class="sub">${attempts} Versuche insgesamt</div></div>
   <div class="stat"><div class="label">Punkte-Potenzial</div><div class="value">${Math.round(all.earned)} / ${all.pts}</div><div class="sub">beste Ergebnisse summiert</div></div>
   <div class="stat"><div class="label">Streak</div><div class="value">${streak()} Tage</div><div class="sub">Tage in Folge geübt</div></div>
   <div class="stat"><div class="label">Probeklausuren</div><div class="value">${state.exams.length}</div><div class="sub">${state.exams.length?'Ø '+Math.round(state.exams.reduce((a,e)=>a+e.pct,0)/state.exams.length)+' %':'noch keine'}</div></div>
   <div class="stat"><div class="label">Tage bis zur Klausur</div><div class="value">${Math.max(0,Math.ceil((EXAM_DATE-new Date())/86400000))}</div><div class="sub">16.11.2026</div></div>
  </div>
  <h2>Nach Themen</h2>
  <div class="card">${Object.keys(TOPICS).map(k=>{const s=topicStats(k); const p=s.total?Math.round(s.mastered/s.total*100):0; const pd=s.total?Math.round(s.done/s.total*100):0; return `<div class="topicrow" data-topic="${k}" style="cursor:pointer"><span class="chip t-${k}">${TOPICS[k].short}</span><span class="name">${TOPICS[k].name}</span><div class="bar thick" title="${s.done} bearbeitet, ${s.mastered} gemeistert"><span style="width:${pd}%;background:var(--primary-light);position:absolute;left:0;top:0"></span><span class="${p===100?'good':''}" style="width:${p}%;position:absolute;left:0;top:0"></span></div><span class="nums">${s.mastered} / ${s.total} · ${p} %</span></div>`;}).join('')}
  <p class="muted small" style="margin:10px 0 0">Dunkelblau = gemeistert, hellblau = bearbeitet, grau = offen. Klicke auf ein Thema, um dort zu üben.</p></div>
  <h2>Aktivität der letzten 4 Wochen</h2>
  <div class="card"><div class="heatline">${days.map(d=>`<span class="${lvl(d.n)}" title="${d.k}: ${d.n} Aufgaben"></span>`).join('')}</div><p class="muted small" style="margin:8px 0 0">Ein Kästchen pro Tag; je dunkler, desto mehr Aufgaben.</p></div>
  ${weak.length?`<h2>Deine Schwachstellen</h2><div class="card">${weak.map(t=>`<div class="histrow" style="cursor:pointer" data-id="${t.id}"><span><span class="chip t-${t.topic}">${TOPICS[t.topic].short}</span>${esc(t.title)}</span><span class="muted">beste ${Math.round(taskStat(t.id).best*100)} %</span></div>`).join('')}</div>`:''}
  ${state.exams.length?`<h2>Probeklausuren</h2><div class="card">${state.exams.slice().reverse().map(e=>`<div class="histrow"><span>${e.date}</span><span>${e.score} / ${e.max} · ${e.pct} %</span><span><b>Note ${e.grade}</b></span></div>`).join('')}</div>`:''}
  <div class="card"><h3 style="margin-top:0">Daten</h3><p class="muted small">Der Fortschritt wird lokal in diesem Browser gespeichert. Mit Export/Import kannst du ihn auf ein anderes Gerät übertragen.</p><div class="navrow" style="justify-content:flex-start"><button class="btn secondary sm" id="export">Export (JSON)</button><label class="btn secondary sm" style="cursor:pointer">Import <input type="file" id="import" accept="application/json" style="display:none"></label><button class="btn danger sm" id="reset">Fortschritt zurücksetzen</button></div></div>`;
  document.querySelectorAll('#view-fortschritt .topicrow').forEach(r=>r.onclick=()=>{state.lastTopic=r.dataset.topic; state.lastStatus='alle'; saveState(); showView('ueben');});
  document.querySelectorAll('#view-fortschritt .histrow[data-id]').forEach(r=>r.onclick=()=>openTask(r.dataset.id));
  $('#export').onclick=()=>{ const blob=new Blob([JSON.stringify(state)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='steuerlehre-fortschritt.json'; a.click(); };
  $('#import').onchange=e=>{ const f=e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{ try{ const s=JSON.parse(r.result); if(s.tasks){ state=s; saveState(); toast('Fortschritt importiert'); renderFortschritt(); } }catch(err){ toast('Datei konnte nicht gelesen werden'); } }; r.readAsText(f); };
  $('#reset').onclick=()=>{ if(confirm('Wirklich den gesamten Fortschritt löschen?')){ state={tasks:{},exams:[],days:{},lastTopic:'alle',lastStatus:'alle',lastDiff:'alle'}; saveState(); renderFortschritt(); toast('Zurückgesetzt'); } };
}

// ---------- Init ----------
updateCountdown(); setInterval(updateCountdown, 60000);
showView('home');
</script></body></html>
